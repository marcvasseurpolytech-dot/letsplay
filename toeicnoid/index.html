  ['......', 'cccccc', 'rrrrrr', 'yyyyyy', 'SS..SS'],
  ['......', 'y.....', 'yc....', 'ycr...', 'ycrb..', 'ycrbm.', 'ycrbmn', 'SSSSSS'],
  ['......', 'g.yy.g', '.cccc.', 'grrrrg', '.bbbb.', 'g.mm.g', '..SS..'],

  ['......', 'y.c.m.', '.b.r.n', 'w.o.s.', '.c.y.m', 'n.b.r.', '.w.o.s', 'S.S.S.'],
  ['......', 'rnrnrn', 'bgbgbg', 'mymymy', 'cgcgcg', 'wowowo', 'SSSSSS'],
  ['......', '.y..y.', 'gwwwwg', 'wrwwrw', 'wwwwww', '.w..w.', '..SS..'],
  ['......', 'yyyyyy', 'cSmmSc', 'rrrrrr', '.nnnn.', '..oo..', 'SSSSSS']

/* ------------------------------------------------------------
   Utilitaires
   ------------------------------------------------------------ */
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function pad7(n) { return String(Math.max(0, Math.floor(n))).padStart(7, '0'); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ------------------------------------------------------------
   Sons : synthèse façon SID (impulsions 25 %, carrés, bruit)
   ------------------------------------------------------------ */
let AC = null, master = null, muted = lsGet('tnMuted') === '1';
const pulseCache = {};

  if (!AC) {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return null;
    AC = new A(); master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination);

  if (AC.state === 'suspended') AC.resume();

function pulseWave(d) {
  if (!pulseCache[d]) {
    const n = 40, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * d);

function tone(f0, f1, dur, o) {

function noise(dur, o) {
  o = o || {};
  if (muted || !audio()) return;

  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);

  f.frequency.setValueAtTime(o.f0 || 3000, t); f.frequency.exponentialRampToValueAtTime(o.f1 || 300, t + dur);

  wall() { tone(262, 247, 0.06, { type: 'pulse', duty: 0.5, vol: 0.45 }); },

/* ------------------------------------------------------------
   Décors pré-rendus (motifs C64 : losanges bleus, tourbillon rouge, circuit gris, losanges verts)
   ------------------------------------------------------------ */
function makeBg(type, sc, hd) {
  const c = document.createElement('canvas'); c.width = IW * sc; c.height = IH * sc;
  const g = c.getContext('2d'); g.scale(sc, sc); const r = mulberry(1000 + type);
  if (type === 0 || type === 3) {
    const P = type === 0 ? ['#14148c', '#2a2ad0', '#5a5aff', '#0a0a58'] : ['#0c3a2c', '#1a7a50', '#48d890', '#06241a'];
    g.fillStyle = P[0]; g.fillRect(0, 0, IW, IH);
    for (let row = -1; row < IH / 16 + 1; row++) for (let col = -1; col < IW / 32 + 1; col++) {
      const x = col * 32 + (row & 1 ? 16 : 0), y = row * 16;

  G.px = clamp(G.px, IX, IX + IW - G.pw);
  if (doorReach && G.state === 'play') roundClear(true);
}
function roundClear(viaDoor) {
  G.state = 'clear'; G.stateT = 0; SND.clear();
  G.score += viaDoor ? 1500 : 1000;
  popup(IX + IW / 2, IY + IH / 2, viaDoor ? 'BREAK BONUS 1500' : 'ROUND CLEAR 1000', '#ffff98');
  G.balls = []; G.caps = []; G.enemies = []; G.bolts = [];
}

function stepBall(b, h) {
  if (b.stuck) { b.x = G.px + G.pw / 2 + b.off; b.y = PY - 6; b.trail = []; return; }
  const r = 5, spd = baseSpeed();
  let s = Math.hypot(b.vx, b.vy) || spd; b.vx *= spd / s; b.vy *= spd / s;
  b.x += b.vx * h; b.y += b.vy * h;
  b.tc = (b.tc || 0) + 1; if (b.tc % 3 === 0) { (b.trail = b.trail || []).push({ x: b.x, y: b.y }); if (b.trail.length > 12) b.trail.shift(); }
  if (b.x - r < IX) { b.x = IX + r; b.vx = Math.abs(b.vx); SND.wall(); }
  if (b.x + r > IX + IW) { b.x = IX + IW - r; b.vx = -Math.abs(b.vx); SND.wall(); }
  if (b.y - r < IY) { b.y = IY + r; b.vy = Math.abs(b.vy); SND.wall(); }
  // raquette
  if (b.vy > 0 && b.y + r >= PY && b.y - r <= PY + PH && b.x >= G.px - r && b.x <= G.px + G.pw + r && b.y < PY + PH * 0.8) {
    const t = clamp((b.x - (G.px + G.pw / 2)) / (G.pw / 2), -1, 1), a = t * 1.12;
    b.y = PY - r; b.vx = Math.sin(a) * spd; b.vy = -Math.cos(a) * spd; SND.paddle(); G.hits++;
    if (G.hits % 6 === 0) G.heat = Math.min(40, G.heat + 1);
    if (G.mode === 'catch') { b.stuck = true; b.off = b.x - (G.px + G.pw / 2); b.vx = b.vy = 0; }
  }
  // briques
  for (let i = 0; i < G.bricks.length; i++) {
    const k = G.bricks[i];
    const cx = clamp(b.x, k.x, k.x + k.w), cy = clamp(b.y, k.y, k.y + k.h);
    const dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy < r * r) {
      if (dx === 0 && dy === 0) { b.vy = -b.vy; }
      else if (Math.abs(dx) > Math.abs(dy)) { b.vx = (dx > 0 ? 1 : -1) * Math.abs(b.vx); b.x = cx + (dx > 0 ? 1 : -1) * r; }
      else { b.vy = (dy > 0 ? 1 : -1) * Math.abs(b.vy); b.y = cy + (dy > 0 ? 1 : -1) * r; }
      hitBrick(k);
      break;
    }
  }
  // ennemis
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i], dx = b.x - e.x, dy = b.y - e.y, d = Math.hypot(dx, dy);
    if (d < 15 + r) {
      const nx = dx / (d || 1), ny = dy / (d || 1), dot = b.vx * nx + b.vy * ny;
      b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; if (b.vy > -0.2 * spd && b.y < e.y) b.vy = -0.4 * spd;
      killEnemy(e); break;
    }
  }
  // garde-fous d'angle
  if (Math.abs(b.vy) < 0.24 * spd) { b.vy = (b.vy < 0 ? -1 : 1) * 0.24 * spd; }
  s = Math.hypot(b.vx, b.vy); b.vx *= spd / s; b.vy *= spd / s;
}
function killEnemy(e) {
  SND.enemy(); G.score += 100; burst(e.x, e.y, '#9af0f4', 14, 200); burst(e.x, e.y, '#ffffff', 6, 120);
  G.enemies.splice(G.enemies.indexOf(e), 1);
  enemyDrop(e);
}

function update(dt) {
  G.t += dt;
  if (G.state === 'title' || G.state === 'gameover' || G.state === 'paused') return;
  G.stateT += dt; G.doorBlink += dt;
  if (G.bannerT > 0) G.bannerT -= dt;
  G.bricks.forEach((b) => { if (b.flash > 0) b.flash -= dt; });
  G.parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; p.life -= dt; });
  G.parts = G.parts.filter((p) => p.life > 0);
  G.pops.forEach((p) => { p.t += dt; });
  G.pops = G.pops.filter((p) => p.t < 1.3);
  G.selT += dt;
  if (G.found) { G.found.t += dt; if (G.found.t > 4) G.found = null; }

  if (G.state === 'dead') {
    if (G.stateT > 1.1) { G.px = IX + IW / 2 - G.pw / 2; G.pw = G.pwTarget = 64; resetBall(); G.state = 'ready'; G.stateT = 0; }
    return;
  }
  if (G.state === 'clear') {
    if (G.stateT > 2.4) startRound(G.round + 1);
    return;
  }

  movePaddle(dt);
  if (G.state === 'ready') {
    G.balls.forEach((b) => stepBall(b, dt));
    if (G.bot && G.stateT > 0.8 && G.bannerT <= 0) fire();
    return;
  }

  // jeu
  if (G.slowT > 0) G.slowT -= dt;
  if (G.laserCd > 0) G.laserCd -= dt;
  const steps = 2, h = dt / steps;
  for (let s = 0; s < steps; s++) {
    G.balls.forEach((b) => stepBall(b, h));
    if (G.state !== 'play') return;
  }
  G.balls = G.balls.filter((b) => b.stuck || b.y - 5 < IY + IH + 8);
  if (!G.balls.length && G.state === 'play') { loseLife(); return; }
  if (G.bot && G.balls.some((b) => b.stuck)) { if (!G.botT) G.botT = 0; G.botT += dt; if (G.botT > 0.5) { fire(); G.botT = 0; } }
  if (G.bot && G.mode === 'laser') fire();

  // capsules
  G.caps.forEach((c) => { c.y += 130 * dt; c.t += dt; });
  G.caps = G.caps.filter((c) => {
    if (c.y > PY - 8 && c.y < PY + PH + 8 && c.x > G.px - 20 && c.x < G.px + G.pw + 20) { applyCapsule(c.k); return false; }
    return c.y < IY + IH + 20;
  });
  // tirs
  G.bolts.forEach((q) => { q.y -= 560 * dt; });
  G.bolts = G.bolts.filter((q) => {
    if (q.y < IY) return false;
    for (const k of G.bricks) { if (q.x > k.x && q.x < k.x + k.w && q.y > k.y && q.y < k.y + k.h) { hitBrick(k); return false; } }
    for (const e of G.enemies) { if (Math.hypot(q.x - e.x, q.y - e.y) < 16) { killEnemy(e); return false; } }
    return true;
  });
  // ennemis
  G.enemyT -= dt;
  if (G.enemyT <= 0 && G.enemies.length < 3) {
    G.enemyT = 7 + Math.random() * 6;
    const gx = Math.random() < 0.5 ? IX + 152 : IX + 392;
    G.enemies.push({ x: gx, x0: gx, y: IY + 6, t: Math.random() * 6, ph: Math.random() * 6 });
  }
  G.enemies.forEach((e) => { e.t += dt; e.y += 52 * dt; e.x = clamp(e.x0 + Math.sin(e.t * 1.7 + e.ph) * 70, IX + 20, IX + IW - 20); });
  G.enemies = G.enemies.filter((e) => e.y < IY + IH + 20);
  // fin de round
  if (remaining() === 0 && G.state === 'play') roundClear(false);
}

function fire() {
  if (G.state === 'ready') {
    if (G.bannerT > 0.3) return;
    G.state = 'play'; G.stateT = 0; releaseAll(); return;
  }
  if (G.state !== 'play') return;
  if (G.balls.some((b) => b.stuck)) { releaseAll(); return; }
  if (G.mode === 'laser' && G.laserCd <= 0) {
    G.laserCd = 0.26; SND.laser();
    G.bolts.push({ x: G.px + 7, y: PY }, { x: G.px + G.pw - 7, y: PY });
  }
}

function txt(s, x, y, size, col, align, shadow) {

  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, x + 1, y + 1); }

}

  ctx.font = size + 'px ' + FONT;

function rr(x, y, w, h, r) {

    }

    ctx.fillStyle = fl ? '#ffffff' : c.base; ctx.fillRect(ix, iy, iw, ih);
    ctx.fillStyle = fl ? '#ffffff' : c.light; ctx.fillRect(ix, iy, iw, 5); ctx.fillRect(ix, iy, 2, ih);
    ctx.fillStyle = c.dark; ctx.fillRect(ix, iy + ih - 5, iw, 5); ctx.fillRect(ix + iw - 2, iy, 2, ih);

}

let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; acc += dt;
  const H1 = 1 / 120;
  while (acc >= H1) { update(H1); acc -= H1; }
  draw(); syncAuth();
  requestAnimationFrame(frame);
}

  box.innerHTML = h;
  { const fn = $('#fNom'); if (fn) { fn.value = PR.draft; fn.addEventListener('input', () => { PR.draft = fn.value; }); } }
  box.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { PR.mode = t.getAttribute('data-t'); PR.msg = ''; renderAuth(); }));
  const ru = $('#aRules'); if (ru) ru.addEventListener('click', () => { PR.min = true; renderAuth(); });
  const go = $('#aGo');
  if (go) {
    const submit = () => {
      const su = PR.mode === 'signup', body = { nom: $('#fNom').value.trim(), code: $('#fCode').value.trim() }, m = $('#aMsg');
      if (!body.nom) { m.textContent = 'Please enter your name.'; return; }
      if (!/^\d{4}$/.test(body.code)) { m.textContent = 'Your secret code must be exactly 4 digits.'; return; }
      go.disabled = true; m.textContent = 'Please wait...';
      apiPost(su ? 'signup' : 'login', body).then((r) => {
        if (r.ok) { onAuth(r.j); return; }
        go.disabled = false; PR.msg = r.j.error || 'Something went wrong.';
        if (r.status === 0) PR.offline = true;
        renderAuth();
      });
    };
    go.addEventListener('click', submit);
    box.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); }));
  }
  const gs = $('#aGuest'); if (gs) gs.addEventListener('click', () => { PR.guest = true; renderAuth(); });
  const nw = $('#aNew'); if (nw) nw.addEventListener('click', () => { audio(); if (!canStart() || G.state !== 'title') return; if (PR.user && hasCheckpoint()) { PR.confirm = true; renderAuth(); } else newGame(); });
  const yes = $('#aYes'); if (yes) yes.addEventListener('click', () => { audio(); PR.confirm = false; if (canStart() && G.state === 'title') newGame(); });
  const no = $('#aNo'); if (no) no.addEventListener('click', () => { PR.confirm = false; renderAuth(); });
  const ct = $('#aCont'); if (ct) ct.addEventListener('click', () => { audio(); if (canStart() && G.state === 'title') { const cp = PR.cp; openQuiz((w) => newGame(cp, w), null); } });
  const ou = $('#aOut'); if (ou) ou.addEventListener('click', logout);
}
function syncAuth() {
  const want = G.state === 'title' && !QZ;
  if (want === PR.shown) return;
  PR.shown = want; if (want) { PR.min = false; PR.confirm = false; }
  document.getElementById('auth').classList[want ? 'add' : 'remove']('on');
  if (want) renderAuth();
}

/* ------------------------------------------------------------
   Quiz de reprise : 3 bonnes réponses de grammaire (phrases à trous, banque partagée avec Word Bridge)
   ------------------------------------------------------------ */
const QTYPES = ['c', 'v', 'f', 'p', 'x', 'l'];
let QZ = null;
function qPool() {
  const B = window.WB_BANK;
  if (!B || !B.NORMAL) return [];
  return B.NORMAL.filter((q) => q.s && q.o && q.o.length >= 3 && q.s.indexOf('___') >= 0 && QTYPES.indexOf(q.t) >= 0);
}
function openQuiz(onDone, onCancel) {
  const pool = shuffle(qPool());
  if (!pool.length) { onDone(); return; }
  QZ = { ok: 0, need: 3, done: 0, res: [], wrong: 0, tl: 10, timer: null, pool, idx: 0, q: null, opts: [], answered: false, last: '', onDone, onCancel };
  document.getElementById('auth').classList.remove('on'); PR.shown = false;
  nextQuestion();
  document.getElementById('quiz').classList.add('on');
}
function nextQuestion() {
  let k = QZ.idx;
  while (k < QZ.pool.length - 1 && QZ.pool[k].t === QZ.last) k++;      // varier les types de questions
  const q = QZ.pool.splice(k, 1)[0];
  QZ.q = q; QZ.last = q.t; QZ.opts = shuffle(q.o.slice()); QZ.answered = false;
  renderQuiz(); startQTimer();
}
function stopQTimer() { if (QZ && QZ.timer) { clearInterval(QZ.timer); QZ.timer = null; } }
function startQTimer() {
  stopQTimer(); QZ.tl = 10; QZ.t0 = performance.now();
  const z = QZ;
  z.timer = setInterval(() => {
    if (QZ !== z || z.answered) { clearInterval(z.timer); z.timer = null; return; }
    z.tl = Math.max(0, 10 - (performance.now() - z.t0) / 1000);
    const bar = document.querySelector('#quizBox .tbar'), fill = bar && bar.firstChild;
    if (fill) { fill.style.width = (z.tl * 10) + '%'; bar.classList.toggle('low', z.tl <= 3); }
    if (z.tl <= 0) answerQuestion(-1);
  }, 100);
}
function renderQuiz() {
  const box = document.getElementById('quizBox'), q = QZ.q;
  const sentence = esc(q.s).replace('___', '<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  let dots = ''; for (let i = 0; i < QZ.need; i++) dots += QZ.res[i] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[i] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.innerHTML = '<h2>BACK IN THE GAME</h2><p class="sub">Answer 3 grammar questions to continue (3 questions, no more). You have 10 seconds per question.</p>' +
    (nBrokenOf(PR.cp) ? '<p class="pen">Each wrong answer or timeout: 2 broken bricks come back' + (QZ.wrong ? ' (so far ' + Math.min(QZ.wrong * 2, nBrokenOf(PR.cp)) + ')' : '') + '</p>' : '') +
    '<div class="tbar"><i></i></div><div class="dots">' + dots + '</div>' +
    '<div class="qs">' + sentence + '</div><div class="opts">' + QZ.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<div class="fb" id="qfb"></div><div class="row"><button class="btn" id="qNext" style="display:none"></button>' + (QZ.onCancel !== undefined ? '<button class="btn ghost sm" id="qBack">Back</button>' : '') + '</div>';
  box.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => answerQuestion(parseInt(b.getAttribute('data-i'), 10))));
  const bk = box.querySelector('#qBack'); if (bk) bk.addEventListener('click', closeQuiz);
}
function answerQuestion(i) {
  if (!QZ || QZ.answered) return;
  QZ.answered = true; stopQTimer();
  const q = QZ.q, good = i >= 0 && QZ.opts[i] === q.o[0], box = document.getElementById('quizBox');
  PR.qN++; QZ.done++; QZ.res.push(good ? 1 : 0); if (good) { PR.qOk++; QZ.ok++; } else QZ.wrong++;
  if (PR.user) scheduleSave();
  box.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (QZ.opts[k] === q.o[0]) b.classList.add('ok'); else if (k === i) b.classList.add('no'); });
  const dn = QZ.done >= QZ.need;
  box.querySelector('#qfb').innerHTML = (good ? '<b class="g">Correct!</b>' : '<b class="r">' + (i < 0 ? 'Time is up!' : 'Not quite.') + '</b> The answer is <b class="g">' + esc(q.o[0]) + '</b>.') + (q.fr ? '<br><i>' + esc(q.fr) + '</i>' : '') + (QZ.wrong && nBrokenOf(PR.cp) ? '<br><b class="r">' + Math.min(QZ.wrong * 2, nBrokenOf(PR.cp)) + ' bricks will come back.</b>' : '');
  const nx = box.querySelector('#qNext'); nx.style.display = ''; nx.innerHTML = dn ? 'CONTINUE' : 'NEXT QUESTION (' + (QZ.done + 1) + ' / ' + QZ.need + ')';
  let dots = ''; for (let k = 0; k < QZ.need; k++) dots += QZ.res[k] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[k] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.querySelector('.dots').innerHTML = dots;
  nx.addEventListener('click', () => { if (dn) { const f = QZ.onDone, w = QZ.wrong; QZ = null; document.getElementById('quiz').classList.remove('on'); f(w); } else nextQuestion(); });
}
function closeQuiz() {
  stopQTimer();
  const cb = QZ && QZ.onCancel; QZ = null; document.getElementById('quiz').classList.remove('on');
  if (cb) cb();
}
HD = lsGet('tnHD') !== '0'; applyQuality();
restoreSession();
try { window.addEventListener('pagehide', () => flush()); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); }); } catch (e) {}

function boot() { requestAnimationFrame((t) => { last = t; frame(t); }); }
let booted = false; const go = () => { if (!booted) { booted = true; boot(); } };
if (document.fonts && document.fonts.load) { Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('62px "Press Start 2P"')]).then(go, go); setTimeout(go, 1500); } else go();

window.__tn = { PR, openQuiz, qState: () => QZ, answerQuestion, renderAuth, setHD: (v) => { HD = v; applyQuality(); }, G, VERBS, LEVELS, update, draw, newGame, fire, startRound, hitBrick, remaining, collection, keys, SND };
})();
</script>
