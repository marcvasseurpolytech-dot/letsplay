<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC Arcade</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--red:#e8222b;--org:#ff8a1f;--blue:#1e5cff;--yel:#ffd21f;--grn:#34e07a;--cy:#38e8ff;--wood:#2a1a12}
*{box-sizing:border-box}
html{background:#07030f}
body{margin:0;min-height:100vh;color:#fff;font-family:'Press Start 2P',ui-monospace,Menlo,monospace;padding:18px 10px 34px;
 background:
 radial-gradient(ellipse at 50% 0,rgba(255,60,140,.28),transparent 55%),
 radial-gradient(ellipse at 50% 100%,rgba(30,92,255,.3),transparent 55%),
 repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px),
 repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px),#07030f}
.cab{max-width:720px;margin:0 auto;position:relative}
.marquee{position:relative;text-align:center;padding:16px 8px 14px;border:4px solid #000;border-bottom:0;border-radius:14px 14px 0 0;
 background:linear-gradient(#ff3b3b,#b0101c 55%,#7a0a14);box-shadow:0 0 26px rgba(255,60,60,.7),inset 0 0 22px rgba(255,255,255,.35);overflow:hidden}
.marquee:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.1) 22px 34px)}
.marquee h1{position:relative;margin:0;font-size:clamp(20px,6.4vw,42px);letter-spacing:2px;color:#fff;text-shadow:3px 3px 0 #1e5cff,6px 6px 0 #000,0 0 18px #fff}
.marquee h1 span{color:var(--yel)}
.marquee p{position:relative;margin:10px 0 0;font-size:clamp(7px,1.9vw,10px);color:var(--yel);letter-spacing:2px;animation:blink 1.4s steps(2) infinite}
.body{display:flex;border:4px solid #000;border-top:0;background:var(--wood)}
.side{width:clamp(22px,6vw,46px);flex:none;background:
 repeating-linear-gradient(135deg,var(--org) 0 12px,var(--red) 12px 24px,var(--blue) 24px 36px,#0a1a55 36px 48px);box-shadow:inset 0 0 14px rgba(0,0,0,.65)}
.mid{flex:1;min-width:0;background:linear-gradient(#1b1b24,#0d0d14);padding:clamp(8px,2.2vw,16px)}
.bezel{border-radius:18px;padding:clamp(8px,2vw,14px);background:linear-gradient(145deg,#3a3a46,#121218);box-shadow:inset 0 0 0 3px #000,inset 0 4px 10px rgba(255,255,255,.14),0 6px 0 #000}
.screen{position:relative;border-radius:22px / 26px;overflow:hidden;background:#02060a;border:3px solid #000;min-height:420px;
 box-shadow:inset 0 0 70px rgba(0,255,150,.18),inset 0 0 8px #000,0 0 22px rgba(56,232,255,.28)}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%);
 animation:flick 5s infinite}
.hud{display:flex;justify-content:space-between;gap:6px;padding:10px 12px 8px;font-size:clamp(6px,1.8vw,9px);border-bottom:2px solid rgba(56,232,255,.35);text-transform:uppercase}
.hud b{display:block;margin-top:5px;font-weight:400;font-size:clamp(8px,2.3vw,12px)}
.hud .c1{color:var(--red)}.hud .c1 b{color:#fff}.hud .c2{color:var(--yel);text-align:center}.hud .c2 b{color:#fff}.hud .c3{color:var(--cy);text-align:right}.hud .c3 b{color:#fff}
.view{padding:14px 12px 16px;font-size:clamp(7px,2vw,10px);line-height:1.9;position:relative;z-index:1}
.ttl{color:var(--yel);text-align:center;font-size:clamp(9px,2.6vw,13px);margin:4px 0 12px;text-shadow:2px 2px 0 #b0101c}
.blink{animation:blink 1s steps(2) infinite}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;font:inherit;font-size:inherit;color:var(--cy);background:transparent;border:2px solid var(--cy);padding:9px 4px;cursor:pointer}
.tab.on{background:var(--cy);color:#001018}
label{display:block;color:var(--grn);margin:8px 0 2px}
input{width:100%;font-family:inherit;font-size:max(16px,1em);color:var(--yel);background:#000;border:2px solid var(--grn);padding:10px;margin:2px 0 4px;outline:none;letter-spacing:2px;border-radius:0}
input:focus{border-color:var(--yel);box-shadow:0 0 10px rgba(255,210,31,.6)}
.msg{color:#ff5a5a;min-height:20px;margin:6px 0}
.btn{font:inherit;font-size:inherit;color:#fff;background:transparent;border:2px solid #fff;padding:10px 12px;cursor:pointer}
.btn.solid{background:var(--red);border-color:var(--red);box-shadow:0 4px 0 #6e0c12}
.btn.solid:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.5}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.who b{color:var(--yel)}
.menu{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:8px;padding:9px 8px;border:2px solid transparent;cursor:pointer;color:#cfe;text-decoration:none}
.row .cur{width:14px;color:var(--yel);visibility:hidden}
.row .code{color:var(--red);width:2.6em;flex:none}
.row .nm{flex:1;min-width:0}
.row .sc{color:var(--cy);text-align:right;font-size:.85em;flex:none}
.row.on{background:rgba(255,210,31,.12);border-color:var(--yel);color:#fff}
.row.on .cur{visibility:visible;animation:blink .7s steps(2) infinite}
.info{margin-top:12px;border:2px solid var(--blue);padding:10px;background:rgba(30,92,255,.12);min-height:92px}
.info .d{color:#fff}.info .t{color:var(--grn);margin-top:6px}.info .s{color:var(--cy);margin-top:6px}
.hint{color:#8a96a8;margin-top:10px;text-align:center;font-size:.85em}
.panelbox{position:relative;margin-top:14px;padding:14px clamp(10px,3vw,22px) 16px;border-radius:10px 10px 4px 4px;
 background:linear-gradient(#2c2c3a,#171722);box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 6px 0 #000;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stick{position:relative;width:64px;height:64px;flex:none;cursor:pointer;border:0;background:none;padding:0}
.stick i{position:absolute;left:50%;bottom:6px;width:10px;height:34px;margin-left:-5px;background:linear-gradient(90deg,#999,#fff,#777);transform-origin:50% 100%;transition:transform .08s}
.stick u{position:absolute;left:50%;top:2px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,var(--red) 55%,#7a0a14);box-shadow:0 3px 0 #000;transition:transform .08s}
.stick:after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:12px;border-radius:50%;background:#000}
.stick.l i{transform:rotate(-16deg)}.stick.l u{transform:translate(-9px,3px)}
.stick.r i{transform:rotate(16deg)}.stick.r u{transform:translate(9px,3px)}
.btns{display:flex;gap:clamp(8px,2.4vw,16px);align-items:flex-end}
.pb{border:0;cursor:pointer;width:clamp(36px,9vw,48px);height:clamp(36px,9vw,48px);border-radius:50%;font:inherit;font-size:8px;color:#000;box-shadow:0 5px 0 #000,inset 0 -4px 6px rgba(0,0,0,.35),inset 0 3px 5px rgba(255,255,255,.6)}
.pb:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.pb.y{background:var(--yel)}.pb.b{background:var(--blue);color:#fff}.pb.g{background:var(--grn)}
.start{border:0;cursor:pointer;font:inherit;font-size:clamp(7px,2vw,9px);color:#fff;background:var(--red);padding:12px 10px;border-radius:6px;box-shadow:0 5px 0 #6e0c12,0 0 14px rgba(232,34,43,.6);animation:glow 1.2s ease-in-out infinite alternate}
.start:active{transform:translateY(4px);box-shadow:none}
.lower{border:4px solid #000;border-top:0;border-radius:0 0 12px 12px;padding:12px;background:linear-gradient(#20120c,#120a06);display:flex;align-items:center;justify-content:center;gap:16px}
.door{display:flex;align-items:center;gap:12px;background:#0b0b0b;border:3px solid #444;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;color:var(--yel);font-size:clamp(6px,1.8vw,8px)}
.slot{width:12px;height:34px;background:#000;border:2px solid #888;border-radius:2px;box-shadow:0 0 8px var(--yel)}
.coinlbl{line-height:1.8;text-align:left}
.credit{margin-top:22px;text-align:center;color:#9aa;font-size:7px;line-height:2}
@keyframes blink{50%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.93}50%{opacity:1}}
@keyframes glow{to{box-shadow:0 5px 0 #6e0c12,0 0 26px rgba(255,60,60,.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:480px){.view{padding:12px 8px}.row{padding:8px 4px;gap:5px}.row .sc{display:none}.screen{min-height:380px}}
</style>
</head>
<body>
<div class="cab">
  <div class="marquee"><h1>TOEIC <span>ARCADE</span></h1><p>&#9733; ENGLISH POWER GAMES &#9733;</p></div>
  <div class="body">
    <div class="side"></div>
    <div class="mid">
      <div class="bezel"><div class="screen">
        <div class="hud"><div class="c1">1UP<b id="hu">---</b></div><div class="c2">HI-SCORE<b id="hh">0</b></div><div class="c3">CREDIT<b id="hc">00</b></div></div>
        <div class="view"><div id="auth"></div><div id="games"></div></div>
      </div></div>
      <div class="panelbox">
        <button class="stick" id="stick" aria-label="Joystick: next game" title="Next game"><i></i><u></u></button>
        <button class="start" id="start">1P START</button>
        <div class="btns"><button class="pb y" id="bPrev" aria-label="Previous game">&#9650;</button><button class="pb b" id="bNext" aria-label="Next game">&#9660;</button><button class="pb g" id="bSnd" aria-label="Toggle sound">SND</button></div>
      </div>
    </div>
    <div class="side"></div>
  </div>
  <div class="lower"><button class="door" id="coin" type="button"><span class="slot"></span><span class="coinlbl">INSERT COIN<br>1 PLAY = 1 CODE</span></button></div>
  <p class="credit">Your name and 4-digit code are the same in every game.<br>Progress is saved automatically.<br>Games by Marc VASSEUR / Polytech Lille | marc.vasseur@polytech-lille.fr</p>
</div>
<script>
(function(){
'use strict';
var API=location.protocol==='file:'?'https://letsplay-nine.vercel.app/api/player':'/api/player';
var P={user:null,token:null,data:null,mode:'login',msg:'',draft:'',offline:false};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function $(q){return document.querySelector(q)}
function post(action,body){
  var h={'Content-Type':'application/json'};if(P.token)h.Authorization='Bearer '+P.token;
  return fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action:action},body||{}))})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}},function(){return {ok:false,status:r.status,j:{}}})});
}
function save(){if(P.user&&P.token)lsSet('letsplaySession',JSON.stringify({user:P.user,token:P.token}));else lsDel('letsplaySession')}
function nWords(sc){return sc&&sc.words?Object.keys(sc.words).length:0}
var GAMES=[
  {id:'sc',name:'Scramble TOEIC',href:'../scramble/',desc:'Shoot the fuel tanks, collect words. Each loop changes the deck.',tags:['connectors','irregular verbs','vocabulary'],stat:function(d){return d?'Best score '+(d.scBest||0)+' | words '+nWords(d.sc)+' / 200':''}},
  {id:'tn',name:'TOEICnoid',href:'../toeicnoid/',desc:'Break the irregular verb bricks: 3 hits = preterit, past participle, French.',tags:['irregular verbs'],stat:function(d){return d?'Best score '+(d.tnBest||0)+' | verbs '+nWords(d.tn)+' / 93':''}},
  {id:'wb',name:'Word Bridge',href:'../wordbridge/',desc:'Build the bridge with the right answers. Grammar and vocabulary levels.',tags:['connectors','verbs','word families','collocations'],stat:function(d){return d?'Best score '+(d.wbBest||0):''}},
  {id:'ae',name:'Arrow Escape',href:'../',desc:'Dodge, aim and answer TOEIC questions to escape.',tags:['TOEIC questions'],stat:function(d){return d?'Best score '+(d.best||0):''}},
  {id:'xm',name:'Christmas Village',href:'../noel/',desc:'A seasonal village game with mixed TOEIC exercises.',tags:['mixed practice'],stat:function(d){return d?'Best score '+(d.xmBest||0):''}}
];
function renderGames(){
  var box=$('#games');
  if(!P.user){box.innerHTML='';updHud();return}
  box.innerHTML='<ul class="menu" id="menu">'+GAMES.map(function(g,i){
    return '<li><a class="row" data-i="'+i+'" href="'+g.href+'"><span class="cur">&#9654;</span><span class="code">'+g.id.toUpperCase()+'</span><span class="nm">'+esc(g.name)+'</span><span class="sc">'+esc(String(bestOf(g)))+'</span></a></li>';
  }).join('')+'</ul><div class="info" id="info"></div><p class="hint">&#9650;&#9660; SELECT &nbsp; ENTER = PLAY</p>';
  Array.prototype.forEach.call(box.querySelectorAll('.row'),function(r){
    r.addEventListener('mouseenter',function(){sel(+r.getAttribute('data-i'),true)});
    r.addEventListener('click',function(){beep(880,.12,'square')});
  });
  sel(S,true);updHud();
}
var S=0,SND=true,AC=null;
function beep(f,d,type,f2){
  if(!SND)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function coinSound(){beep(988,.09,'square');setTimeout(function(){beep(1319,.3,'square')},90)}
function bestOf(g){var d=P.data;if(!d)return 0;var k={sc:'scBest',tn:'tnBest',wb:'wbBest',ae:'best',xm:'xmBest'}[g.id];return d[k]||0}
function sel(i,quiet){
  S=(i+GAMES.length)%GAMES.length;
  var rows=document.querySelectorAll('#menu .row');if(!rows.length)return;
  Array.prototype.forEach.call(rows,function(r,k){r.classList.toggle('on',k===S)});
  var g=GAMES[S],info=$('#info');
  if(info)info.innerHTML='<div class="d">'+esc(g.desc)+'</div><div class="t">'+g.tags.map(esc).join(' / ')+'</div><div class="s">'+esc(g.stat(P.data))+'</div>';
  if(!quiet)beep(660,.06,'square');
}
function play(){if(P.user){beep(523,.1,'square');setTimeout(function(){beep(1046,.25,'square')},100);setTimeout(function(){location.href=GAMES[S].href},260)}else{focusAuth()}}
function focusAuth(){var f=$('#fNom');if(f)f.focus()}
function updHud(){
  $('#hu').textContent=P.user?String(P.user.nom).toUpperCase().slice(0,10):'---';
  var hi=0;if(P.data)GAMES.forEach(function(g){hi=Math.max(hi,bestOf(g))});
  $('#hh').textContent=hi;
  $('#hc').textContent=P.user?'01':'00';
}
function renderAuth(){
  var box=$('#auth'),h='';
  if(P.user){
    h='<div class="who"><span>PLAYER <b>'+esc(P.user.nom)+'</b></span><button class="btn" id="out">LOG OUT</button></div>';
  }else{
    var su=P.mode==='signup';
    h='<div class="ttl blink">INSERT COIN</div>'+
      '<div class="tabs"><button class="tab'+(su?'':' on')+'" data-t="login">LOG IN</button><button class="tab'+(su?' on':'')+'" data-t="signup">NEW PLAYER</button></div>'+
      '<label for="fNom">NAME</label><input id="fNom" placeholder="DUPONT Lea" autocomplete="name" maxlength="40">'+
      '<label for="fCode">4-DIGIT CODE</label><input id="fCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="****" autocomplete="off">'+
      '<p class="msg" id="msg">'+esc(P.msg)+'</p><button class="btn solid" id="go">'+(su?'CREATE PROFILE':'PRESS START')+'</button>';
  }
  box.innerHTML=h;updHud();
  var fn=$('#fNom');if(fn){fn.value=P.draft;fn.addEventListener('input',function(){P.draft=fn.value})}
  Array.prototype.forEach.call(box.querySelectorAll('.tab'),function(t){t.addEventListener('click',function(){P.mode=t.getAttribute('data-t');P.msg='';beep(440,.05);renderAuth()})});
  var out=$('#out');if(out)out.addEventListener('click',function(){P.user=null;P.token=null;P.data=null;save();renderAuth();renderGames()});
  var go=$('#go');
  if(go){
    var submit=function(){
      var su=P.mode==='signup',body={nom:$('#fNom').value.trim(),code:$('#fCode').value.trim()},m=$('#msg');
      if(!body.nom){m.textContent='ENTER YOUR NAME.';return}
      if(!/^\d{4}$/.test(body.code)){m.textContent='CODE = EXACTLY 4 DIGITS.';return}
      go.disabled=true;m.textContent='PLEASE WAIT...';
      post(su?'signup':'login',body).then(function(r){
        if(r.ok){P.user=r.j.user;P.token=r.j.token;P.data=r.j;P.msg='';save();coinSound();renderAuth();renderGames();return}
        P.msg=String(r.j.error||'Something went wrong.');renderAuth();
      },function(){P.msg='SERVER UNREACHABLE.';renderAuth()});
    };
    go.addEventListener('click',submit);
    box.addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
  }
}
function boot(){
  var j=lsGet('letsplaySession');
  if(j){try{var o=JSON.parse(j);if(o&&o.token&&o.user){P.user=o.user;P.token=o.token}}catch(e){}}
  renderAuth();renderGames();
  $('#coin').addEventListener('click',function(){coinSound();if(!P.user)focusAuth()});
  $('#start').addEventListener('click',play);
  $('#bNext').addEventListener('click',function(){sel(S+1)});
  $('#bPrev').addEventListener('click',function(){sel(S-1)});
  $('#bSnd').addEventListener('click',function(){SND=!SND;this.style.opacity=SND?1:.4;if(SND)beep(800,.08)});
  var st=$('#stick');
  st.addEventListener('click',function(){st.classList.add('r');setTimeout(function(){st.classList.remove('r')},120);sel(S+1)});
  document.addEventListener('keydown',function(e){
    var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='BUTTON'||!P.user)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();st.classList.add('r');setTimeout(function(){st.classList.remove('r')},120);sel(S+1)}
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();st.classList.add('l');setTimeout(function(){st.classList.remove('l')},120);sel(S-1)}
    else if(e.key==='Enter'){e.preventDefault();play()}
  });
  if(P.user){
    post('load').then(function(r){
      if(r.status===401){P.user=null;P.token=null;save();P.msg='SESSION EXPIRED. LOG IN AGAIN.'}
      else if(r.ok)P.data=r.j;
      renderAuth();renderGames();
    },function(){});
  }
}
boot();
})();
</script>
</body>
</html>
