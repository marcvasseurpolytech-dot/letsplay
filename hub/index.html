<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC Arcade</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b3a;--navy2:#16294f;--navy3:#1f3868;--gold:#c9a227;--cream:#f5eedc;--red:#e0584f;--green:#3fae76;--muted:#a9b3c9}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--cream);font-family:'Source Serif 4',Georgia,serif;min-height:100vh;padding:20px 14px 40px}
.wrap{max-width:880px;margin:0 auto}
h1{font-family:'Playfair Display',Georgia,serif;font-size:34px;margin:0 0 4px}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:16px;margin:0 0 18px}
.panel{background:var(--navy2);border:1px solid rgba(245,238,220,.14);border-radius:14px;padding:16px;margin-bottom:18px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab,.btn{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cream);background:transparent;border:1px solid rgba(245,238,220,.3);border-radius:8px;padding:9px 12px;cursor:pointer}
.tab.on,.btn.solid{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
input{width:100%;font-family:inherit;font-size:16px;color:var(--cream);background:var(--navy);border:1px solid rgba(245,238,220,.3);border-radius:8px;padding:10px;margin:6px 0}
.msg{color:var(--red);min-height:20px;margin:4px 0;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.game{display:block;text-decoration:none;color:var(--cream);background:var(--navy2);border:1px solid rgba(245,238,220,.14);border-radius:14px;padding:16px;transition:transform .12s,border-color .12s}
a.game:hover{transform:translateY(-3px);border-color:var(--gold)}
a.game h2{font-family:'Playfair Display',Georgia,serif;font-size:22px;margin:0 0 4px;color:var(--gold)}
a.game p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--navy3);border-radius:6px;padding:3px 7px;margin:0 4px 4px 0}
.stat{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cream);border-top:1px solid rgba(245,238,220,.12);padding-top:8px;margin-top:6px}
.go{display:block;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <h1>TOEIC <span>Arcade</span></h1>
  <p class="sub">One profile, five games. Log in once, then pick the game you want.</p>
  <div class="panel" id="auth"></div>
  <div class="grid" id="games"></div>
  <p class="muted" style="margin-top:22px">Your name and 4-digit code are the same in every game. Your progress is saved automatically.</p>
</div>
<script>
(function(){
'use strict';
var API=location.protocol==='file:'?'https://letsplay-nine.vercel.app/api/player':'/api/player';
var P={user:null,token:null,data:null,mode:'login',msg:'',draft:'',offline:false};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function $(q){return document.querySelector(q)}
function post(action,body){
  var h={'Content-Type':'application/json'};if(P.token)h.Authorization='Bearer '+P.token;
  return fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action:action},body||{}))})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}},function(){return {ok:false,status:r.status,j:{}}})});
}
function save(){if(P.user&&P.token)lsSet('letsplaySession',JSON.stringify({user:P.user,token:P.token}));else lsDel('letsplaySession')}
function nWords(sc){return sc&&sc.words?Object.keys(sc.words).length:0}
var GAMES=[
  {id:'sc',name:'Scramble TOEIC',href:'../scramble/',desc:'Shoot the fuel tanks, collect words. Each loop changes the deck.',tags:['connectors','irregular verbs','vocabulary'],stat:function(d){return d?'Best score '+(d.scBest||0)+' | words '+nWords(d.sc)+' / 200':''}},
  {id:'tn',name:'TOEICnoid',href:'../toeicnoid/',desc:'Break the irregular verb bricks: 3 hits = preterit, past participle, French.',tags:['irregular verbs'],stat:function(d){return 'Progress saved on this device'}},
  {id:'wb',name:'Word Bridge',href:'../wordbridge/',desc:'Build the bridge with the right answers. Grammar and vocabulary levels.',tags:['connectors','verbs','word families','collocations'],stat:function(d){return d?'Best score '+(d.wbBest||0):''}},
  {id:'ae',name:'Arrow Escape',href:'../',desc:'Dodge, aim and answer TOEIC questions to escape.',tags:['TOEIC questions'],stat:function(d){return d?'Best score '+(d.best||0):''}},
  {id:'xm',name:'Christmas Village',href:'../noel/',desc:'A seasonal village game with mixed TOEIC exercises.',tags:['mixed practice'],stat:function(d){return d?'Best score '+(d.xmBest||0):''}}
];
function renderGames(){
  $('#games').innerHTML=GAMES.map(function(g){
    return '<a class="game" href="'+g.href+'"><h2>'+esc(g.name)+'</h2><p>'+esc(g.desc)+'</p>'+
      g.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
      (P.data?'<div class="stat">'+esc(g.stat(P.data))+'</div>':'')+'<span class="go">PLAY &rarr;</span></a>';
  }).join('');
}
function renderAuth(){
  var box=$('#auth'),h='';
  if(P.user){
    h='<div class="who"><span>Logged in as <b>'+esc(P.user.nom)+'</b></span><button class="btn" id="out">Log out</button></div>'+
      '<p class="muted" style="margin:8px 0 0">Open any game below: you are already logged in.</p>';
  }else{
    var su=P.mode==='signup';
    h='<div class="tabs"><button class="tab'+(su?'':' on')+'" data-t="login">Log in</button><button class="tab'+(su?' on':'')+'" data-t="signup">Create my profile</button></div>'+
      '<input id="fNom" placeholder="Your name (e.g. DUPONT Lea)" autocomplete="name" maxlength="40">'+
      '<input id="fCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit secret code" autocomplete="off">'+
      '<p class="msg" id="msg">'+esc(P.msg)+'</p><button class="btn solid" id="go">'+(su?'Create profile':'Log in')+'</button>';
  }
  box.innerHTML=h;
  var fn=$('#fNom');if(fn){fn.value=P.draft;fn.addEventListener('input',function(){P.draft=fn.value})}
  Array.prototype.forEach.call(box.querySelectorAll('.tab'),function(t){t.addEventListener('click',function(){P.mode=t.getAttribute('data-t');P.msg='';renderAuth()})});
  var out=$('#out');if(out)out.addEventListener('click',function(){P.user=null;P.token=null;P.data=null;save();renderAuth();renderGames()});
  var go=$('#go');
  if(go){
    var submit=function(){
      var su=P.mode==='signup',body={nom:$('#fNom').value.trim(),code:$('#fCode').value.trim()},m=$('#msg');
      if(!body.nom){m.textContent='Please enter your name.';return}
      if(!/^\d{4}$/.test(body.code)){m.textContent='Your secret code must be exactly 4 digits.';return}
      go.disabled=true;m.textContent='Please wait...';
      post(su?'signup':'login',body).then(function(r){
        if(r.ok){P.user=r.j.user;P.token=r.j.token;P.data=r.j;P.msg='';save();renderAuth();renderGames();return}
        P.msg=r.j.error||'Something went wrong.';renderAuth();
      },function(){P.msg='Server unreachable. Check your connection.';renderAuth()});
    };
    go.addEventListener('click',submit);
    box.addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
  }
}
function boot(){
  var j=lsGet('letsplaySession');
  if(j){try{var o=JSON.parse(j);if(o&&o.token&&o.user){P.user=o.user;P.token=o.token}}catch(e){}}
  renderAuth();renderGames();
  if(P.user){
    post('load').then(function(r){
      if(r.status===401){P.user=null;P.token=null;save();P.msg='Your session expired. Please log in again.'}
      else if(r.ok)P.data=r.j;
      renderAuth();renderGames();
    },function(){});
  }
}
boot();
})();
</script>
</body>
</html>
