<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Word Bridge TOEIC</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3a; --navy2:#16294f; --navy3:#1f3868;
  --gold:#c9a227; --cream:#f5eedc; --red:#e0584f; --green:#3fae76;
  --muted:#a9b3c9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--cream);font-family:'Source Serif 4',Georgia,serif}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:20px;letter-spacing:.5px}
.brand span{color:var(--gold)}
.stats{display:flex;gap:12px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.stats b{color:var(--cream);font-size:14px}
.lives{display:flex;gap:2px;font-size:18px;color:var(--red);letter-spacing:1px}
.lives .lost{color:#3a4668}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:4px}
.btn{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.35;cursor:default}
.btn.solid{background:var(--gold);color:var(--navy)}
.board{position:relative;background:#0a1530;border:1px solid rgba(201,162,39,.45);border-radius:12px;overflow:hidden;display:flex;justify-content:center}
#svg{display:block;width:100%;height:auto;max-height:56vh;touch-action:manipulation}
.arrow{--c:#f5eedc}
.arrow .body{fill:none;stroke:var(--c);stroke-width:.4;stroke-linecap:round;stroke-linejoin:round}
.arrow .halo{fill:none;stroke:#fff;stroke-width:.62;stroke-linecap:round;stroke-linejoin:round;opacity:0;pointer-events:none}
.arrow.open .halo{opacity:.95}
.arrow .head{fill:var(--c);stroke:var(--c);stroke-width:.08;stroke-linejoin:round}
.arrow.open .head{stroke:#fff;stroke-width:.1}
.arrow .hit{fill:none;stroke:transparent;stroke-width:.72;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}
.arrow.sel{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}
.arrow.crash{--c:#e0584f}
.arrow.hint{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{filter:drop-shadow(0 0 7px #7fe3a8)}}
.panel{background:var(--navy2);border:1px solid rgba(245,238,220,.14);border-radius:12px;padding:12px;min-height:215px;display:flex;flex-direction:column;gap:10px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.sentence{font-size:18px;line-height:1.35}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--gold);text-align:center;font-weight:600;color:var(--gold)}
.gap.ok{color:var(--green);border-color:var(--green)}
.gap.ko{color:var(--red);border-color:var(--red)}
.verb{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font-family:'Source Serif 4',Georgia,serif;font-size:16px;font-weight:600;color:var(--cream);background:var(--navy3);border:1px solid rgba(245,238,220,.22);border-radius:8px;padding:11px 8px;cursor:pointer;touch-action:manipulation}
.opt:disabled{cursor:default}
.opt.good{background:rgba(63,174,118,.28);border-color:var(--green)}
.opt.bad{background:rgba(224,88,79,.28);border-color:var(--red)}
.fb{font-size:14px;line-height:1.4;color:var(--cream)}
.fb em{color:var(--muted)}
.fb .ko{color:var(--red);font-weight:600}
.fb .ok{color:var(--green);font-weight:600}
.idle{color:var(--muted);font-size:15px;line-height:1.5;margin:auto 0;text-align:center}
footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7f8bab;letter-spacing:.5px;line-height:1.5}
.screen{position:absolute;inset:0;background:var(--navy);z-index:10;display:none;padding:22px 18px;overflow-y:auto}
.screen.on{display:block}
.screen h1{font-family:'Playfair Display',Georgia,serif;font-size:32px;margin:6px 0 4px;line-height:1.1}
.screen h1 span{color:var(--gold)}
.screen h2{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin:6px 0 6px}
.screen p{color:var(--muted);line-height:1.5;margin:6px 0}
.rules{padding-left:18px;margin:10px 0 14px;line-height:1.55;font-size:15px}
.modes{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.mode{font-family:'Source Serif 4',Georgia,serif;text-align:left;background:var(--navy3);color:var(--cream);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:17px;font-weight:600;touch-action:manipulation}
.mode small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.recap{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.recap div{background:var(--navy2);border-left:3px solid var(--red);border-radius:4px;padding:8px 10px;font-size:14px;line-height:1.4}
.recap em{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font-family:'JetBrains Mono',monospace;color:var(--gold);font-size:15px}
.credit{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7f8bab;letter-spacing:.5px;margin-top:6px}
.banner{display:block;width:100%;max-width:340px;margin:8px auto;background:#0a1530;border:1px solid #c9a22755;border-radius:12px;padding:6px}
.bonus .btn{display:flex;flex-direction:column;align-items:stretch;text-align:center;gap:2px;padding:6px 12px}
.bonus .btn em{font-style:normal;font-size:10px;opacity:.85;letter-spacing:.3px}
.bonus .btn .prog{display:block;height:4px;border-radius:3px;background:#ffffff22;overflow:hidden}
.bonus .btn .prog b{display:block;height:100%;background:currentColor;transition:width .4s}
.timer{height:5px;border-radius:3px;background:#ffffff1f;overflow:hidden;margin-bottom:6px}
.timer b{display:block;height:100%;width:100%;background:var(--green);transition:width .25s linear}
.timer b.low{background:var(--red)}
.opts.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:inline-block;border-bottom:2px dotted var(--gold);padding:0 3px;margin:2px 2px}
.seg .sl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);margin-right:4px}
.seg.good{border-bottom:2px solid var(--green);background:#3fae7622}
.seg.bad{border-bottom:2px solid var(--red);background:#e0584f22}

.bonus{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bonus small{color:var(--muted);font-size:11px;flex:1;min-width:150px;line-height:1.35}
.btn.boom{color:#ff8a65;border-color:#ff8a65}
.btn.boom:not(:disabled){animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 10px #ff8a65}}
.slots{display:flex;gap:5px;flex-wrap:wrap;min-height:38px}
.slot{width:26px;height:36px;border-bottom:2px solid var(--gold);text-align:center;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--cream);text-transform:uppercase;line-height:34px}
.slot.ok{color:var(--green);border-color:var(--green)}
.slot.ko{color:var(--red);border-color:var(--red)}
.tiles{display:flex;gap:6px;flex-wrap:wrap}
.tile{width:38px;height:42px;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;text-transform:uppercase;background:var(--navy3);color:var(--cream);border:1px solid rgba(245,238,220,.3);border-radius:7px;cursor:pointer;touch-action:manipulation}
.tile:disabled{opacity:.22;cursor:default}
.row2{display:flex;gap:8px}
.arrow.pick{filter:drop-shadow(0 0 6px #ff8a65)}
.arrow.pick{--c:#ff8a65}
.boomtxt{color:#ff8a65;font-family:'Playfair Display',Georgia,serif;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{font-family:'Source Serif 4',Georgia,serif;font-size:15px;font-weight:600;color:var(--muted);background:transparent;border:1px solid rgba(245,238,220,.3);border-radius:20px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.profile{background:var(--navy2);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:12px;margin:10px 0 6px;display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px;margin:0}
.tabs{display:flex;gap:6px}
.tab{flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);background:transparent;border:1px solid rgba(245,238,220,.25);border-radius:6px;padding:8px;cursor:pointer;touch-action:manipulation}
.tab.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.fld{width:100%;font-family:'Source Serif 4',Georgia,serif;font-size:16px;color:var(--cream);background:var(--navy);border:1px solid rgba(245,238,220,.3);border-radius:8px;padding:10px}
.fld::placeholder{color:#6f7b99}
select.fld{appearance:auto}
.msg{color:var(--red);min-height:18px;margin:0;font-size:14px}
.statsline{font-size:13px;color:var(--muted);line-height:1.5}
.statsline b{color:var(--cream)}
.rulebox{margin:8px 0}
.rulebox summary{cursor:pointer;margin:6px 0}
.saveinfo{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7f8bab;min-height:12px}

.scene{position:relative;background:#0a1530;border:1px solid rgba(201,162,39,.45);border-radius:12px;overflow:hidden}
#wb{display:block;width:100%;height:auto}
.scene.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.toast{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:0 10px}
.toast.on{opacity:1}
.toast span{display:table;margin:2px auto;background:rgba(13,27,58,.74);padding:2px 10px;border-radius:8px}
.toast .v{display:table;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);font-size:15px;letter-spacing:.5px}
.toast .m{display:table;color:var(--cream);font-size:14px}
.toast.good .v{color:#7fe3a8}
.pl{transform-box:fill-box;transform-origin:center}
.waves{animation:wave 3.2s linear infinite}
.waves.b{animation-duration:4.6s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-40px)}}
.gift{cursor:pointer;touch-action:manipulation}
.gift .halo{animation:giftpulse .9s ease-in-out infinite}
@keyframes giftpulse{50%{opacity:.15}}
.beacon{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.coinchip{display:flex;align-items:center;gap:4px}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:#f2c230;border:2px solid #b8921a;box-sizing:border-box}
#coins{color:#f2c230}
.tbtns{display:flex;gap:6px}
.giftlbl{pointer-events:none}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(1.12,.92)}}
.bird .wing{transform-box:fill-box;transform-origin:center;animation:flap .3s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.45)}}
.shop{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.shopi{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--navy2);border:1px solid rgba(245,238,220,.12);border-radius:8px;padding:8px 10px;font-size:15px}
.shopi em{color:var(--muted);font-style:normal}
.giftline{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.giftline b{color:var(--gold)}
.lives span{display:inline-block}
.panel .nextrow{display:flex;gap:8px;margin-top:2px}
.fb .ver{font-family:'JetBrains Mono',monospace;color:var(--gold)}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">WORD <span>BRIDGE</span></div>
    <div class="stats">
      <div>Lvl <b id="lvl">1</b></div>
      <div>Score <b id="score">0</b></div>
      <div class="coinchip" title="Coins"><i class="coin"></i><b id="coins">0</b></div>
      <div class="lives" id="lives" title="Stability"></div>
    </div>
  </header>
  <div class="toolbar">
    <div class="legend"><span id="planks">Plank 0 / 10</span></div>
    <div class="tbtns"><button class="btn solid" id="shopBtn">Shop</button><button class="btn" id="menuBtn">Menu</button></div>
  </div>
  <div class="scene" id="scene">
    <svg id="wb" viewBox="0 0 520 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A bridge being built over a river"></svg>
    <div class="toast" id="toast"></div>
  </div>
  <div class="giftline" id="giftInfo">Gifts parachute down from time to time. <b>Tap one</b> before it hits the river and answer its question to win back a life.</div>
  <section class="panel" id="panel"></section>
  <div id="saveInfo" class="saveinfo"></div>
  <footer>A game by Marc VASSEUR / Polytech Lille<br>marc.vasseur@polytech-lille.fr</footer>
  <div class="screen on" id="screen"></div>
</div>

<script src="bank.js"></script>
<script>
(function(){
'use strict';

var B=window.WB_BANK, NORMAL=B.NORMAL, HARD=B.HARD, CATS=B.CATS, MODE_LABEL=B.MODE_LABEL;
var MAXL=5;
/* Chomp's attacks: each bite shows one irregular verb (base, past simple, past participle) and a sentence using the past form. */
var ATTACKS=[
 ['eat','ate','eaten','Chomp ate a plank.'],
 ['bite','bit','bitten','Chomp bit a plank.'],
 ['break','broke','broken','Chomp broke a plank.'],
 ['tear','tore','torn','Chomp tore a plank.'],
 ['shake','shook','shaken','Chomp shook the bridge.'],
 ['strike','struck','struck','Chomp struck the bridge.'],
 ['sink','sank','sunk','A plank sank into the river.'],
 ['swim','swam','swum','Chomp swam under the bridge.'],
 ['throw','threw','thrown','Chomp threw a plank into the river.'],
 ['drive','drove','driven','Chomp drove its tail into the bridge.']
];

/* ---------- TOOLS ---------- */
var NS='http://www.w3.org/2000/svg';
function $(s){return document.querySelector(s)}
function el(n,attrs,parent){var e=document.createElementNS(NS,n);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rnd(n){return Math.floor(Math.random()*n)}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var easeIn=function(u){return u*u};
var easeOut=function(u){return 1-(1-u)*(1-u)};
function tw(ms,fn,ease){return new Promise(function(res){var t0=performance.now();function f(now){var u=Math.min(1,(now-t0)/ms);fn(ease?ease(u):u);if(u<1)requestAnimationFrame(f);else res()}requestAnimationFrame(f)})}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* ---------- GAME STATE ---------- */
function emptyStats(){return {byCat:{},answered:0,correct:0,levelsCleared:0,maxLevel:1,gifts:0,giftsOk:0}}
var S={cats:{},level:1,score:0,lives:MAXL,N:10,placed:0,bitten:[],q:null,gq:null,view:'main',busy:false,ended:true,active:false,
  deck:[],hdeck:[],missed:[],best:0,qCount:0,okCount:0,sinceGift:0,nextGift:4+rnd(3),gift:null,biteN:rnd(ATTACKS.length),
  stats:emptyStats(),levelDone:true,nextLevel:0,gen:0,planks:[],ghosts:[],
  coins:0,decor:[],fish:{},threat:false,streak:0,skyP:0,era:1,upg:1,mode:'bridge',nextMode:'',ref:{},cab:null,swim:[]};
function levelN(l){return Math.min(20,10+2*(l-1))}
try{S.best=parseInt(localStorage.getItem('wordBridgeBest')||'0',10)||0}catch(e){}

/* ---------- QUESTIONS ---------- */
function drawItem(hard){
  var k=hard?'hdeck':'deck',src=hard?HARD:NORMAL;
  if(!S[k].length){var f=src.filter(function(q){return S.cats[q.t]});if(!f.length)f=src;S[k]=shuffle(f)}
  return S[k].pop();
}
function scramble(word){
  var letters=word.split(''),out=letters,tries=0;
  do{out=shuffle(letters);tries++}while(out.join('')===word&&tries<30);
  return out.map(function(ch,i){return {ch:ch,id:i}});
}
function limitOf(it){return it.t==='e'?30000:it.t==='w'?40000:20000}
function makeQ(item){
  var lim=limitOf(item);
  if(item.t==='w')return {item:item,type:'w',tiles:scramble(item.w),built:[],answered:false,limit:lim,left:lim};
  if(item.t==='e')return {item:item,type:'mc',opts:item.o.map(function(t,i){return {t:t,ok:i===item.k}}),answered:false,limit:lim,left:lim};
  var opts=shuffle(item.o.map(function(t,i){return {t:t,ok:i===0}}));
  return {item:item,type:'mc',opts:opts,answered:false,limit:lim,left:lim};
}
function nextItem(){
  var hard=S.level>=3&&Math.random()<0.25;
  return drawItem(hard);
}
function sentenceHTML(item,fill,cls){
  var s=esc(item.s);
  if(item.t==='v')s=s.replace(/\(([a-z]+)\)\s*$/,'<span class="verb">($1)</span>');
  s=s.replace(/\*([^*]+)\*/g,'<b>$1</b>');
  return s.replace('___','<span class="gap'+(cls?' '+cls:'')+'">'+(fill?esc(fill):'&nbsp;')+'</span>');
}
function segHTML(q){
  var item=q.item;
  return item.segs.map(function(sg,i){
    var c='';
    if(q.answered){if(i===item.k)c=' good';else if(i===q.picked)c=' bad'}
    return '<span class="seg'+c+'"><b class="sl">'+'ABCD'.charAt(i)+'</b>'+esc(sg)+'</span>';
  }).join(' ');
}
function fixedSentence(item){
  return item.segs.map(function(sg,i){return i===item.k?item.fix:sg}).filter(function(x){return x!==''}).join(' ');
}
function fullSentence(item){
  if(item.t==='e')return esc(fixedSentence(item));
  if(item.t==='w')return '<b>'+esc(item.w)+'</b> : '+esc(item.fr);
  if(item.s.indexOf('___')<0)return esc(item.s.replace(/\*/g,''))+' <b>'+esc(item.o[0])+'</b>';
  return esc(item.s.replace('___',item.o[0]).replace(/\s*\([a-z]+\)\s*$/,'').replace(/\*/g,''));
}
function feedbackHTML(q,ok){
  var it=q.item,h=(ok?'<span class="ok">Correct.</span> ':(q.timedOut?'<span class="ko">Time is up.</span> ':'<span class="ko">Wrong.</span> '));
  if(it.t==='e'){
    var seg=it.segs[it.k];
    return h+'The error is in <b>('+'ABCD'.charAt(it.k)+')</b>: <s>'+esc(seg)+'</s> '+(it.fix?'&rarr; <b>'+esc(it.fix)+'</b>':'(delete it)')+
      '<br><em>'+esc(it.why)+'</em><br><em>'+esc(fixedSentence(it))+'</em><br>'+esc(it.fr);
  }
  if(it.t==='w')return h+(ok?'':'The word is ')+fullSentence(it);
  return h+'<em>'+fullSentence(it)+'</em>'+(it.t==='t'?'':'<br>'+esc(it.fr));
}

/* ---------- PANEL ---------- */
function idle(msg){$('#panel').innerHTML='<div class="idle">'+msg+'</div>'}
function curQ(){return S.view==='gift'?S.gq:S.q}
function tagText(q){
  var base=MODE_LABEL[q.item.t];
  return S.view==='gift'?'Gift question | '+base:base;
}
function showPanel(){
  var q=curQ();
  if(!q){idle('Get ready to build the bridge.');return}
  var it=q.item,h=(q.answered?'':'<div class="timer"><b id="tbar" style="width:'+Math.max(0,Math.round(100*q.left/q.limit))+'%"'+(q.left<5000?' class="low"':'')+'></b></div>')+'<div class="tag">'+tagText(q)+'</div>';
  if(q.type==='mc'){
    if(it.t==='e')h+='<div class="sentence">Which part is <b>wrong</b>?<br>'+segHTML(q)+'</div><div class="opts letters">';
    else h+='<div class="sentence">'+sentenceHTML(it,q.answered?it.o[0]:null,q.answered?(q.ok?'ok':'ko'):'')+'</div><div class="opts">';
    q.opts.forEach(function(o,i){
      var c='opt';
      if(q.answered){if(o.ok)c+=' good';else if(i===q.picked)c+=' bad'}

/* ---------- SCREENS ---------- */
function statsHTML(){
  var st=S.stats;if(!st.answered)return '';
  var pct=Math.round(100*st.correct/st.answered);
  var weak=CATS.map(function(c){var x=st.byCat[c[0]]||{n:0,ok:0};return {l:c[1],n:x.n,p:x.n?Math.round(100*x.ok/x.n):100}})
    .filter(function(x){return x.n>=5&&x.p<80}).sort(function(a,b){return a.p-b.p}).slice(0,3);
  var h='<div class="statsline">Answered <b>'+st.answered+'</b> | Correct <b>'+pct+'%</b> | Bridges built <b>'+st.levelsCleared+'</b></div>';
  if(weak.length)h+='<div class="statsline">Work on: '+weak.map(function(x){return esc(x.l)+' ('+x.p+'%)'}).join(', ')+'</div>';
  return h;
}
function resumable(){var p=P.progress;return !!p&&(!!p.inLevel||p.level>1||p.score>0)}
function profileHTML(){
  if(P.user){
    return '<div class="profile"><div class="who"><b>'+esc(P.user.nom)+'</b>'+
      '<button class="btn" id="logout">Log out</button></div>'+statsHTML()+'</div>';
  }
  var su=P.mode==='signup';
  return '<div class="profile"><div class="tabs"><button class="tab'+(su?'':' on')+'" data-t="login">Log in</button><button class="tab'+(su?' on':'')+'" data-t="signup">Create my profile</button></div>'+
    '<input class="fld" id="fNom" placeholder="Your name (e.g. DUPONT Lea)" autocomplete="name" maxlength="40">'+
    '<input class="fld" id="fCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit secret code" autocomplete="off">'+
    '<p class="msg" id="pmsg">'+esc(P.msg)+'</p>'+
    '<div class="row"><button class="btn solid" id="pgo">'+(su?'Create profile':'Log in')+'</button></div>'+
    '<p class="muted small">You need a profile to play. It is the same profile as in Arrow Escape. Your progress is saved online, so you can continue on any device.</p></div>';
}
function wireProfile(){
  var lo=$('#logout');if(lo)lo.addEventListener('click',logout);
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){P.mode=t.getAttribute('data-t');P.msg='';startScreen()});
  });
  var go=$('#pgo');
  if(go)go.addEventListener('click',function(){
    var su=P.mode==='signup';
    var body={nom:$('#fNom').value.trim(),code:$('#fCode').value.trim()};
    var m=$('#pmsg');
    if(!body.nom){m.textContent='Please enter your name.';return}
    if(!/^\d{4}$/.test(body.code)){m.textContent='Your secret code must be exactly 4 digits.';return}
    go.disabled=true;m.textContent='Please wait...';
    post(su?'signup':'login',body).then(function(r){
      if(r.ok){onAuth(r.j);startScreen();return}
      go.disabled=false;P.msg=r.j.error||'Something went wrong.';m.textContent=P.msg;
    });
  });
}
function screen(html){var s=$('#screen');s.innerHTML=html;s.classList.add('on');s.scrollTop=0}
function hideScreen(){$('#screen').classList.remove('on')}
function recapHTML(){
  if(!S.missed.length)return '<p>No mistakes this round. Well done.</p>';
  var h='<p class="big">To review ('+S.missed.length+')</p><div class="recap">';
  S.missed.forEach(function(it){h+='<div>'+fullSentence(it)+(it.t==='w'||it.t==='t'?'':'<br><em>'+esc(it.fr)+'</em>')+'</div>'});
  return h+'</div>';
}
function bannerHTML(){
  var o='';
  o+='<rect x="0" y="62" width="340" height="48" fill="#16294f"/>';
  o+='<polygon points="0,62 40,62 40,110 0,110" fill="#26365e"/><polygon points="300,62 340,62 340,110 300,110" fill="#26365e"/>';
  o+='<rect x="64" y="22" width="8" height="40" fill="#a9b3c9"/><rect x="268" y="22" width="8" height="40" fill="#a9b3c9"/>';
  o+='<path d="M68 22 Q170 56 272 22" fill="none" stroke="#f5eedc" stroke-width="1.4"/>';
  o+='<line x1="10" y1="62" x2="68" y2="22" stroke="#f5eedc" stroke-width="1.4"/><line x1="272" y1="22" x2="330" y2="62" stroke="#f5eedc" stroke-width="1.4"/>';
  for(var i=0;i<14;i++){
    var x=40+i*20,ghost=i>8;
    o+='<rect x="'+(x+1)+'" y="61" width="18" height="6" rx="1" '+(ghost?'fill="none" stroke="#5b6a8f" stroke-dasharray="3 2"':'fill="#c9a227" stroke="#8a6d12"')+' stroke-width=".7"/>';
  }
  o+='<path d="M232 110 C246 96 250 80 236 62" fill="none" stroke="#9a6df0" stroke-width="12" stroke-linecap="round"/>';
  o+='<ellipse cx="222" cy="58" rx="16" ry="9" fill="#9a6df0"/><path d="M208 61 Q220 72 232 63 L232 60 Z" fill="#6a45c4"/>';
  o+='<circle cx="227" cy="55" r="2.6" fill="#f2c230"/><circle cx="226.4" cy="55" r="1.2" fill="#0d1b3a"/>';
  [212,217,222].forEach(function(x){o+='<polygon points="'+x+',62 '+(x+3.5)+',62 '+(x+1.7)+',67" fill="#f5eedc"/>'});
  o+='<rect x="0" y="92" width="340" height="18" fill="#1f3868" opacity=".94"/>';
  o+='<g transform="translate(110,18)"><path d="M-12 0 Q0 -20 12 0 Q6 -4 0 0 Q-6 -4 -12 0Z" fill="#e65aa8"/><rect x="-6" y="6" width="12" height="10" rx="1.5" fill="#c9a227"/><rect x="-1" y="6" width="2" height="10" fill="#e0584f"/></g>';
  return '<svg class="banner" viewBox="0 0 340 110" aria-hidden="true">'+o+'</svg>';
}
function startScreen(){
  S.ended=true;S.busy=false;removeGift();hud();
  if(!Object.keys(S.cats).length)CATS.forEach(function(c){S.cats[c[0]]=true});
  var chips='';
  CATS.forEach(function(c){chips+='<button class="chip'+(S.cats[c[0]]?' on':'')+'" data-c="'+c[0]+'">'+c[1]+'</button>'});
  var rs=resumable(),btns;
  if(P.confirmNew){
    btns='<p class="msg">Start over? This erases your saved level and score.</p><div class="row"><button class="btn solid" id="yes">Yes, start over</button><button class="btn" id="no">Cancel</button></div>';
  }else if(rs){
    btns='<div class="row"><button class="btn solid" id="cont">Continue (bridge '+Math.max(1,P.progress.level|0)+', score '+(P.progress.score|0)+')</button><button class="btn" id="newg">New game</button></div>';
  }else{
    btns='<div class="row"><button class="btn solid" id="go">Start</button><button class="btn" id="allc">Select all</button></div>';
  }
  if(!P.user){chips='';btns=''}
  screen('<h1>WORD <span>BRIDGE</span></h1><p class="big">TOEIC EDITION</p>'+bannerHTML()+profileHTML()+
    '<details class="rulebox"'+(P.user||rs?'':' open')+'><summary class="big">Directions</summary>'+
    '<ol class="rules"><li>Create a profile (your name and a 4-digit code) or log in to play. It is the same profile as in Arrow Escape.</li>'+
    '<li>Build the bridge across the river. Each correct answer lays one plank. Lay every plank to reach the other side.</li>'+
    '<li>Watch out for Chomp, the river monster. Every wrong answer makes him rise and bite your bridge, and you lose one life (&#9829;). Each bite also shows you an irregular verb: base form, past simple, past participle.</li>'+
    '<li>Be quick: you have 20 seconds per question (30 seconds to spot the wrong segment, 40 seconds for a scrambled word). When time runs out, it counts as a wrong answer.</li>'+
    '<li>Lose all 5 lives and the bridge collapses. You can replay the same bridge.</li>'+
    '<li>Look at the sky: a gift parachutes down from time to time. Tap it before it falls into the river, then answer its question. A correct answer wins back one life (or 30 points if your lives are full). A wrong answer loses the gift, but costs no life.</li>'+
    '<li>Earn coins (1 per correct answer, 5 per gift, 3 per life left at the end) and spend them in the shop: upgrade your bridge, from a simple rope bridge up to the Pont de Normandie, and add decorations. Answer 3 questions in a row and a plane flies by with bonus coins (longer streaks pay more). Then Chomp challenges you: he lurks under the bridge. A correct answer makes him back off (+2 coins), a wrong one and he bites.</li><li>Finish a bridge and the scenery changes. First you travel to Paris and build the Eiffel Tower floor by floor, then to New York to build the Statue of Liberty piece by piece. Chomp follows you everywhere. Then it is back to a new bridge.</li><li>Careful: Chomp does not only bite planks. He can also destroy your decorations, wreck your bridge upgrade, or knock the top piece off a monument. Buy them again in the shop, even in the middle of a game (the timer stops while you shop).</li><li>The sun rises as you build. Every bridge is longer and harder than the last one. Lives left at the end give you bonus points.</li></ol></details>'+
    (P.user?'<p class="big">Choose your question types</p><div class="chips">'+chips+'</div>'+btns:'')+
    (P.user?'<div class="row"><button class="btn" id="shp0">Shop and album ('+S.coins+' coins)</button></div>':'')+
    '<p>Best score: <b class="big">'+S.best+'</b></p><p class="credit">A game by Marc VASSEUR / Polytech Lille</p>');
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-c'),on=Object.keys(S.cats).filter(function(x){return S.cats[x]});
      if(S.cats[k]&&on.length===1)return;
      S.cats[k]=!S.cats[k];b.classList.toggle('on',S.cats[k]);
      S.deck=[];S.hdeck=[];
    });
  });
  var allc=$('#allc');if(allc)allc.addEventListener('click',function(){CATS.forEach(function(c){S.cats[c[0]]=true});
    Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){b.classList.add('on')});S.deck=[];S.hdeck=[]});
  var go=$('#go');if(go)go.addEventListener('click',newGame);
  var cont=$('#cont');if(cont)cont.addEventListener('click',resume);
  var ng=$('#newg');if(ng)ng.addEventListener('click',function(){P.confirmNew=true;startScreen()});
  var yes=$('#yes');if(yes)yes.addEventListener('click',function(){P.confirmNew=false;newGame()});
  var no=$('#no');if(no)no.addEventListener('click',function(){P.confirmNew=false;startScreen()});
  var sh0=$('#shp0');if(sh0)sh0.addEventListener('click',function(){shopScreen(startScreen)});
  wireProfile();
}
function newGame(){
  if(!P.user){startScreen();return}
  S.level=1;S.score=0;S.deck=[];S.hdeck=[];S.missed=[];S.qCount=0;S.okCount=0;S.nextMode='';
  startLevel();
}
function resume(){
  var p=P.progress;if(!p){newGame();return}
  S.level=Math.max(1,p.level|0);S.score=p.score|0;S.qCount=p.qCount|0;S.okCount=p.okCount|0;
  S.deck=[];S.hdeck=[];S.missed=[];
  startLevel(p);
}
function startLevel(saved){
  if(!P.user){startScreen();return}
  var res=!!(saved&&saved.inLevel);
  removeGift();
  S.N=levelN(S.level);
  S.lives=res?Math.max(1,saved.lives|0):MAXL;
  S.placed=res?Math.min(S.N-1,saved.placed|0):0;
  S.bitten=res&&Array.isArray(saved.bitten)?saved.bitten.filter(function(i){return i<S.placed}):[];
  S.q=null;S.gq=null;S.view='main';S.busy=false;S.ended=false;S.levelDone=false;S.nextLevel=0;S.active=true;
  S.sinceGift=0;S.nextGift=(!res&&S.level===1)?2+rnd(2):4+rnd(3);S.streak=0;S.threat=false;S.paused=false;S.era=Math.min(Math.max(S.upg|0,1),6);
  var wm=saved?saved.mode:S.nextMode;S.mode=MON[wm]?wm:'bridge';S.nextMode='';
  S.stats.maxLevel=Math.max(S.stats.maxLevel,S.level);
  buildScene();hud();hideScreen();
  if(!res||S.placed===0){if(S.mode!=='bridge')toast(MON[S.mode].place+': the '+MON[S.mode].title,MON[S.mode].words,true,4600);else{var E=ERAS[S.era-1];toast(E.n,E.w,true,4200)}}
  nextQuestion();scheduleSave();
}
function saveBest(){
  if(S.score>S.best){S.best=S.score;lsSet('wordBridgeBest',String(S.best))}
}
async function levelComplete(){
  var gen=S.gen;
  S.ended=true;S.levelDone=true;S.nextLevel=S.level+1;S.stats.levelsCleared++;removeGift();
  var ef=S.mode!=='bridge';S.nextMode=NEXTMODE[S.mode]||'bridge';
  var bonus=S.lives*20,cb=S.lives*3+(ef?20:0);S.score+=bonus;S.coins+=cb;saveBest();hud();scheduleSave();flush();
  idle(ef?MON[S.mode].done:'The bridge is finished. Here comes the first truck!');
  for(var b=0;b<5;b++)setTimeout(spawnBird,b*350);
  var ok=ef?await fireworks():await truck();
  if(!ok||gen!==S.gen)return;
  levelDoneScreen(bonus,cb);
}
function levelDoneScreen(bonus,cb){
  var efd=S.mode!=='bridge',goParis=S.nextMode!=='bridge',nm=MON[S.nextMode];
  screen('<h2>'+(efd?MON[S.mode].title+' complete':'Bridge '+S.level+' complete')+'</h2>'+(goParis?'<p class="ok">'+(efd?MON[S.mode].title+' finished!':'Bridge finished!')+' Next stop: '+nm.place+'. Build the '+nm.title+'!</p>':'')+'<p>Bonus for remaining lives: <b class="big">+'+bonus+'</b> points and <b class="big">+'+cb+'</b> coins<br>Score: <b class="big">'+S.score+'</b> (best: '+S.best+')</p>'+recapHTML()+
    '<div class="row"><button class="btn solid" id="nx">'+(goParis?'Go to '+nm.place:'Next bridge')+'</button><button class="btn" id="shp">Shop ('+S.coins+' coins)</button><button class="btn" id="mn">Menu</button></div>');
  $('#shp').addEventListener('click',function(){shopScreen(function(){levelDoneScreen(bonus,cb)})});
  $('#nx').addEventListener('click',function(){S.level++;S.missed=[];startLevel()});
  $('#mn').addEventListener('click',startScreen);
}
function shopScreen(back){
  var h='<h2>Shop and album</h2><p>You have <b class="big">'+S.coins+'</b> coins. Earn 1 coin per correct answer, 5 per gift, and 3 per life left at the end of a bridge.</p>';
  h+='<p class="big">Bridge upgrades</p><p>Start from a rope bridge and work your way up to the Pont de Normandie. Your upgrade shows on your bridge as soon as you go back to the game.</p><div class="shop">';
  ERAS.forEach(function(er,i){
    var lv=i+1,cur=S.upg===lv,own=S.upg>lv,next=S.upg+1===lv;
    h+='<div class="shopi"><span>'+lv+'. '+er.n+' <em>('+er.fr+')</em></span>'+
      (cur?'<span class="ok">Current</span>':own?'<span class="ok">Owned</span>':next?'<button class="btn'+(S.coins>=er.c?' solid':'')+'" data-u="'+lv+'"'+(S.coins>=er.c?'':' disabled')+'>Upgrade &middot; '+er.c+'</button>':'<span><em>Locked &middot; '+er.c+'</em></span>')+'</div>';
  });
  h+='</div><p class="big">Decorations</p><div class="shop">';
  DECOR.forEach(function(d){
    var own=S.decor.indexOf(d.id)>=0;
    h+='<div class="shopi"><span>'+d.n+' <em>('+d.fr+')</em></span>'+
      (own?'<span class="ok">Owned</span>':'<button class="btn'+(S.coins>=d.c?' solid':'')+'" data-b="'+d.id+'"'+(S.coins>=d.c?'':' disabled')+'>Buy &middot; '+d.c+'</button>')+'</div>';
  });
  h+='</div><p>Answer 3 questions in a row: a plane flies by with bonus coins, but Chomp comes to challenge you!</p><div class="row"><button class="btn solid" id="bk">Back</button></div>';
  screen(h);
  Array.prototype.forEach.call(document.querySelectorAll('[data-b]'),function(b){
    b.addEventListener('click',function(){
      var d=DECOR.filter(function(x){return x.id===b.getAttribute('data-b')})[0];
      if(!d||S.coins<d.c||S.decor.indexOf(d.id)>=0)return;
      S.coins-=d.c;S.decor.push(d.id);S.shopDirty=true;hud();
      if(S.mode==='bridge'&&layers.decor&&S.ref&&S.ref.glow)drawDecor(d.id);
      var base=S.active?snapshot():Object.assign({},P.progress||{level:S.level,score:S.score,best:S.best,lives:MAXL,placed:0,inLevel:false,bitten:[],cats:S.cats,qCount:S.qCount,okCount:S.okCount,stats:S.stats});
      base.coins=S.coins;base.upg=S.upg;base.decor=S.decor.slice();base.fish=S.fish;base.savedAt=Date.now();
      P.progress=base;lsSet(progKey(),JSON.stringify(base));
      if(P.user){P.dirty=true;flush()}
      shopScreen(back);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-u]'),function(b){
    b.addEventListener('click',function(){
      var lv=+b.getAttribute('data-u'),er=ERAS[lv-1];
      if(!er||lv!==S.upg+1||S.coins<er.c)return;
      S.coins-=er.c;S.upg=lv;S.shopDirty=true;hud();
      var base=S.active?snapshot():Object.assign({},P.progress||{level:S.level,score:S.score,best:S.best,lives:MAXL,placed:0,inLevel:false,bitten:[],cats:S.cats,qCount:S.qCount,okCount:S.okCount,stats:S.stats});
      base.coins=S.coins;base.upg=S.upg;base.decor=S.decor.slice();base.fish=S.fish;base.savedAt=Date.now();
      P.progress=base;lsSet(progKey(),JSON.stringify(base));
      if(P.user){P.dirty=true;flush()}
      shopScreen(back);
    });
  });
  $('#bk').addEventListener('click',back);
}
function gameOver(){
  S.ended=true;S.levelDone=true;S.nextLevel=S.level;S.nextMode=S.mode;S.busy=false;removeGift();saveBest();hud();scheduleSave();flush();
  screen('<h2>The '+(S.mode==='bridge'?'bridge':MON[S.mode].noun)+' collapsed</h2><p>'+(S.mode==='bridge'?'Bridge '+S.level:MON[S.mode].title)+': score <b class="big">'+S.score+'</b> (best: '+S.best+')</p>'+recapHTML()+
    '<div class="row"><button class="btn solid" id="rt">Rebuild this '+(S.mode==='bridge'?'bridge':MON[S.mode].noun)+'</button><button class="btn" id="mn">Menu</button></div>');
  $('#rt').addEventListener('click',function(){S.missed=[];startLevel()});
  $('#mn').addEventListener('click',startScreen);
}

/* ---------- shop during a game ---------- */
function rebuildScene(){
  var h=S.era;removeGift();S.era=Math.min(Math.max(S.upg|0,1),6);buildScene();hud();
  if(S.mode==='bridge'&&S.era!==h){var E=ERAS[S.era-1];toast(E.n,E.w,true,4200)}
}
function closeGameShop(){
  hideScreen();S.paused=false;
  if(S.shopDirty){S.shopDirty=false;rebuildScene()}
}
function openGameShop(){
  if(!S.active||S.ended||S.busy||S.view!=='main'){toast('','Answer or finish the current step first.');return}
  S.paused=true;S.shopDirty=false;
  shopScreen(closeGameShop);
}
$('#shopBtn').addEventListener('click',openGameShop);
$('#menuBtn').addEventListener('click',function(){S.paused=false;scheduleSave();flush();startScreen()});
window.addEventListener('pagehide',function(){scheduleSave();flush()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){scheduleSave();flush()}});
window.__wb={buildScene:buildScene,setSky:setSky,checkWord:checkWord,timeUp:timeUp,S:S,P:P,snapshot:snapshot,answerMC:answerMC,spawnGift:spawnGift,levelN:levelN,ATTACKS:ATTACKS,NORMAL:NORMAL,HARD:HARD,makeQ:makeQ};
boot();
startScreen();
})();
</script>
</body>
