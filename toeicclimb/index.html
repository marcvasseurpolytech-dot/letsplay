<script>
(() => {
'use strict';

/* ============================================================
   TOEICclimb : jeu de plateformes en bibliotheque.
   Un singe a vole le livre TOEIC. Il fait rouler des globes sur les etagères.
   Chaque globe porte un verbe irregulier. Avec le maillet : 1er coup = pretérit,
   2e coup = participe passe, 3e coup = francais (le globe se brise).
   ============================================================ */

const W = 800, H = 600;
const LW = 240, LH = 240;              // terrain en unites logiques
const FX = 12, FY = 12, FZ = 2.4;      // position et echelle du terrain a l'ecran
const FONT = '"Press Start 2P", "Courier New", monospace';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const fcv = document.createElement('canvas');
const f = fcv.getContext('2d');
let HD = true, SC = 2, FS = 3, bgCv = null;
function applyQuality() {
  SC = HD ? 2 : 1; FS = HD ? 3 : 1;
  cv.width = W * SC; cv.height = H * SC; fcv.width = LW * FS; fcv.height = LH * FS;
  cv.style.imageRendering = HD ? 'auto' : 'pixelated'; bgCv = null;
}

/* ------------------------------------------------------------
   Donnees : verbes irreguliers [infinitif, preterit, participe passe, francais]
   ------------------------------------------------------------ */
const VERBS = [

  ['cut', 'cut', 'cut', 'couper'],

  ['dig', 'dug', 'dug', 'creuser'],

/* ------------------------------------------------------------
   Utilitaires
   ------------------------------------------------------------ */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function pad7(n) { return String(Math.max(0, Math.floor(n))).padStart(7, '0'); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function sgn(v) { return v > 0 ? 1 : v < 0 ? -1 : 0; }
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ------------------------------------------------------------
   Sons (synthese simple, style 8 bits)
   ------------------------------------------------------------ */
let AC = null, master = null, muted = lsGet('tlMuted') === '1';
const pulseCache = {};
function audio() {
  if (!AC) {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return null;
    AC = new A(); master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function pulseWave(d) {
  if (!pulseCache[d]) {
    const n = 40, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * d);
    pulseCache[d] = AC.createPeriodicWave(re, im);
  }
  return pulseCache[d];
}
function tone(f0, f1, dur, o) {
  o = o || {};
  if (muted || !audio()) return;
  const t = AC.currentTime + (o.delay || 0);
  const osc = AC.createOscillator(), g = AC.createGain();
  if (o.type === 'pulse') osc.setPeriodicWave(pulseWave(o.duty || 0.25)); else osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const v = o.vol == null ? 0.5 : o.vol;
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(master);
  osc.start(t); osc.stop(t + dur + 0.03);
}
function noise(dur, o) {
  o = o || {};
  if (muted || !audio()) return;
  const t = AC.currentTime + (o.delay || 0);
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass';
  fl.frequency.setValueAtTime(o.f0 || 3000, t); fl.frequency.exponentialRampToValueAtTime(o.f1 || 300, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(o.vol == null ? 0.6 : o.vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(fl); fl.connect(g); g.connect(master); src.start(t);
}
function arp(notes, step, o) { notes.forEach((fq, i) => tone(fq, fq, step * 1.3, Object.assign({ type: 'pulse', duty: 0.25, vol: 0.4, delay: i * step }, o || {}))); }
const SND = {
  step() { tone(150, 120, 0.04, { type: 'pulse', duty: 0.5, vol: 0.22 }); },
  jump() { tone(260, 720, 0.13, { type: 'pulse', duty: 0.25, vol: 0.4 }); },
  land() { tone(120, 80, 0.06, { type: 'pulse', duty: 0.5, vol: 0.3 }); },
  over() { tone(900, 900, 0.05, { type: 'square', vol: 0.3 }); tone(1200, 1000, 0.08, { type: 'square', vol: 0.25, delay: 0.05 }); },
  hit(stage) { const fq = [0, 523, 659][stage] || 523; tone(fq, fq * 0.96, 0.07, { type: 'pulse', duty: 0.25, vol: 0.5 }); tone(fq * 2, fq * 2, 0.03, { type: 'pulse', duty: 0.125, vol: 0.18 }); noise(0.05, { f0: 3000, f1: 600, vol: 0.2 }); },
  smash() { tone(784, 1047, 0.08, { type: 'pulse', duty: 0.25, vol: 0.5 }); tone(1047, 1319, 0.1, { type: 'pulse', duty: 0.25, vol: 0.4, delay: 0.07 }); noise(0.12, { f0: 4000, f1: 700, vol: 0.3 }); },
  item() { arp([523, 659, 784, 1047], 0.05); },
  hammer() { arp([392, 523, 659, 784, 659, 784], 0.06); },
  beat(i) { const n = [196, 262, 196, 330][i & 3]; tone(n, n, 0.09, { type: 'pulse', duty: 0.125, vol: 0.2 }); },
  stomp() { noise(0.25, { f0: 600, f1: 80, vol: 0.7 }); tone(90, 40, 0.2, { type: 'sawtooth', vol: 0.4 }); },
  toss() { tone(300, 180, 0.12, { type: 'pulse', duty: 0.5, vol: 0.3 }); },
  ink() { tone(500, 120, 0.2, { type: 'sawtooth', vol: 0.25 }); noise(0.15, { f0: 1500, f1: 200, vol: 0.25 }); },
  die() { tone(660, 55, 0.95, { type: 'pulse', duty: 0.5, vol: 0.5 }); noise(0.5, { f0: 1500, f1: 120, vol: 0.4 }); },
  start() { arp([262, 330, 392, 523, 392, 523, 659, 784], 0.09); },
  clear() { arp([523, 659, 784, 1047, 784, 1047, 1319, 1568, 2093], 0.08); },
  life() { arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.05); },
  gameover() { arp([392, 349, 330, 294, 262, 196], 0.16, { type: 'pulse', duty: 0.5 }); }
};

   ------------------------------------------------------------ */
const STAGES = [
  { name: 'THE READING ROOM', slope: 30, seed: 77, g0: '#0a1330', g1: '#14224a', pal: { top: '#7a4b22', under: '#5c3615', edge: '#e3b04b', dot: '#d8b26a', sup: '#4a2a10' }, cols: ['#3a2a55', '#2a3f6a', '#4a3322', '#2a4a45', '#553030', '#3a4a6a', '#5a4a2a'], gaps: [], belts: [], lifts: [], springs: [], fruits: [],

   ------------------------------------------------------------ */
const API = (location.protocol === 'file:' || /claude/.test(location.hostname)) ? 'https://letsplay-nine.vercel.app/api/player' : '/api/player';
const PR = { user: null, token: null, words: {}, best: 0, runs: 0, maxRound: 1, destroyed: 0, qOk: 0, qN: 0, cp: null, guest: false, draft: '', mode: 'login', msg: '', offline: false, dirty: false, timer: null, flight: false, status: '', shown: false, ready: false };
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function apiPost(action, body) {
  const h = { 'Content-Type': 'application/json' };
  if (PR.token) h.Authorization = 'Bearer ' + PR.token;
  try {
    return fetch(API, { method: 'POST', headers: h, keepalive: true, body: JSON.stringify(Object.assign({ action, game: 'tl' }, body || {})) })
      .then((r) => r.json().catch(() => ({})).then((j) => ({ ok: r.ok, status: r.status, j })))
      .catch(() => ({ ok: false, status: 0, j: { error: 'No connection to the server.' } }));

}
function localKey() { return 'tlProg:' + (PR.user ? PR.user.key : 'guest'); }
function adopt(tl) {
  let loc = null; try { loc = JSON.parse(lsGet(localKey()) || 'null'); } catch (e) {}
  const words = {};
  [tl && tl.words, loc && loc.words].forEach((w) => { if (w) Object.keys(w).forEach((k) => { words[k] = Math.max(words[k] || 0, w[k] | 0); }); });
  PR.words = words;
  ['best', 'runs', 'destroyed', 'qOk', 'qN'].forEach((k) => { PR[k] = Math.max((tl && tl[k]) | 0, (loc && loc[k]) | 0); });
  PR.maxRound = Math.max(1, (tl && tl.maxRound) | 0, (loc && loc.maxRound) | 0);
  let cp = null, at = -1;
  [tl, loc].forEach((q) => { const t = Number(q && q.savedAt) || 0; if (q && q.cp && t >= at) { cp = q.cp; at = t; } });
  if (cp) PR.cp = cp;
  collection = new Set(Object.keys(PR.words));
}
function snapshot() {
  PR.best = Math.max(PR.best, G.score); PR.maxRound = Math.max(PR.maxRound, G.round);
  return { words: PR.words, best: PR.best, runs: PR.runs, maxRound: PR.maxRound, destroyed: PR.destroyed, qOk: PR.qOk, qN: PR.qN, cp: PR.cp, savedAt: Date.now() };
}
function scheduleSave() {
  if (!PR.user) return;
  lsSet(localKey(), JSON.stringify(snapshot()));

  clearTimeout(PR.timer); PR.timer = setTimeout(flush, 6000);
}
function flush() {
  clearTimeout(PR.timer);

  if (PR.flight) { PR.timer = setTimeout(flush, 2500); return; }
  PR.dirty = false; PR.flight = true; PR.status = 'Saving...';
  apiPost('save', { progress: snapshot() }).then((r) => {
    PR.flight = false;
    if (r.status === 401) { PR.token = null; saveSession(); PR.status = 'Session expired. Log in again to keep saving online.'; return; }
    if (!r.ok) { PR.dirty = true; PR.status = 'Not saved online (kept on this device). Retrying.'; PR.timer = setTimeout(flush, 20000); return; }

}
function saveSession() { if (PR.user && PR.token) lsSet('letsplaySession', JSON.stringify({ user: PR.user, token: PR.token })); else lsDel('letsplaySession'); }
function onAuth(j) { PR.user = j.user; PR.token = j.token; PR.msg = ''; PR.offline = false; adopt(j.tl); saveSession(); PR.ready = true; renderAuth(); }
function logout() {
  flush(); PR.user = null; PR.token = null; PR.words = {}; PR.best = 0; PR.runs = 0; PR.maxRound = 1; PR.destroyed = 0; PR.qOk = 0; PR.qN = 0; PR.cp = null; PR.guest = false;
  try { collection = new Set(JSON.parse(lsGet('tlLearned') || '[]')); } catch (e) { collection = new Set(); }
  saveSession(); renderAuth();
}
function profStart() { if (PR.user) { PR.runs++; scheduleSave(); } }
function profWord(inf) {
  collection.add(inf);
  if (PR.user) { PR.words[inf] = (PR.words[inf] || 0) + 1; PR.destroyed++; scheduleSave(); } else saveCollection();
}
function profEnd() { if (PR.user) { lsSet(localKey(), JSON.stringify(snapshot())); PR.dirty = true; flush(); } }
function restoreSession() {
  let ss = null; try { ss = JSON.parse(lsGet('letsplaySession') || 'null'); } catch (e) {}
  if (!ss || !ss.user || !ss.token) { PR.ready = true; renderAuth(); return; }

  adopt(null); PR.ready = true; renderAuth();

    if (r.status === 401) { PR.user = null; PR.token = null; saveSession(); renderAuth(); return; }

}

      (PR.confirm && cp ? '<p class="msg" style="color:#ff6a6a;text-align:center"><b>WATCH OUT!</b> If you click YES, your saved game (round ' + PR.cp.round + ', score ' + PR.cp.score + ') will be erased for good.</p><div class="row"><button class="btn" id="aYes">YES, ERASE AND START OVER</button><button class="btn ghost" id="aNo">NO, GO BACK</button></div>' : '<div class="row">' + (cp ? '<button class="btn" id="aCont">CONTINUE FROM ROUND ' + PR.cp.round + '<br><small>score ' + PR.cp.score + ' | answer 3 grammar questions</small></button>' : '') +
      '<button class="btn' + (cp ? ' ghost' : '') + '" id="aNew">NEW GAME</button></div>') +

      VERBS.slice().sort((p, q) => ((collection.has(q[0]) ? 1 : 0) - (collection.has(p[0]) ? 1 : 0))).map((v) => collection.has(v[0])

  } else {

      '<div class="tabs"><button class="tab' + (su ? '' : ' on') + '" data-t="login">Log in</button><button class="tab' + (su ? ' on' : '') + '" data-t="signup">Create my profile</button></div>' +
      '<input id="fNom" placeholder="Your name (e.g. DUPONT Lea)" autocomplete="name" maxlength="40">' +
      '<input id="fCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit secret code" autocomplete="off">' +
      '<p class="msg" id="aMsg">' + esc(PR.msg) + '</p>' +
      '<div class="row"><button class="btn" id="aGo">' + (su ? 'Create profile' : 'Log in') + '</button></div>' +
      (PR.offline ? '<div class="row"><button class="btn ghost" id="aGuest">Server unreachable: play as guest (not saved)</button></div>' : '<div class="row"><button class="btn ghost sm" id="aGuest">Play as a guest (nothing saved)</button></div>') +

function syncAuth() {

/* ------------------------------------------------------------
   Quiz de reprise : 3 bonnes reponses de grammaire (phrases a trous, banque partagee avec Word Bridge)
   ------------------------------------------------------------ */
const QTYPES = ['c', 'v', 'f', 'p', 'x', 'l'];
let QZ = null;
function qPool() {
  const B = window.WB_BANK;
  if (!B || !B.NORMAL) return [];
  return B.NORMAL.filter((q) => q.s && q.o && q.o.length >= 3 && q.s.indexOf('___') >= 0 && QTYPES.indexOf(q.t) >= 0);
}
function openQuiz(onDone, onCancel) {
  const pool = shuffle(qPool());
  if (!pool.length) { onDone(0); return; }
  QZ = { ok: 0, need: 3, done: 0, res: [], wrong: 0, tl: 10, timer: null, pool, idx: 0, q: null, opts: [], answered: false, last: '', onDone, onCancel };
  document.getElementById('auth').classList.remove('on'); PR.shown = false;
  nextQuestion();
  document.getElementById('quiz').classList.add('on');
}
function nextQuestion() {
  let k = QZ.idx;
  while (k < QZ.pool.length - 1 && QZ.pool[k].t === QZ.last) k++;
  const q = QZ.pool.splice(k, 1)[0];
  QZ.q = q; QZ.last = q.t; QZ.opts = shuffle(q.o.slice()); QZ.answered = false;
  renderQuiz(); startQTimer();
}
function stopQTimer() { if (QZ && QZ.timer) { clearInterval(QZ.timer); QZ.timer = null; } }
function startQTimer() {
  stopQTimer(); QZ.tl = 10; QZ.t0 = performance.now();
  const z = QZ;
  z.timer = setInterval(() => {
    if (QZ !== z || z.answered) { clearInterval(z.timer); z.timer = null; return; }
    z.tl = Math.max(0, 10 - (performance.now() - z.t0) / 1000);
    const bar = document.querySelector('#quizBox .tbar'), fill = bar && bar.firstChild;
    if (fill) { fill.style.width = (z.tl * 10) + '%'; bar.classList.toggle('low', z.tl <= 3); }
    if (z.tl <= 0) answerQuestion(-1);
  }, 100);
}
function renderQuiz() {
  const box = document.getElementById('quizBox'), q = QZ.q;
  const sentence = esc(q.s).replace('___', '<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  let dots = ''; for (let i = 0; i < QZ.need; i++) dots += QZ.res[i] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[i] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.innerHTML = '<h2>BACK IN THE GAME</h2><p class="sub">Answer 3 grammar questions to continue (3 questions, no more). You have 10 seconds per question.</p>' +
    '<p class="pen">Each wrong answer or timeout: -1000 bonus points in your first round' + (QZ.wrong ? ' (so far -' + (QZ.wrong * 1000) + ')' : '') + '</p>' +
    '<div class="tbar"><i></i></div><div class="dots">' + dots + '</div>' +
    '<div class="qs">' + sentence + '</div><div class="opts">' + QZ.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<div class="fb" id="qfb"></div><div class="row"><button class="btn" id="qNext" style="display:none"></button>' + (QZ.onCancel !== undefined ? '<button class="btn ghost sm" id="qBack">Back</button>' : '') + '</div>';
  box.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => answerQuestion(parseInt(b.getAttribute('data-i'), 10))));
  const bk = box.querySelector('#qBack'); if (bk) bk.addEventListener('click', closeQuiz);
}
function answerQuestion(i) {
  if (!QZ || QZ.answered) return;
  QZ.answered = true; stopQTimer();
  const q = QZ.q, good = i >= 0 && QZ.opts[i] === q.o[0], box = document.getElementById('quizBox');
  PR.qN++; QZ.done++; QZ.res.push(good ? 1 : 0); if (good) { PR.qOk++; QZ.ok++; } else QZ.wrong++;
  if (PR.user) scheduleSave();
  box.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (QZ.opts[k] === q.o[0]) b.classList.add('ok'); else if (k === i) b.classList.add('no'); });
  const dn = QZ.done >= QZ.need;
  box.querySelector('#qfb').innerHTML = (good ? '<b class="g">Correct!</b>' : '<b class="r">' + (i < 0 ? 'Time is up!' : 'Not quite.') + '</b> The answer is <b class="g">' + esc(q.o[0]) + '</b>.') + (q.fr ? '<br><i>' + esc(q.fr) + '</i>' : '') + (QZ.wrong ? '<br><b class="r">Bonus penalty so far: -' + (QZ.wrong * 1000) + '.</b>' : '');
  const nx = box.querySelector('#qNext'); nx.style.display = ''; nx.innerHTML = dn ? 'CONTINUE' : 'NEXT QUESTION (' + (QZ.done + 1) + ' / ' + QZ.need + ')';
  let dots = ''; for (let k = 0; k < QZ.need; k++) dots += QZ.res[k] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[k] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.querySelector('.dots').innerHTML = dots;

}
function closeQuiz() {
  stopQTimer();
  const cb = QZ && QZ.onCancel; QZ = null; document.getElementById('quiz').classList.remove('on');
  if (cb) cb();
}

restoreSession();

let booted = false; const go = () => { if (!booted) { booted = true; boot(); } };
if (document.fonts && document.fonts.load) { Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('20px "Press Start 2P"')]).then(go, go); setTimeout(go, 1500); } else go();
