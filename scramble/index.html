  const now = actx.currentTime;
  if (seq.next < now - 0.2) seq.next = now + 0.02;            // onglet resté en arrière-plan : on repart au présent

    return;
  }
  const a = ac(); if (!a) return;

      const g = a.createGain(); g.gain.value = 0;

      const l = a.createOscillator(), lg = a.createGain();
      l.type = 'sine'; l.frequency.value = 9; lg.gain.value = 0.01;                                    // ronronnement du ralenti

      l.connect(lg); lg.connect(g.gain);
      const mus = a.createGain(); mus.gain.value = 0; mus.connect(outNode());
      o1.start(); o2.start(); ns.start(); l.start();
      engine = { o1, o2, l, g, mus };
    }
    const t = a.currentTime;
    engine.o1.frequency.setTargetAtTime(55 + boost * 3, t, 0.3);
    engine.o2.frequency.setTargetAtTime(55.7 + boost * 3, t, 0.3);
    engine.l.frequency.setTargetAtTime(9 + boost * 2, t, 0.3);
    engine.g.gain.setTargetAtTime(0.035, t, 0.4);

}

function explode(x, y, size) {
  if (size >= 30) shake = Math.max(shake, size / 5);
  booms.push({ x, y, r: 4, max: size, life: 24 });
  const n = Math.round(size / 2) + 6;
  const cols = ['#ffd23a', '#ff8a1e', '#e8342a', '#fff3b0'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 0.6 + Math.random() * (size / 8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.4, life: 18 + Math.random() * 22, c: cols[(Math.random() * cols.length) | 0] });
  }
}
function pop(x, y, txt) { pops.push({ x, y, txt, life: 50 }); }

// carte de traduction : s'affiche à l'écran quand une cible portant un connecteur explose
function card(e, cx) {
  if (e.word === undefined) return;
  const c = DECK.items[e.word];
  if (!learned.some((l) => l.en === c[0] && l.d === DECK.id)) learned.push({ en: c[0], fr: c[1], d: DECK.id });
  profWord(wkey(DECK, c));
  cards.push({ x: cx - camX, y: clamp(e.y - 26, TOP + 30, BOT - 40), x0: 0, y0: 0, t: 0, en: c[0], fr: c[1], life: 54 });
  if (cards.length > 8) cards.shift();
}

// barème de l'arcade : fusée 50 au sol / 80 en l'air, OVNI 100, réservoir 150, cible mystère 100/200/300, base 800
function destroy(e) {
  if (!e.alive) return;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  if (e.type === 'rocket') {
    e.alive = false; addScore(e.state === 'fly' ? 80 : 50); explode(cx, cy, 26); sfx.boom(); card(e, cx);
  } else if (e.type === 'fuel') {
    e.alive = false; addScore(150); fuel = Math.min(100, fuel + 28);
    explode(cx, cy, 36); sfx.fuel(); card(e, cx);
  } else if (e.type === 'mystery') {
    const pts = [100, 200, 300][(Math.random() * 3) | 0];
    e.alive = false; addScore(pts); explode(cx, cy, 30); sfx.boom(); pop(cx, e.y - 6, String(pts));
  } else if (e.type === 'ufo') {
    e.alive = false; addScore(100); explode(cx, cy, 26); sfx.boom(); pop(cx, e.y - 4, '100');
  } else if (e.type === 'base') {
    e.hp--; e.flash = 8;
    explode(cx + (Math.random() - 0.5) * 70, cy + (Math.random() - 0.5) * 50, 38); sfx.boom();
    if (e.hp <= 0) {
      e.alive = false; addScore(800);
      for (let i = 0; i < 6; i++) explode(cx + (Math.random() - 0.5) * 100, cy + (Math.random() - 0.5) * 70, 40 + Math.random() * 30);
      sfx.base(); shake = 14; pop(cx, e.y - 10, '800');
      state = 'clear'; timer = 260; sfx.clear();
    } else {
      pop(cx, e.y - 10, '+');
    }
  }
}

function blast(x, y, R) {
  explode(x, y, R);
  for (const e of entities) {
    if (!e.alive || e.type === 'ufo' || e.type === 'meteor') continue;
    const nx = clamp(x, e.x, e.x + e.w), ny = clamp(y, e.y, e.y + e.h);
    if (Math.hypot(x - nx, y - ny) <= R) destroy(e);
  }
}

function killShip() {
  if (state !== 'play') return;
  state = 'dying'; timer = 110;
  const wx = camX + ship.x;
  explode(wx, ship.y, 48); explode(wx - 8, ship.y - 4, 30); sfx.big();
  bullets = []; bombs = [];
}

/* ============================================================
   Mise à jour
   ============================================================ */
function update() {
  frame++;
  syncAuth();
  if (state === 'title' || state === 'over') {
    setEngine(false);
    camX += 1.4; if (camX > MAXCAM) camX = 0;
    updateFx();
    return;
  }
  if (paused) { setEngine(false); return; }

  setEngine(state === 'play' && fuel > 0, (input.right ? 1 : 0) - (input.left ? 0.5 : 0));
  if (state === 'play') updatePlay();
  else if (state === 'dying') {
    updateWorldOnly();
    if (--timer <= 0) {
      lives--;
      if (lives <= 0) { state = 'over'; saveHi(); sfx.over(); profEnd(); }
      else {
        const cpX = Math.max(0, SECTIONS[sectionOf(camX + SEE)].start - SEE);   // on repart du début du niveau
        camX = Math.min(cpX, MAXCAM);
        fuel = 100;
        buildEntities();
        bullets = []; bombs = [];
        resetShipAt(camX);
        state = 'play';
        lastSec = sectionOf(camX + SEE); banner = { t: 90, txt: SECTIONS[lastSec].name };
      }
    }
  } else if (state === 'clear') {
    updateWorldOnly();
    if (--timer <= 0) {
      addScore(Math.round(fuel) * 10);
      level++; applyDifficulty();
      camX = 0; fuel = 100; lives = Math.min(6, lives + 1);
      DECK = DECKS[level % DECKS.length]; assignWords();
      buildEntities(); bullets = []; bombs = [];
      resetShipAt(0);
      state = 'play';
      lastSec = 0; banner = { t: 150, txt: 'LOOP ' + (level + 1) + ' : ' + DECK.name };
      saveHi();
    }
  }
  updateFx();
}

function saveHi() { try { localStorage.setItem('scramble-hi', String(hi)); } catch (e) {} }

function updateWorldOnly() {
  camX = Math.min(MAXCAM, camX + scroll * 0.5);
}

function updateFx() {
  for (const b of booms) { b.r += (b.max - b.r) * 0.22; b.life--; }
  booms = booms.filter((b) => b.life > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life--; }
  parts = parts.filter((p) => p.life > 0);
  for (const p of pops) { p.y -= 0.5; p.life--; }
  pops = pops.filter((p) => p.life > 0);
  for (const k of cards) {
    k.t++; k.life--;
    if (k.t < 16) k.y -= 0.5;                       // le mot apparaît sur l'explosion
    else {
      if (k.t === 16) { k.x0 = k.x; k.y0 = k.y; }
      const u = Math.min(1, (k.t - 16) / 36), e2 = u * u * (3 - 2 * u);
      k.x = k.x0 + (VSLOT[0] - k.x0) * e2; k.y = k.y0 + (BOT + 47 - k.y0) * e2;
      if (u >= 1) {                                // arrivée : le mot entre dans le panneau
        vocab.unshift({ en: k.en, fr: k.fr }); if (vocab.length > 3) vocab.pop();
        vflash = 16; k.life = 0; if (state !== 'over') sfx.card();
      }
    }
  }
  if (vflash > 0) vflash--;
  shake *= 0.86; if (shake < 0.2) shake = 0;
  cards = cards.filter((k) => k.life > 0);
  if (banner.t > 0) banner.t--;
}

function updatePlay() {
  for (const k in input) input[k] = kbd[k] || tch[k] || !!mse[k];

  // défilement ; le niveau 6 se rejoue tant que la base n'est pas détruite
  const before = camX;
  let sc;
  if (camX + scroll >= MAXCAM) {
    camX = Math.max(0, BASE_START - SEE); sc = 0;
    fuel = 100; ship.y = Math.min(ship.y, 150); ship.inv = 120;
    bullets = []; bombs = [];
    banner = { t: 100, txt: 'TRY AGAIN' };
  } else {
    camX += scroll; sc = camX - before;
  }

  const sec = sectionOf(camX + SEE);
  if (sec !== lastSec) { lastSec = sec; banner = { t: 110, txt: SECTIONS[sec].name }; }

  // 10 points par seconde de vol
  if (++secT >= 60) { secT = 0; addScore(10); }

  fuel -= drain;
  if (fuel < 0) fuel = 0;
  if (fuel > 0 && fuel < 20 && frame % 40 === 0) sfx.warn();

  // vaisseau
  const SPD = 2.6;
  let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
  if (dx && dy) { dx *= 0.78; dy *= 0.78; }
  let vx, vy;
  if (fuel > 0) { vx = dx * SPD; vy = dy * SPD; }
  else { vx = dx * 0.6; vy = 1.9; }
  const ox = ship.x, oy = ship.y;
  ship.x = clamp(ship.x + vx, 24, W - 34);
  ship.y = clamp(ship.y + vy, TOP + 8, BOT - 6);
  sv.x = ship.x - ox; sv.y = ship.y - oy;
  if (ship.inv > 0) ship.inv--;
  if (frame % 2 === 0) parts.push({ x: camX + ship.x - 20, y: ship.y + 1 + (Math.random() - 0.5) * 3, vx: -1.6 - Math.random(), vy: (Math.random() - 0.5) * 0.3, life: 9 + Math.random() * 6, c: Math.random() < 0.5 ? '#ffb347' : '#ff6a2a' });

  // tirs
  if (fireCd > 0) fireCd--;
  if (bombCd > 0) bombCd--;
  if (fuel > 0) {
    if (input.fire && fireCd <= 0 && bullets.length < 4) {
      bullets.push({ x: camX + ship.x + 18, px: camX + ship.x + 18, y: ship.y + 1 });
      fireCd = 9; sfx.laser();
    }
    if (input.bomb && bombCd <= 0 && bombs.length < 2) {
      // la bombe hérite de la vitesse du vaisseau (inertie) puis suit une trajectoire courbe
      bombs.push({ x: camX + ship.x + 2, y: ship.y + 6, vsx: 2.8 + sv.x, vsy: 0.5 + sv.y * 0.6 });
      bombCd = 18; sfx.bomb();
    }
  }

  const shipWX = camX + ship.x;

  // cibles
  const lo = camX - 80, hi2 = camX + W + 60;
  // comme sur l'arcade : une seule fusée en vol à la fois (deux, puis trois aux boucles suivantes)
  let flying = 0;
  for (const e of entities) if (e.alive && e.type === 'rocket' && e.state === 'fly') flying++;
  const maxFly = 1 + (level >= 1 ? 1 : 0) + (level >= 3 ? 1 : 0);
  for (const e of entities) {
    if (!e.alive || e.x + e.w < lo || e.x > hi2 + 300) continue;
    if (e.flash > 0) e.flash--;
    if (e.type === 'rocket') {
      const d = e.x - shipWX;
      if (e.state === 'idle' && e.launch && d > 10 && d < e.thr && flying < maxFly) { e.state = 'fly'; flying++; }
      if (e.state === 'fly') {
        e.vy = Math.max(e.vy - 0.07, -3.6);
        e.y += e.vy;
        if (e.y < TOP - 30) e.alive = false;
        else if (e.y < ceilAt(e.x + 7)) { explode(e.x + 7, e.y, 18); sfx.boom(); e.alive = false; }
      }
    } else if (e.type === 'ufo') {
      if (e.x - camX < W + 40) {
        e.x -= 2.1 + 0.15 * level;
        e.y = e.baseY + Math.sin((frame + e.ph) * 0.075) * 34;
      }
    } else if (e.type === 'meteor') {
      if (e.x - camX < W + 40) e.x -= 5.4 + 0.2 * level;      // file vers le vaisseau, indestructible
    }
  }

  // lasers (inefficaces contre les météores, les cibles mystère et la base)
  for (const b of bullets) {
    b.px = b.x;
    b.x += sc + 10;
    if (b.y > floorAt(b.x) || b.y < ceilAt(b.x)) { b.dead = true; parts.push({ x: b.x, y: b.y, vx: 0.5, vy: -0.5, life: 8, c: '#fff' }); continue; }
    if (b.x - camX > W + 10) { b.dead = true; continue; }
    for (const e of entities) {
      if (!e.alive || e.type === 'mystery' || e.type === 'meteor') continue;
      if (b.px <= e.x + e.w && b.x >= e.x && b.y >= e.y - 2 && b.y <= e.y + e.h + 2) {
        b.dead = true;
        if (e.type === 'base') parts.push({ x: b.x, y: b.y, vx: -0.5, vy: -0.3, life: 8, c: '#fff' });
        else destroy(e);
        break;
      }
    }
  }
  bullets = bullets.filter((b) => !b.dead);

  // bombes : inertie initiale, gravité, léger frottement de l'air
  for (const bm of bombs) {
    bm.vsy = Math.min(4.2, bm.vsy + 0.055);
    bm.vsx *= 0.996;
    bm.x += sc + bm.vsx;
    bm.y += bm.vsy;
    let hit = false;
    const fy = floorAt(bm.x);
    if (bm.y >= fy) { bm.y = fy - 2; hit = true; }
    else if (ceilAt(bm.x) > TOP + 1 && bm.y <= ceilAt(bm.x) - 2) hit = true;
    if (!hit) {
      for (const e of entities) {
        if (!e.alive || e.type === 'ufo' || e.type === 'meteor') continue;
        if (bm.x >= e.x - 3 && bm.x <= e.x + e.w + 3 && bm.y >= e.y - 3 && bm.y <= e.y + e.h + 3) { hit = true; break; }
      }
    }
    if (hit) { bm.dead = true; blast(bm.x, bm.y, 26); sfx.hit(); }
    else if (bm.y > H + 20 || bm.x - camX > W + 40) bm.dead = true;
  }
  bombs = bombs.filter((b) => !b.dead);
  if (state !== 'play') return;   // la base vient de tomber

  // collisions du vaisseau
  if (ship.inv <= 0) {
    for (let k = -14; k <= 17; k += 4) {
      const wx = shipWX + k;
      if (ship.y + 4 > floorAt(wx) || ship.y - 6 < ceilAt(wx)) { killShip(); return; }
    }
    const sx0 = shipWX - 14, sx1 = shipWX + 18, sy0 = ship.y - 6, sy1 = ship.y + 4;
    for (const e of entities) {
      if (!e.alive) continue;
      if (sx1 > e.x + 1 && sx0 < e.x + e.w - 1 && sy1 > e.y + 1 && sy0 < e.y + e.h - 1) { killShip(); return; }
    }
  }
}

/* ============================================================
   Dessin
   ============================================================ */
const px = (v) => Math.round(v);
function drawStars() {
  for (const s of stars) {
    let x = (s.x - camX * s.l) % W; if (x < 0) x += W;
    const tw = (Math.sin(frame * 0.05 + s.ph) + 1) / 2;
    ctx.globalAlpha = 0.3 + 0.7 * tw;
    ctx.fillStyle = s.c;
    if (HD) { ctx.beginPath(); ctx.arc(x, s.y, s.s * 0.55 + 0.2, 0, 6.2832); ctx.fill(); } else ctx.fillRect(px(x), px(s.y), s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

// relief : une colonne par colonne de l'arcade, couleurs relevées sur le jeu
function drawNavy() {
  if (!skyGrad) { skyGrad = ctx.createLinearGradient(0, TOP, 0, BOT); skyGrad.addColorStop(0, '#000034'); skyGrad.addColorStop(1, '#0a0a70'); }
  ctx.fillStyle = skyGrad;
  for (const r of LV.navy) {
    const x0 = r[0] * KX - camX, x1 = r[1] * KX - camX;
    if (x1 < 0 || x0 > W) continue;
    ctx.fillRect(Math.round(Math.max(0, x0)), TOP, Math.round(Math.min(W, x1) - Math.max(0, x0)), BOT - TOP);
  }
}
let shadeF = null, shadeC = null;
let PALL = null;
function lighten(hex, k) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (v) => Math.round(v + (255 - v) * k);
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function drawTerrainHD() {
  if (!PALL) PALL = PALC.map((c) => (c && c[0] === '#' && c.length === 7 ? lighten(c, 0.38) : c));
  const cx = Math.floor(camX);
  const v0 = Math.floor(cx / KX) - 2, v1 = Math.ceil((cx + W) / KX) + 2;
  const cw = Math.ceil(KX) + 1;
  if (!shadeF) {
    shadeF = ctx.createLinearGradient(0, 150, 0, BOT); shadeF.addColorStop(0, 'rgba(0,0,0,0)'); shadeF.addColorStop(1, 'rgba(0,0,0,0.5)');
    shadeC = ctx.createLinearGradient(0, TOP, 0, 260); shadeC.addColorStop(0, 'rgba(0,0,0,0.45)'); shadeC.addColorStop(1, 'rgba(0,0,0,0)');
  }
  const P = [];
  for (let v = v0; v <= v1; v++) {
    const vi = clamp(v, 0, LV.N - 1), wx = v * KX + KX / 2;
    P.push({ x: wx - cx, vi, fy: floorAt(wx), cy: ceilAt(wx) });
  }
  // sol
  ctx.save();
  ctx.beginPath(); ctx.moveTo(P[0].x, H);
  for (const q of P) ctx.lineTo(q.x, q.fy);
  ctx.lineTo(P[P.length - 1].x, H); ctx.closePath(); ctx.clip();
  for (const q of P) { ctx.fillStyle = PALC[PF[q.vi]]; ctx.fillRect(q.x - KX / 2 - 0.4, TOP, cw, H - TOP); }
  ctx.fillStyle = shadeF; ctx.fillRect(0, TOP, W, H - TOP);
  ctx.restore();
  ctx.lineCap = 'round'; ctx.lineWidth = 2.6;
  for (let i = 0; i < P.length - 1; i++) {
    ctx.strokeStyle = PALL[PF[P[i].vi]];
    ctx.beginPath(); ctx.moveTo(P[i].x, P[i].fy + 1.4); ctx.lineTo(P[i + 1].x, P[i + 1].fy + 1.4); ctx.stroke();
  }
  ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath();
  P.forEach((q, i) => (i ? ctx.lineTo(q.x, q.fy) : ctx.moveTo(q.x, q.fy))); ctx.stroke();
  // plafond
  if (P.some((q) => q.cy > TOP + 0.5)) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(P[0].x, TOP - 1);
    for (const q of P) ctx.lineTo(q.x, Math.max(TOP, q.cy));
    ctx.lineTo(P[P.length - 1].x, TOP - 1); ctx.closePath(); ctx.clip();
    for (const q of P) { ctx.fillStyle = PALC[PCe[q.vi]]; ctx.fillRect(q.x - KX / 2 - 0.4, TOP, cw, H - TOP); }
    ctx.fillStyle = shadeC; ctx.fillRect(0, TOP, W, BOT - TOP);
    ctx.restore();
    ctx.lineWidth = 3.2;
    for (let i = 0; i < P.length - 1; i++) {
      if (P[i].cy <= TOP + 0.5 && P[i + 1].cy <= TOP + 0.5) continue;
      ctx.strokeStyle = PALL[PCe[P[i].vi]];
      ctx.beginPath(); ctx.moveTo(P[i].x, P[i].cy - 1.4); ctx.lineTo(P[i + 1].x, P[i + 1].cy - 1.4); ctx.stroke();
    }
    ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(255,255,255,0.32)'; ctx.beginPath();
    P.forEach((q, i) => (i ? ctx.lineTo(q.x, q.cy) : ctx.moveTo(q.x, q.cy))); ctx.stroke();
  }
  ctx.lineCap = 'butt';
}
function drawTerrain() {
  if (HD) { drawTerrainHD(); return; }
  const cx = Math.floor(camX);
  const v0 = Math.floor(cx / KX) - 1, v1 = Math.ceil((cx + W) / KX) + 1;
  const cw = Math.ceil(KX) + 1;
  for (let v = v0; v <= v1; v++) {
    const vi = clamp(v, 0, LV.N - 1);
    const sx = Math.round(v * KX - cx);
    const wx = v * KX + KX / 2;
    const fy = floorAt(wx), cy = ceilAt(wx);
    ctx.fillStyle = PALC[PF[vi]]; ctx.fillRect(sx, fy, cw, H - fy);
    ctx.fillStyle = 'rgba(0,0,0,0.20)'; ctx.fillRect(sx, fy + 16, cw, H - fy - 16);
    ctx.fillStyle = 'rgba(0,0,0,0.20)'; ctx.fillRect(sx, fy + 44, cw, H - fy - 44);
    ctx.fillStyle = PALC[PE[vi]]; ctx.fillRect(sx, fy, cw, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.30)'; ctx.fillRect(sx, fy, cw, 1);
    if (cy > TOP + 0.5) {
      ctx.fillStyle = PALC[PCe[vi]]; ctx.fillRect(sx, TOP, cw, cy - TOP);
      ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(sx, TOP, cw, Math.max(0, cy - TOP - 18));
      ctx.fillStyle = PALC[PE[vi]]; ctx.fillRect(sx, cy - 3, cw, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(sx, cy - 1, cw, 1);
    }
  }
}

function drawBase(e) {

function drawShipSprite(x, y, withFlame) {
  const ix = px(x) - 18, iy = px(y) - 8;
  if (withFlame && HD) {
    const L = 12 + ((frame >> 1) & 3) * 3;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = lg(ctx, ix, 0, ix - L, 0, [[0, '#ffffff'], [0.25, '#ffe27a'], [0.6, 'rgba(255,120,30,0.75)'], [1, 'rgba(232,52,42,0)']]);
    poly(ctx, [[ix + 1, iy + 6.2], [ix - L, iy + 8], [ix + 1, iy + 9.8]]);
    ctx.fillStyle = 'rgba(120,180,255,0.35)'; poly(ctx, [[ix + 1, iy + 7], [ix - L * 0.55, iy + 8], [ix + 1, iy + 9]]);
    ctx.globalCompositeOperation = 'source-over';
  } else if (withFlame) {
    ctx.fillStyle = (frame & 2) ? '#ffd23a' : '#ff8a1e';
    ctx.fillRect(ix - 8, iy + 8, 8, 4);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(ix - 2, iy + 9, 2, 2);
    if (frame & 4) { ctx.fillStyle = '#e8342a'; ctx.fillRect(ix - 12, iy + 9, 4, 2); }
  }
  spr(SPR.ship, ix, iy);
}

// traînée de comète : trois nappes qui ondulent (rouge, orange, or) et des braises qui s'envolent, aux couleurs des explosions du jeu
function streak(x0, y0, len, wid, wob, stops) {
  ctx.beginPath();
  ctx.moveTo(x0, y0 - wid);
  ctx.quadraticCurveTo(x0 + len * 0.5, y0 - wid * 0.5 + wob, x0 + len, y0 + wob * 0.7);
  ctx.quadraticCurveTo(x0 + len * 0.5, y0 + wid * 0.5 + wob, x0, y0 + wid);
  ctx.closePath();
  ctx.fillStyle = lg(ctx, x0, 0, x0 + len, 0, stops); ctx.fill();
}
function meteorTrail(X, Y, ph) {
  const t = frame * 0.22 + ph, wob = Math.sin(t) * 3.2, x0 = X + 20, y0 = Y + 8;
  ctx.globalCompositeOperation = 'lighter';
  streak(x0, y0, 120 + Math.sin(t * 1.3) * 10, 9, wob, [[0, 'rgba(232,52,42,0.7)'], [0.5, 'rgba(200,40,30,0.3)'], [1, 'rgba(120,20,20,0)']]);
  streak(x0, y0, 86 + Math.sin(t * 1.7) * 8, 6, wob * 0.8, [[0, 'rgba(255,138,30,0.9)'], [0.6, 'rgba(255,110,30,0.35)'], [1, 'rgba(255,90,30,0)']]);
  streak(x0, y0, 50 + Math.sin(t * 2.1) * 6, 3.4, wob * 0.5, [[0, 'rgba(255,250,220,1)'], [0.4, 'rgba(255,210,58,0.8)'], [1, 'rgba(255,210,58,0)']]);
  for (let k = 0; k < 7; k++) {
    const age = ((frame * 1.6 + k * 23 + ph * 9) % 64) / 64;
    const sx = x0 + 6 + age * 110, sy = y0 + Math.sin(k * 2.3 + age * 7) * (3 + 9 * age);
    ctx.fillStyle = k % 2 ? 'rgba(255,210,58,' + (1 - age) + ')' : 'rgba(255,138,30,' + (1 - age) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, 1.7 * (1 - age) + 0.4, 0, 6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function ufoTrail(X, Y, ph) {
  const t = frame * 0.2 + ph, y0 = Y + 7;
  ctx.globalCompositeOperation = 'lighter';
  streak(X + 24, y0, 46, 3.2, Math.sin(t) * 1.5, [[0, 'rgba(112,240,255,0.55)'], [1, 'rgba(112,240,255,0)']]);
  streak(X + 24, y0 + 1, 30, 1.8, Math.sin(t + 1) * 1.2, [[0, 'rgba(255,90,208,0.5)'], [1, 'rgba(255,90,208,0)']]);
  ctx.globalCompositeOperation = 'source-over';
}
function drawEntities() {
  for (const e of entities) {
    if (!e.alive) continue;
    const sx = e.x - camX;
    if (sx > W + 40 || sx + e.w < -40) continue;
    const X = px(sx), Y = px(e.y);
    if (e.type === 'rocket') {
      if (e.state === 'fly' && HD) {
        const L = 12 + ((frame >> 1) & 3) * 3;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = lg(ctx, 0, Y + 28, 0, Y + 28 + L, [[0, '#ffffff'], [0.3, '#ffd23a'], [0.7, 'rgba(255,110,30,0.7)'], [1, 'rgba(232,52,42,0)']]);
        poly(ctx, [[X + 4.4, Y + 27], [X + 7, Y + 28 + L], [X + 9.6, Y + 27]]);
        ctx.globalCompositeOperation = 'source-over';
      } else if (e.state === 'fly') {
        ctx.fillStyle = (frame & 2) ? '#ffd23a' : '#ff8a1e'; ctx.fillRect(X + 4, Y + 30, 6, 8 + ((frame >> 1) & 3) * 2);
        ctx.fillStyle = '#e8342a'; ctx.fillRect(X + 6, Y + 38, 2, 4 + ((frame >> 2) & 1) * 2);
      }
      spr(SPR.rocket, X, Y);
    } else if (e.type === 'fuel') {
      spr(SPR.fuel, X, Y);
    } else if (e.type === 'mystery') {
      spr(SPR.mystery, X, Y);
    } else if (e.type === 'ufo') {
      if (HD) ufoTrail(X, Y, e.ph);
      spr(SPR.ufo, X, Y);
      const cols = ['#ffd23a', '#ff5ad0', '#70f0ff'];
      for (let i = 0; i < 3; i++) { ctx.fillStyle = cols[(i + (frame >> 3)) % 3]; ctx.fillRect(X + 6 + i * 8, Y + 6, 4, 2); }
    } else if (e.type === 'meteor') {
      if (HD) { meteorTrail(X, Y, e.ph); spr(SPR.meteor, X, Y); }
      else {
        spr(SPR.meteor, X, Y);
        ctx.fillStyle = (frame & 4) ? '#ff8a1e' : '#e8342a';
        ctx.fillRect(X + 32, Y + 6, 8 + ((frame >> 1) & 1) * 6, 4);
        ctx.fillStyle = '#ffd23a'; ctx.fillRect(X + 32, Y + 7, 4 + ((frame >> 2) & 1) * 4, 2);
      }
    } else if (e.type === 'base') drawBase(e);
  }
}

function textW(s) {
  const m = ctx.measureText(s);
  return m && m.width ? m.width : s.length * 10;
}

// fanion « connecteur » planté sur chaque réservoir : il fait partie du décor et défile avec lui
function drawTags() {
  ctx.font = '8px ' + FONT; ctx.textAlign = 'left';
  for (const e of entities) {
    if (!e.alive || e.word === undefined) continue;
    const sx = e.x - camX;
    if (sx < -140 || sx > W + 20) continue;
    const label = DECK.items[e.word][0];
    const bw = Math.round(textW(label)) + 16, bh = 15;
    const mx = Math.round(sx + e.w / 2);
    const fy0 = Math.max(TOP + 3, Math.round(e.y - 12 - e.lane * 17 - bh));
    const wav = Math.sin(frame * 0.12 + e.x * 0.05) * 1.2;
    // mât
    ctx.fillStyle = '#c8cde0'; ctx.fillRect(mx - 1, fy0, 2, Math.round(e.y) - fy0 + 2);
    // fanion à queue d'hirondelle
    ctx.beginPath();
    ctx.moveTo(mx + 1, fy0); ctx.lineTo(mx + bw, fy0 + wav * 0.5); ctx.lineTo(mx + bw - 6, fy0 + bh / 2 + wav);
    ctx.lineTo(mx + bw, fy0 + bh + wav * 0.5); ctx.lineTo(mx + 1, fy0 + bh); ctx.closePath();
    ctx.fillStyle = 'rgba(8,10,28,0.92)'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#ffd23a'; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillText(label, mx + 7, fy0 + 11);
  }
}

// mot qui jaillit de l'explosion puis file vers le panneau VOCABULARY
function drawCards() {
  ctx.textAlign = 'center';
  for (const k of cards) {
    const a = Math.min(1, k.t / 6);
    ctx.globalAlpha = a;
    const sc = k.t < 16 ? 0.6 + 0.4 * Math.min(1, k.t / 10) : 1;
    ctx.font = Math.round(10 * sc) + 'px ' + FONT;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,10,0.85)'; ctx.lineJoin = 'round';
    ctx.strokeText(k.en, k.x, k.y); ctx.fillStyle = '#ffffff'; ctx.fillText(k.en, k.x, k.y);
    ctx.strokeText(k.fr, k.x, k.y + 14); ctx.fillStyle = '#ffd23a'; ctx.fillText(k.fr, k.x, k.y + 14);
  }
  ctx.globalAlpha = 1; ctx.lineJoin = 'miter';
}

function drawBomb(bm) {
  const sx = bm.x - camX, sy = bm.y;
  const ang = Math.atan2(bm.vsy, bm.vsx);
  if (HD) {
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
    ctx.fillStyle = lg(ctx, 0, -3, 0, 3, [[0, '#ffffff'], [1, '#8f9ac0']]);
    ctx.beginPath(); ctx.ellipse(0, 0, 5.4, 2.8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#e8342a'; poly(ctx, [[-4, 0], [-8, -3.8], [-6, 0], [-8, 3.8]]);
    ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(4.6, 0, 1, 0, 6.2832); ctx.fill();
    ctx.restore(); return;
  }
  ctx.save(); ctx.translate(px(sx), px(sy)); ctx.rotate(ang);
  ctx.fillStyle = '#e8ecff'; ctx.fillRect(-4, -2, 8, 4);
  ctx.fillStyle = '#7a84a8'; ctx.fillRect(-4, -2, 2, 4);
  ctx.fillStyle = '#ffd23a'; ctx.fillRect(4, -1, 2, 2);
  ctx.fillStyle = '#e8342a'; ctx.fillRect(-6, -3, 2, 6);
  ctx.restore();
}

function pixDisc(cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let dy = -r; dy <= r; dy += 4) {
    const w = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)) / 4) * 4;
    if (w > 0) ctx.fillRect(px(cx - w), px(cy + dy), w * 2, 4);
  }
}

function drawFxAndShots() {
  for (const b of bullets) {
    const x = px(b.x - camX), y = px(b.y);
    if (HD) {
      ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(44,255,122,0.22)'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.lineTo(x, y); ctx.stroke();
      ctx.strokeStyle = 'rgba(44,255,122,0.55)'; ctx.lineWidth = 4.2; ctx.beginPath(); ctx.moveTo(x - 15, y); ctx.lineTo(x, y); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = '#eafff0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x, y); ctx.stroke();
      ctx.lineCap = 'butt';
      continue;
    }
    ctx.fillStyle = 'rgba(44,255,122,0.22)'; ctx.fillRect(x - 22, y - 4, 28, 8);
    ctx.fillStyle = 'rgba(44,255,122,0.45)'; ctx.fillRect(x - 18, y - 2, 22, 4);
    ctx.fillStyle = '#2cff7a'; ctx.fillRect(x - 12, y - 1, 14, 2);
    ctx.fillStyle = '#d6ffe4'; ctx.fillRect(x - 2, y - 1, 4, 2);
  }
  for (const bm of bombs) drawBomb(bm);
  for (const b of booms) {
    const x = b.x - camX, f = b.life / 24;
    ctx.globalAlpha = f < 0.3 ? f / 0.3 : 1;
    if (b.max >= 26) {
      ctx.globalAlpha = 0.5 * f; ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, b.y, b.max * (1.9 - f) * 0.9, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = f < 0.3 ? f / 0.3 : 1;
    }
    if (HD) {
      const R = Math.max(2, b.r * 1.5);
      const g = ctx.createRadialGradient(x, b.y, 0, x, b.y, R);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.22, '#fff0a8'); g.addColorStop(0.5, '#ff9a22'); g.addColorStop(0.82, 'rgba(232,52,42,0.65)'); g.addColorStop(1, 'rgba(232,52,42,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, b.y, R, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    pixDisc(x, b.y, b.r * 1.35, 'rgba(255,120,30,0.18)');
    pixDisc(x, b.y, b.r, '#e8342a');
    pixDisc(x, b.y, b.r * 0.78, '#ff8a1e');
    pixDisc(x, b.y, b.r * 0.55, '#ffd23a');
    if (f > 0.4) pixDisc(x, b.y, b.r * 0.28, '#ffffff');
  }
  ctx.globalAlpha = 1;
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 16));
    ctx.fillStyle = p.c;
    if (HD) { ctx.beginPath(); ctx.arc(p.x - camX, p.y, 1.1 + Math.min(1.6, p.life / 14), 0, 6.2832); ctx.fill(); }
    else ctx.fillRect(px(p.x - camX), px(p.y), 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.font = '10px ' + FONT; ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = '#fff'; ctx.fillText(p.txt, px(p.x - camX), px(p.y));
  }
  ctx.globalAlpha = 1;
}

const pad = (n, l) => String(n).padStart(l, '0');

function drawHud() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, TOP); ctx.fillRect(0, BOT, W, H - BOT);
  ctx.fillStyle = '#1b2347'; ctx.fillRect(0, TOP - 2, W, 2); ctx.fillRect(0, BOT, W, 2);
  ctx.textAlign = 'left'; ctx.font = '10px ' + FONT;
  ctx.fillStyle = '#ff3a2a'; ctx.fillText('1UP', 28, 13);
  ctx.fillStyle = '#ffffff'; ctx.fillText(pad(score, 6), 28, 28);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3a2a'; ctx.fillText('HIGH SCORE', W / 2, 13);
  ctx.fillStyle = '#ffffff'; ctx.fillText(pad(hi, 6), W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff3a2a'; ctx.fillText('LOOP', W - 28, 13);
  ctx.fillStyle = '#ffffff'; ctx.fillText(String(level + 1), W - 28, 28);

  for (let i = 0; i < lives; i++) spr(SPR.ship, 12 + i * 40, BOT + 10, 36, 16);
  for (let i = 0; i < 2; i++) {
    const bx0 = 190 + i * 30, on = i >= bombs.length;
    ctx.fillStyle = on ? '#e8ecff' : '#262c4a'; ctx.fillRect(bx0, BOT + 14, 18, 8);
    ctx.fillStyle = on ? '#e8342a' : '#3a2230'; ctx.fillRect(bx0 - 3, BOT + 11, 3, 14);
    ctx.fillStyle = on ? '#ffd23a' : '#3a3a30'; ctx.fillRect(bx0 + 18, BOT + 16, 3, 4);
  }
  ctx.textAlign = 'left'; ctx.font = '10px ' + FONT;
  ctx.fillStyle = '#ff3a2a'; ctx.fillText('FUEL', 262, BOT + 22);
  const bx = 322, bw = 200;
  ctx.fillStyle = '#1a2040'; ctx.fillRect(bx, BOT + 10, bw, 14);
  const low = fuel < 20;
  const col = low ? ((frame & 8) ? '#ff3b30' : '#7a1d18') : (fuel < 45 ? '#ffb020' : '#35d07f');
  const fw = Math.round((bw - 4) * (fuel / 100) / 4) * 4;
  ctx.fillStyle = col; ctx.fillRect(bx + 2, BOT + 12, fw, 10);
  ctx.fillStyle = '#000';
  for (let i = 1; i < 25; i++) ctx.fillRect(bx + 2 + i * 8 - 2, BOT + 12, 2, 10);
  ctx.strokeStyle = '#5b78c4'; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, BOT + 11, bw - 2, 12);

  // les six niveaux : 1 à 5 puis la base
  const cur = sectionOf(camX + SEE);
  const labels = ['1', '2', '3', '4', '5', 'B'];
  ctx.textAlign = 'center';
  for (let i = 0; i < 6; i++) {
    const x = 546 + i * 40;
    ctx.fillStyle = i < cur ? '#2f4a8c' : (i === cur ? '#ffd23a' : '#141b38');
    ctx.fillRect(x, BOT + 8, 34, 18);
    ctx.fillStyle = i === cur ? '#000' : '#8aa0d8';
    ctx.fillText(labels[i], x + 17, BOT + 22);
  }
  // panneau VOCABULARY : les trois derniers connecteurs détruits
  const py = BOT + 30;
  ctx.fillStyle = '#1b2347'; ctx.fillRect(0, py - 1, W, 2);
  ctx.fillStyle = '#0a0e28'; ctx.fillRect(0, py + 1, W, H - py - 1);
  ctx.textAlign = 'left'; ctx.font = '8px ' + FONT; ctx.fillStyle = '#ff3a2a'; ctx.fillText('VOCABULARY', 14, py + 25);
  if (!vocab.length) {
    ctx.fillStyle = '#4a5a8c'; ctx.fillText('Destroy fuel tanks to collect words', 130, py + 25);
  }
  vocab.forEach((v, i) => {
    ctx.textAlign = 'center';
    ctx.font = '9px ' + FONT; if (textW(v.fr) > 205) ctx.font = '8px ' + FONT;
    const fl = i === 0 && vflash > 0;
    ctx.fillStyle = fl ? '#ffffff' : (i === 0 ? '#e8eeff' : '#8da0d8'); ctx.fillText(v.en, VSLOT[i], py + 16);
    ctx.fillStyle = fl ? '#fff3b0' : (i === 0 ? '#ffd23a' : '#9c8330'); ctx.fillText(v.fr, VSLOT[i], py + 31);
  });
  if (vflash > 0) { ctx.globalAlpha = vflash / 16 * 0.5; ctx.fillStyle = '#ffd23a'; ctx.fillRect(VSLOT[0] - 105, py + 3, 210, 2); ctx.globalAlpha = 1; }
  if (fuel <= 0 && state === 'play' && (frame & 16)) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ff3b30'; ctx.font = '12px ' + FONT;
    ctx.fillText('OUT OF FUEL', W / 2, 70);
  }
}

function centerText(txt, y, size, color) {
  ctx.textAlign = 'center'; ctx.fillStyle = color || '#fff';
  ctx.font = size + 'px ' + FONT;
  ctx.fillText(txt, W / 2, y);
}

let vig = null;
function drawVignette() {
  if (!vig) {
    vig = document.createElement('canvas'); vig.width = W; vig.height = H;
    const v = vig.getContext('2d'), g = v.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
    v.fillStyle = g; v.fillRect(0, 0, W, H);
  }
  ctx.drawImage(vig, 0, 0);
}
function drawScanlines() {
  drawVignette();
  if (HD) return;
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y + 3, W, 1);
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
  drawNavy();
  drawStars();
  drawTerrain();

  if (state === 'title' || state === 'over') {
    ctx.restore();
    drawHud();
    ctx.fillStyle = state === 'over' ? 'rgba(0,0,0,.8)' : 'rgba(0,0,0,.62)'; ctx.fillRect(0, TOP, W, BOT - TOP);
    if (state === 'title') {
      // le menu (profil, connecteurs, consignes) est une fenêtre HTML au-dessus du jeu
    } else {
      const n = learned.length;
      centerText('GAME OVER', n ? 100 : 210, 40, '#ff5a4a');
      centerText('SCORE ' + pad(score, 6) + (score >= hi && score > 0 ? '  NEW RECORD' : ''), n ? 134 : 262, 12, '#ffffff');
      if (n) {
        centerText('WORDS COLLECTED: ' + n, 170, 10, '#ffd23a');
        ctx.font = '8px ' + FONT; ctx.textAlign = 'left';
        const shown = learned.slice(0, 28);
        shown.forEach((l, i) => {
          const col = i < 14 ? 0 : 1, row = i % 14;
          const x = 34 + col * 390, y = 196 + row * 14;
          ctx.fillStyle = '#ffffff'; ctx.fillText(l.en, x, y);
          ctx.fillStyle = '#ffd23a'; ctx.fillText('= ' + l.fr, x + textW(l.en + ' '), y);
        });
        if (n > 28) centerText('+ ' + (n - 28) + ' MORE', 408, 8, '#9fb4ff');
      }
      if (PR.user) centerText(PR.status || '', n ? 152 : 290, 8, '#9fb4ff');
      if ((frame >> 5) & 1) centerText(isTouch ? 'TAP THE SCREEN TO PLAY AGAIN' : 'ENTER: PLAY AGAIN    ESC: MENU', n ? 438 : 330, 12, '#ffffff');
    }
    drawScanlines();
    return;
  }

  drawEntities();
  drawTags();
  if (state === 'play' && !(ship.inv > 0 && ((frame >> 2) & 1))) drawShipSprite(ship.x, ship.y, true);
  drawFxAndShots();
  drawCards();
  ctx.restore();
  drawHud();

  if (banner.t > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, banner.t / 30);
    centerText(banner.txt, 130, 32, '#ffd23a');
    ctx.globalAlpha = 1;
  }
  if (state === 'clear') {
    centerText('MISSION COMPLETE', 150, 28, '#7dffb0');
    centerText('BONUS FUEL ' + Math.round(fuel) * 10, 190, 14, '#ffffff');
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, TOP, W, BOT - TOP);
    centerText('PAUSE', 250, 48, '#ffffff');
    centerText(isTouch ? 'TAP THE SCREEN' : 'PRESS P TO RESUME', 296, 12, '#9fb4ff');
  }
  ctx.textAlign = 'left'; ctx.font = '8px ' + FONT; ctx.fillStyle = '#6f86b3'; ctx.fillText(HD ? 'HD' : 'RETRO', 10, BOT - 8);
  if (muted) { ctx.textAlign = 'right'; ctx.font = '8px ' + FONT; ctx.fillStyle = '#6f86b3'; ctx.fillText('SOUND OFF', W - 10, BOT - 8); }
  drawScanlines();
}

/* ============================================================
   Profil élève (même compte que Arrow Escape, Word Bridge, Christmas Village)
   : nom + code à 4 chiffres, connecteurs collectés sauvegardés en ligne
   ============================================================ */
const API = (typeof location !== 'undefined' && (location.protocol === 'file:' || /claude/.test(location.hostname))) ? 'https://letsplay-nine.vercel.app/api/player' : '/api/player';
const PR = { user: null, token: null, words: {}, best: 0, runs: 0, maxLoop: 1, destroyed: 0, guest: false, draft: '', mode: 'login', msg: '', offline: false, dirty: false, timer: null, flight: false, status: '', shown: false, ready: false };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
const escH = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function canStart() { return PR.guest || !!PR.user; }
function nCollected(d) { return d.items.filter((c) => PR.words[wkey(d, c)] > 0).length; }
function nTotal() { return DECKS.reduce((a, d) => a + d.items.length, 0); }
function nAll() { return DECKS.reduce((a, d) => a + nCollected(d), 0); }
function apiPost(action, body) {
  const h = { 'Content-Type': 'application/json' };
  if (PR.token) h.Authorization = 'Bearer ' + PR.token;
  try {
    return fetch(API, { method: 'POST', headers: h, keepalive: true, body: JSON.stringify(Object.assign({ action, game: 'sc' }, body || {})) })
      .then((r) => r.json().catch(() => ({})).then((j) => ({ ok: r.ok, status: r.status, j })))
      .catch(() => ({ ok: false, status: 0, j: { error: 'No connection to the server.' } }));
  } catch (e) { return Promise.resolve({ ok: false, status: 0, j: { error: 'No connection to the server.' } }); }
}
function localKey() { return 'scProg:' + (PR.user ? PR.user.key : 'guest'); }
function adopt(sc) {
  // fusion serveur + copie locale : on ne perd jamais un connecteur
  let loc = null; try { loc = JSON.parse(lsGet(localKey()) || 'null'); } catch (e) {}
  const words = {};
  [sc && sc.words, loc && loc.words].forEach((w) => { if (w) Object.keys(w).forEach((k) => { words[k] = Math.max(words[k] || 0, w[k] | 0); }); });
  PR.words = words;
  PR.best = Math.max((sc && sc.best) | 0, (loc && loc.best) | 0);
  PR.runs = Math.max((sc && sc.runs) | 0, (loc && loc.runs) | 0);
  PR.maxLoop = Math.max(1, (sc && sc.maxLoop) | 0, (loc && loc.maxLoop) | 0);
  PR.destroyed = Math.max((sc && sc.destroyed) | 0, (loc && loc.destroyed) | 0);
}
function snapshot() {
  PR.best = Math.max(PR.best, score);
  PR.maxLoop = Math.max(PR.maxLoop, level + 1);
  return { words: PR.words, best: PR.best, runs: PR.runs, maxLoop: PR.maxLoop, destroyed: PR.destroyed, savedAt: Date.now() };
}
function scheduleSave() {
  if (!PR.user) return;
  lsSet(localKey(), JSON.stringify(snapshot()));
  PR.dirty = true; PR.status = 'Saving soon...';
  clearTimeout(PR.timer); PR.timer = setTimeout(flush, 6000);
}
function flush() {
  clearTimeout(PR.timer);
  if (!PR.user || !PR.token || !PR.dirty) return;
  if (PR.flight) { PR.timer = setTimeout(flush, 2500); return; }
  PR.dirty = false; PR.flight = true; PR.status = 'Saving...';
  apiPost('save', { progress: snapshot() }).then((r) => {
    PR.flight = false;
    if (r.status === 401) { PR.token = null; saveSession(); PR.status = 'Session expired. Log in again to keep saving online.'; return; }
    if (!r.ok) { PR.dirty = true; PR.status = 'Not saved online (kept on this device). Retrying.'; PR.timer = setTimeout(flush, 20000); return; }
    PR.status = 'Saved to your profile.';
    if (r.j && r.j.sc) adopt(r.j.sc);
  });
}
function saveSession() { if (PR.user && PR.token) lsSet('letsplaySession', JSON.stringify({ user: PR.user, token: PR.token })); else lsDel('letsplaySession'); }
function onAuth(j) {
  PR.user = j.user; PR.token = j.token; PR.msg = ''; PR.offline = false;
  adopt(j.sc); saveSession(); PR.ready = true; renderAuth();
}
function logout() { flush(); PR.user = null; PR.token = null; PR.words = {}; PR.best = 0; PR.runs = 0; PR.maxLoop = 1; PR.destroyed = 0; PR.guest = false; saveSession(); renderAuth(); }
// appelé à chaque partie : début, connecteur collecté, fin
function profStart() { if (PR.user) { PR.runs++; scheduleSave(); } }
function profWord(en) { if (!PR.user) return; PR.words[en] = (PR.words[en] || 0) + 1; PR.destroyed++; scheduleSave(); }
function profEnd() { if (PR.user) { lsSet(localKey(), JSON.stringify(snapshot())); PR.dirty = true; flush(); } }
function restoreSession() {
  let ss = null; try { ss = JSON.parse(lsGet('letsplaySession') || 'null'); } catch (e) {}
  if (!ss || !ss.user || !ss.token) { PR.ready = true; renderAuth(); return; }
  PR.user = ss.user; PR.token = ss.token;
  adopt(null);                                    // copie locale d'abord (affichage immédiat)
  PR.ready = true; renderAuth();
  apiPost('load').then((r) => {
    if (r.status === 401) { PR.user = null; PR.token = null; saveSession(); renderAuth(); return; }
    if (r.ok) { adopt(r.j.sc); renderAuth(); if (PR.dirty) flush(); } else if (r.status === 0) { PR.offline = true; renderAuth(); }
  });
}
function renderAuth() {
  let box = null;
  try { box = document.getElementById('authBox'); } catch (e) {}
  if (!box || !box.addEventListener) return;
  const $ = (q) => box.querySelector(q);
  let h = '<h1>SCRAMBLE <span>TOEIC</span></h1>';
  if (PR.user) {
    const tot = nTotal(), n = nAll();
    h += '<p class="sub">Shoot the fuel tanks and collect the words. Each loop changes the deck: connectors, irregular verbs, TOEIC vocabulary.</p>' +
      '<div class="who"><span>Logged in as <b>' + escH(PR.user.nom) + '</b></span><button class="btn" id="aOut">Log out</button></div>' +
      '<div class="stats"><div class="stat"><b>' + n + ' / ' + tot + '</b><span>words collected</span></div>' +
      '<div class="stat"><b>' + PR.best + '</b><span>best score</span></div>' +
      '<div class="stat"><b>' + PR.runs + '</b><span>games played</span></div></div>' +
      '<div class="row"><button class="btn solid big" id="aPlay">PLAY</button></div>' +
      '<p class="msg" style="color:#a9b3c9">' + escH(PR.status) + '</p>' +
      DECKS.map((d) => '<details><summary>' + escH(d.name) + ' (' + nCollected(d) + ' / ' + d.items.length + ')</summary><div class="words">' +
        d.items.slice().sort((p, q) => ((PR.words[wkey(d, q)] > 0) - (PR.words[wkey(d, p)] > 0))).map((c) => PR.words[wkey(d, c)] > 0
          ? '<div class="w ok"><b>' + escH(c[0]) + '</b> <i>= ' + escH(c[1]) + '</i> <span class="muted">x' + PR.words[wkey(d, c)] + '</span></div>'
          : '<div class="w no">' + escH(c[0]) + ' = ?</div>').join('') + '</div></details>').join('');
  } else if (PR.guest) {
    h += '<p class="sub">Guest mode: nothing is saved.</p><div class="row"><button class="btn solid big" id="aPlay">PLAY</button></div>';
  } else {
    const su = PR.mode === 'signup';
    h += '<p class="sub">Log in to play. Your collected connectors are saved.</p>' +
      '<div class="tabs"><button class="tab' + (su ? '' : ' on') + '" data-t="login">Log in</button><button class="tab' + (su ? ' on' : '') + '" data-t="signup">Create my profile</button></div>' +
      '<input id="fNom" placeholder="Your name (e.g. DUPONT Lea)" autocomplete="name" maxlength="40">' +
      '<input id="fCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit secret code" autocomplete="off">' +
      '<p class="msg" id="aMsg">' + escH(PR.msg) + '</p>' +
      '<div class="row"><button class="btn solid big" id="aGo">' + (su ? 'Create profile' : 'Log in') + '</button></div>' +
      (PR.offline ? '<div class="row"><button class="btn" id="aGuest">Server unreachable: play as guest (not saved)</button></div>' : '') +
      '<p class="muted">It is the same profile as in Arrow Escape, Word Bridge and Christmas Village.</p>';
  }
  h += '<details><summary>Directions</summary><p>LEFT mouse button or LEFT arrow: laser (rockets, UFOs, fuel tanks). RIGHT mouse button or RIGHT arrow: bomb (two at a time). ZQSD / WASD: move. P: pause. M: sound. H: HD / retro.<br>Every fuel tank carries a word on a flag. Destroy it to collect it with its translation. Finish a loop (destroy the base) and the next loop changes deck: connectors, then irregular verbs (past simple / past participle), then TOEIC vocabulary. Meteors cannot be destroyed: dodge them. Do not run out of fuel!</p></details>';
  box.innerHTML = h;
  { const fn = box.querySelector('#fNom'); if (fn) { fn.value = PR.draft; fn.addEventListener('input', () => { PR.draft = fn.value; }); } }
  box.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { PR.mode = t.getAttribute('data-t'); PR.msg = ''; renderAuth(); }));
  const go = $('#aGo');
  if (go) {
    const submit = () => {
      const su = PR.mode === 'signup', body = { nom: $('#fNom').value.trim(), code: $('#fCode').value.trim() }, m = $('#aMsg');
      if (!body.nom) { m.textContent = 'Please enter your name.'; return; }
      if (!/^\d{4}$/.test(body.code)) { m.textContent = 'Your secret code must be exactly 4 digits.'; return; }
      go.disabled = true; m.textContent = 'Please wait...';
      apiPost(su ? 'signup' : 'login', body).then((r) => {
        if (r.ok) { onAuth(r.j); return; }
        go.disabled = false; PR.msg = r.j.error || 'Something went wrong.';
        if (r.status === 0) PR.offline = true;
        renderAuth();
      });
    };
    go.addEventListener('click', submit);
    box.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); }));
  }
  const gs = $('#aGuest'); if (gs) gs.addEventListener('click', () => { PR.guest = true; renderAuth(); });
  const pl = $('#aPlay'); if (pl) pl.addEventListener('click', () => { ac(); if (canStart() && state === 'title') startGame(); });
  const ou = $('#aOut'); if (ou) ou.addEventListener('click', logout);
}
// la fenêtre n'est visible que sur l'écran titre
function syncAuth() {
  const want = state === 'title';
  if (want === PR.shown) return;
  PR.shown = want;
  try { const a = document.getElementById('auth'); if (a && a.classList) a.classList[want ? 'add' : 'remove']('on'); } catch (e) {}
  if (want) renderAuth();
}
restoreSession();
try {
  window.addEventListener('pagehide', () => flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
} catch (e) {}

/* ============================================================
   Boucle principale (pas fixe de 1/60 s)
   ============================================================ */
let last = 0, acc = 0;
function loop(t) {
  if (!last) last = t;
  acc += Math.min(100, t - last); last = t;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) { update(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  draw();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);

// Accès pour les tests automatisés
window.__sc = { boomAt, getReverb, DECKS, wkey, deck: () => DECK, nextLoop: () => { level++; DECK = DECKS[level % DECKS.length]; assignWords(); buildEntities(); }, update, draw, startGame, templates, FL, CL, floorAt, ceilAt, sectionOf, kbd, SECTIONS, CONNECTORS, LV, KX, KY,
  destroy, set: (o) => { if ('camX' in o) camX = o.camX; if ('fuel' in o) fuel = o.fuel; if ('lives' in o) lives = o.lives; },
  get: () => ({ state, camX, score, lives, fuel, ship, sv, entities, bullets, bombs, level, paused, cards }) };
})();
