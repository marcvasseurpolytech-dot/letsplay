<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Arrow Escape TOEIC</title>

<style>
:root{
  --navy:#0d1b3a; --navy2:#16294f; --navy3:#1f3868;
  --gold:#c9a227; --cream:#f5eedc; --red:#e0584f; --green:#3fae76;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--cream);font-family:'Source Serif 4',Georgia,serif}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:20px;letter-spacing:.5px}
.brand span{color:var(--gold)}
.stats{display:flex;gap:12px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.stats b{color:var(--cream);font-size:14px}
.lives{display:flex;gap:2px;font-size:18px;color:var(--red);letter-spacing:1px}
.lives .lost{color:#3a4668}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:4px}
.btn{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.35;cursor:default}
.btn.solid{background:var(--gold);color:var(--navy)}
.board{position:relative;background:var(--navy2);border:1px solid rgba(201,162,39,.45);border-radius:12px;overflow:hidden;display:flex;justify-content:center}
#svg{display:block;width:100%;height:auto;max-height:50vh;touch-action:manipulation}
.dot{fill:rgba(245,238,220,.14)}
.arrow .body{fill:none;stroke:var(--cream);stroke-width:.2;stroke-linecap:round;stroke-linejoin:round}
.arrow .head{fill:var(--cream);stroke:var(--cream);stroke-width:.04;stroke-linejoin:round}
.arrow.open .body{stroke:var(--gold)}
.arrow.open .head{fill:var(--gold);stroke:var(--gold)}
.arrow .hit{fill:none;stroke:transparent;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}
.arrow.sel{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}
.arrow.crash .body{stroke:var(--red)}
.arrow.crash .head{fill:var(--red);stroke:var(--red)}
.arrow.hint{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{filter:drop-shadow(0 0 7px #7fe3a8)}}
.panel{background:var(--navy2);border:1px solid rgba(245,238,220,.14);border-radius:12px;padding:12px;min-height:215px;display:flex;flex-direction:column;gap:10px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.sentence{font-size:18px;line-height:1.35}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--gold);text-align:center;font-weight:600;color:var(--gold)}
.gap.ok{color:var(--green);border-color:var(--green)}
.gap.ko{color:var(--red);border-color:var(--red)}
.verb{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font-family:'Source Serif 4',Georgia,serif;font-size:16px;font-weight:600;color:var(--cream);background:var(--navy3);border:1px solid rgba(245,238,220,.22);border-radius:8px;padding:11px 8px;cursor:pointer;touch-action:manipulation}
.opt:disabled{cursor:default}
.opt.good{background:rgba(63,174,118,.28);border-color:var(--green)}
.opt.bad{background:rgba(224,88,79,.28);border-color:var(--red)}
.fb{font-size:14px;line-height:1.4;color:var(--cream)}
.fb em{color:var(--muted)}
.fb .ko{color:var(--red);font-weight:600}
.fb .ok{color:var(--green);font-weight:600}
.idle{color:var(--muted);font-size:15px;line-height:1.5;margin:auto 0;text-align:center}
footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7f8bab;letter-spacing:.5px;line-height:1.5}
.screen{position:absolute;inset:0;background:var(--navy);z-index:10;display:none;padding:22px 18px;overflow-y:auto}
.screen.on{display:block}
.screen h1{font-family:'Playfair Display',Georgia,serif;font-size:32px;margin:6px 0 4px;line-height:1.1}
.screen h1 span{color:var(--gold)}
.screen h2{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin:6px 0 6px}
.screen p{color:var(--muted);line-height:1.5;margin:6px 0}
.rules{padding-left:18px;margin:10px 0 14px;line-height:1.55;font-size:15px}
.modes{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.mode{font-family:'Source Serif 4',Georgia,serif;text-align:left;background:var(--navy3);color:var(--cream);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:17px;font-weight:600;touch-action:manipulation}
.mode small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.recap{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.recap div{background:var(--navy2);border-left:3px solid var(--red);border-radius:4px;padding:8px 10px;font-size:14px;line-height:1.4}
.recap em{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font-family:'JetBrains Mono',monospace;color:var(--gold);font-size:15px}
</style>
</head>

/* ---------- GENERATION DES NIVEAUX ---------- */
/* Chaque flèche est posée de sorte que son trajet de sortie soit libre de toutes les flèches déjà posées :
   l'ordre inverse de pose est donc toujours une solution (aucun cycle de blocage possible). */
var LEVELS=[[10,12,16,4],[10,13,22,5],[11,14,30,5],[11,15,38,6],[12,16,42,6],[12,17,48,6]];
var MAXL=5;
function params(l){return LEVELS[Math.min(l,LEVELS.length)-1]}

function genOnce(W,H,target,maxLen){
  var occ={},arrows=[],tries=0;
  while(arrows.length<target&&tries<4000){
    tries++;
    var len=2+rnd(maxLen-1);
    var sc=rnd(W),sr=rnd(H);
    if(occ[key(sc,sr)])continue;
    var path=[[sc,sr]],own={};own[key(sc,sr)]=1;
    var ok=true,last=null;
    for(var i=1;i<len;i++){
      var c=path[path.length-1];
      var cand=shuffle(DIRS).filter(function(d){
        var x=c[0]+d[0],y=c[1]+d[1];
        return x>=0&&y>=0&&x<W&&y<H&&!occ[key(x,y)]&&!own[key(x,y)];
      });
      if(!cand.length){ok=false;break}
      var d=cand[0];last=d;
      path.push([c[0]+d[0],c[1]+d[1]]);own[key(c[0]+d[0],c[1]+d[1])]=1;
    }
    if(!ok||!last)continue;
    var h=path[path.length-1],x=h[0],y=h[1];
    while(true){
      x+=last[0];y+=last[1];
      if(x<0||y<0||x>=W||y>=H)break;
      if(occ[key(x,y)]||own[key(x,y)]){ok=false;break}
    }
    if(!ok)continue;
    var a={id:arrows.length,path:path,dir:last};
    arrows.push(a);
    path.forEach(function(p){occ[key(p[0],p[1])]=a});
  }
  return arrows;
}
function countFree(arrows,W,H){
  var occ={};arrows.forEach(function(a){a.path.forEach(function(p){occ[key(p[0],p[1])]=a})});
  var n=0;
  arrows.forEach(function(a){
    var h=a.path[a.path.length-1],x=h[0],y=h[1],free=true;
    while(true){x+=a.dir[0];y+=a.dir[1];if(x<0||y<0||x>=W||y>=H)break;if(occ[key(x,y)]){free=false;break}}
    if(free)n++;
  });
  return n;
}
function generate(level){
  var p=params(level),W=p[0],H=p[1],target=p[2],maxLen=p[3];
  var best=null;
  for(var k=0;k<120;k++){
    var arrows=genOnce(W,H,target,maxLen);
    var free=countFree(arrows,W,H);
    var score=arrows.length*100-free;
    if(!best||score>best.score)best={arrows:arrows,score:score,free:free};
    if(arrows.length===target&&free<=Math.ceil(target*0.5))break;
  }
  return {W:W,H:H,arrows:best.arrows};
}

/* ---------- ETAT ---------- */
var S={mode:'m',level:1,score:0,lives:3,hints:2,W:0,H:0,arrows:[],occ:{},sel:null,q:null,busy:false,ended:true,deck:[],last:null,missed:[],best:0};
try{S.best=parseInt(localStorage.getItem('arrowToeicBest')||'0',10)||0}catch(e){}

function pool(){return S.mode==='c'?CONN:S.mode==='v'?VERBS:CONN.concat(VERBS)}
function drawQuestion(){
  if(!S.deck.length){
    S.deck=shuffle(pool());
    if(S.last&&S.deck.length>1&&S.deck[S.deck.length-1]===S.last){var t=S.deck.pop();S.deck.unshift(t)}
  }
  var item=S.deck.pop();S.last=item;
  var opts=shuffle(item.o.map(function(t,i){return {t:t,ok:i===0}}));
  return {item:item,opts:opts,answered:false};
}

/* ---------- AFFICHAGE ---------- */
function hud(){
  $('#lvl').textContent=S.level;$('#score').textContent=S.score;
  var h='';for(var i=0;i<MAXL;i++)h+='<span class="'+(i<S.lives?'':'lost')+'">&#9829;&#xFE0E;</span>';
  $('#lives').innerHTML=h;
  $('#hintBtn').textContent='Indice ('+S.hints+')';
  $('#hintBtn').disabled=S.hints<=0||S.ended;
}
function rebuildOcc(){
  S.occ={};
  S.arrows.forEach(function(a){if(!a.removed)a.path.forEach(function(p){S.occ[key(p[0],p[1])]=a})});
}
function blockDist(a){
  var h=a.path[a.n-1],x=h[0],y=h[1],d=0;
  while(true){
    x+=a.dir[0];y+=a.dir[1];
    if(x<0||y<0||x>=S.W||y>=S.H)return Infinity;
    if(S.occ[key(x,y)])return d;
    d++;
  }
}
function pos(P,t){
  var i=Math.floor(t),f=t-i,A=P[i],B=P[Math.min(i+1,P.length-1)];
  return [A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f];
}
function render(a,s){
  var end=s+a.n-1,pts=[pos(a.P,s)];
  for(var i=Math.floor(s)+1;i<end;i++)pts.push(a.P[i]);
  pts.push(pos(a.P,end));
  a.body.setAttribute('points',pts.map(function(p){return p[0].toFixed(3)+','+p[1].toFixed(3)}).join(' '));
  var f=pts[pts.length-1],d=a.dir,pp=[-d[1],d[0]];
  var tip=[f[0]+d[0]*.44,f[1]+d[1]*.44];
  var b1=[f[0]-d[0]*.04+pp[0]*.31,f[1]-d[1]*.04+pp[1]*.31];
  var b2=[f[0]-d[0]*.04-pp[0]*.31,f[1]-d[1]*.04-pp[1]*.31];
  a.head.setAttribute('points',[tip,b1,b2].map(function(p){return p[0].toFixed(3)+','+p[1].toFixed(3)}).join(' '));
}
function build(){
  var svg=$('#svg');svg.innerHTML='';
  svg.setAttribute('viewBox','0 0 '+S.W+' '+S.H);
  for(var r=0;r<S.H;r++)for(var c=0;c<S.W;c++)el('circle',{cx:c+.5,cy:r+.5,r:.06,'class':'dot'},svg);
  S.arrows.forEach(function(a){
    a.n=a.path.length;a.removed=false;a.unlocked=false;
    var h=a.path[a.n-1],d=a.dir;
    a.e=d[0]===1?S.W-1-h[0]:d[0]===-1?h[0]:d[1]===1?S.H-1-h[1]:h[1];
    a.P=a.path.map(function(p){return [p[0]+.5,p[1]+.5]});
    for(var k=1;k<=a.e+a.n+3;k++)a.P.push([h[0]+.5+d[0]*k,h[1]+.5+d[1]*k]);
    a.g=el('g',{'class':'arrow'},svg);
    a.hit=el('polyline',{'class':'hit',points:a.path.map(function(p){return (p[0]+.5)+','+(p[1]+.5)}).join(' ')},a.g);
    a.body=el('polyline',{'class':'body'},a.g);
    a.head=el('polygon',{'class':'head'},a.g);
    render(a,0);
    a.g.addEventListener('click',function(){onTap(a)});
  });
  rebuildOcc();
}
function tween(a,from,to,ms,ease){
  return new Promise(function(res){
    var t0=performance.now();
    function f(now){
      var u=Math.min(1,(now-t0)/ms);
      render(a,from+(to-from)*ease(u));
      if(u<1)requestAnimationFrame(f);else res();
    }
    requestAnimationFrame(f);
  });
}

/* ---------- PANNEAU QUESTION ---------- */
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function sentenceHTML(item,fill,cls){
  var s=esc(item.s);
  if(item.t==='v')s=s.replace(/\(([a-z]+)\)\s*$/,'<span class="verb">($1)</span>');
  return s.replace('___','<span class="gap'+(cls?' '+cls:'')+'" id="gap">'+(fill?esc(fill):'&nbsp;')+'</span>');
}
function idle(msg){
  $('#panel').innerHTML='<div class="idle">'+msg+'</div>';
}
function showQuestion(){
  var q=S.q,h='<div class="tag">'+MODE_LABEL[q.item.t]+'</div><div class="sentence">'+sentenceHTML(q.item)+'</div><div class="opts">';
  q.opts.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+esc(o.t)+'</button>'});
  h+='</div><div class="fb" id="fb"></div>';
  $('#panel').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
    b.addEventListener('click',function(){answer(parseInt(b.getAttribute('data-i'),10))});
  });
}
function fullSentence(item){return esc(item.s.replace('___',item.o[0]).replace(/\s*\([a-z]+\)\s*$/,''))}

/* ---------- JEU ---------- */
function onTap(a){
  if(S.busy||S.ended||a.removed)return;
  clearSel();
  if(a.unlocked){S.sel=a;a.g.classList.add('sel');attempt(a);return}
  S.sel=a;a.g.classList.add('sel');
  S.q=drawQuestion();showQuestion();
}
function clearSel(){
  S.arrows.forEach(function(a){if(a.g)a.g.classList.remove('sel')});
  S.sel=null;
}
function addFb(html){var f=$('#fb');if(f)f.innerHTML+=html}
function answer(i){
  var q=S.q;
  if(!q||q.answered||S.busy||S.ended)return;
  q.answered=true;
  var ok=q.opts[i].ok;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b,k){
    b.disabled=true;
    if(q.opts[k].ok)b.classList.add('good');
    else if(k===i)b.classList.add('bad');
  });
  var gap=$('#gap');gap.textContent=q.item.o[0];gap.classList.add(ok?'ok':'ko');
  var fb=ok?'<span class="ok">Correct.</span> ':'<span class="ko">Faux.</span> ';
  fb+='<em>'+fullSentence(q.item)+'</em><br>'+esc(q.item.fr);
  $('#fb').innerHTML=fb;
  var a=S.sel;
  if(ok){
    S.score+=10;
    if(a){a.unlocked=true;a.g.classList.add('open');hud();attempt(a)}
  }else{
    S.lives--;
    if(S.missed.indexOf(q.item)<0)S.missed.push(q.item);
    clearSel();hud();
    if(S.lives<=0)gameOver();
  }
}
async function attempt(a){
  S.busy=true;
  var d=blockDist(a);
  if(d===Infinity){
    var ms=Math.max(380,(a.e+a.n)*55);
    await tween(a,0,a.e+a.n+1.5,ms,easeIn);
    a.removed=true;a.g.remove();rebuildOcc();
    S.sel=null;S.busy=false;
    if(S.arrows.every(function(x){return x.removed}))levelComplete();
    else if(S.q&&S.q.answered&&S.q.item&&$('#fb')&&S.lives>0){addFb('<br><em>Flèche libérée. Choisissez la suivante.</em>')}
  }else{
    var go=d+.25;
    await tween(a,0,go,120+d*60,easeOut);
    a.g.classList.add('crash');
    await tween(a,go,0,260,easeIO);
    a.g.classList.remove('crash','sel');
    S.lives--;S.sel=null;hud();
    addFb('<br><span class="ko">Collision !</span> Une autre flèche barre le chemin. Dégagez-la d\'abord.');
    S.busy=false;
    if(S.lives<=0)gameOver();
  }
}
function hint(){
  if(S.hints<=0||S.busy||S.ended)return;
  var free=S.arrows.filter(function(a){return !a.removed&&blockDist(a)===Infinity});
  if(!free.length)return;
  var a=free[rnd(free.length)];
  S.hints--;hud();
  a.g.classList.add('hint');
  setTimeout(function(){a.g.classList.remove('hint')},1700);
}

/* ---------- ECRANS ---------- */
function screen(html){var s=$('#screen');s.innerHTML=html;s.classList.add('on');s.scrollTop=0}
function hideScreen(){$('#screen').classList.remove('on')}
function recapHTML(){
  if(!S.missed.length)return '<p>Aucune erreur sur cette partie. Beau travail.</p>';
  var h='<p class="big">À revoir ('+S.missed.length+')</p><div class="recap">';
  S.missed.forEach(function(it){h+='<div>'+fullSentence(it)+'<br><em>'+esc(it.fr)+'</em></div>'});
  return h+'</div>';
}
function startScreen(){
  S.ended=true;hud();
  screen('<h1>ARROW <span>ESCAPE</span></h1><p class="big">TOEIC EDITION</p>'+
    '<ol class="rules"><li>Touchez une flèche : une question TOEIC la verrouille.</li>'+
    '<li>Bonne réponse : la flèche se débloque et glisse dans la direction de sa pointe.</li>'+
    '<li>Si une autre flèche barre le chemin, c\'est la collision et vous perdez une vie. Une mauvaise réponse en coûte une aussi.</li>'+
    '<li>Libérez toutes les flèches pour passer au niveau suivant. Repérez d\'abord celles dont la voie est libre.</li></ol>'+
    '<div class="modes">'+
    '<button class="mode" data-m="c">Connecteurs logiques<small>although, whereas, unless, nevertheless, in case...</small></button>'+
    '<button class="mode" data-m="v">Verbes irréguliers<small>prétérit et participe passé</small></button>'+
    '<button class="mode" data-m="m">Mixte<small>les deux, mélangés</small></button></div>'+
    '<p>Meilleur score : <b class="big">'+S.best+'</b></p>');
  Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){
    b.addEventListener('click',function(){newGame(b.getAttribute('data-m'))});
  });
}
function newGame(mode){
  S.mode=mode;S.level=1;S.score=0;S.deck=[];S.last=null;S.missed=[];
  startLevel();
}
function startLevel(){
  var g=generate(S.level);
  S.W=g.W;S.H=g.H;S.arrows=g.arrows;
  S.lives=MAXL;S.hints=3;S.sel=null;S.q=null;S.busy=false;S.ended=false;
  build();hud();hideScreen();
  idle('Touchez une flèche pour la déverrouiller.<br>Repérez celles dont le chemin est libre.');
}
function saveBest(){
  if(S.score>S.best){S.best=S.score;try{localStorage.setItem('arrowToeicBest',String(S.best))}catch(e){}}
}
function levelComplete(){
  S.ended=true;
  var bonus=S.lives*20;S.score+=bonus;saveBest();hud();
  setTimeout(function(){
    screen('<h2>Niveau '+S.level+' réussi</h2><p>Bonus vies restantes : <b class="big">+'+bonus+'</b><br>Score : <b class="big">'+S.score+'</b> (meilleur : '+S.best+')</p>'+recapHTML()+
      '<div class="row"><button class="btn solid" id="nx">Niveau suivant</button><button class="btn" id="mn">Menu</button></div>');
    $('#nx').addEventListener('click',function(){S.level++;S.missed=[];startLevel()});
    $('#mn').addEventListener('click',startScreen);
  },350);
}
function gameOver(){
  S.ended=true;saveBest();hud();
  setTimeout(function(){
    screen('<h2>Plus de vies</h2><p>Niveau '+S.level+' : score <b class="big">'+S.score+'</b> (meilleur : '+S.best+')</p>'+recapHTML()+
      '<div class="row"><button class="btn solid" id="rt">Rejouer ce niveau</button><button class="btn" id="mn">Menu</button></div>');
    $('#rt').addEventListener('click',function(){S.missed=[];startLevel()});
    $('#mn').addEventListener('click',startScreen);
  },700);
}

$('#hintBtn').addEventListener('click',hint);
$('#menuBtn').addEventListener('click',startScreen);
window.__g={S:S,generate:generate,countFree:countFree,blockDist:blockDist,CONN:CONN,VERBS:VERBS,params:params};
startScreen();
})();
</script>
