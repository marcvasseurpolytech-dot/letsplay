<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Arrow Escape TOEIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3a; --navy2:#16294f; --navy3:#1f3868;
  --gold:#c9a227; --cream:#f5eedc; --red:#e0584f; --green:#3fae76;
  --muted:#a9b3c9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--cream);font-family:'Source Serif 4',Georgia,serif}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:20px;letter-spacing:.5px}
.brand span{color:var(--gold)}
.stats{display:flex;gap:12px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.stats b{color:var(--cream);font-size:14px}
.lives{display:flex;gap:2px;font-size:18px;color:var(--red);letter-spacing:1px}
.lives .lost{color:#3a4668}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:4px}
.btn{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.35;cursor:default}
.btn.solid{background:var(--gold);color:var(--navy)}
.board{position:relative;background:#0a1530;border:1px solid rgba(201,162,39,.45);border-radius:12px;overflow:hidden;display:flex;justify-content:center}
#svg{display:block;width:100%;height:auto;max-height:56vh;touch-action:manipulation}
.arrow{--c:#f5eedc}
.arrow .body{fill:none;stroke:var(--c);stroke-width:.4;stroke-linecap:round;stroke-linejoin:round}
.arrow .halo{fill:none;stroke:#fff;stroke-width:.62;stroke-linecap:round;stroke-linejoin:round;opacity:0;pointer-events:none}
.arrow.open .halo{opacity:.95}
.arrow .head{fill:var(--c);stroke:var(--c);stroke-width:.08;stroke-linejoin:round}
.arrow.open .head{stroke:#fff;stroke-width:.1}
.arrow .hit{fill:none;stroke:transparent;stroke-width:.72;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}
.arrow.sel{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}
.arrow.crash{--c:#e0584f}
.arrow.hint{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{filter:drop-shadow(0 0 7px #7fe3a8)}}
.panel{background:var(--navy2);border:1px solid rgba(245,238,220,.14);border-radius:12px;padding:12px;min-height:215px;display:flex;flex-direction:column;gap:10px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.sentence{font-size:18px;line-height:1.35}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--gold);text-align:center;font-weight:600;color:var(--gold)}
.gap.ok{color:var(--green);border-color:var(--green)}
.gap.ko{color:var(--red);border-color:var(--red)}
.verb{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font-family:'Source Serif 4',Georgia,serif;font-size:16px;font-weight:600;color:var(--cream);background:var(--navy3);border:1px solid rgba(245,238,220,.22);border-radius:8px;padding:11px 8px;cursor:pointer;touch-action:manipulation}
.opt:disabled{cursor:default}
.opt.good{background:rgba(63,174,118,.28);border-color:var(--green)}
.opt.bad{background:rgba(224,88,79,.28);border-color:var(--red)}
.fb{font-size:14px;line-height:1.4;color:var(--cream)}
.fb em{color:var(--muted)}
.fb .ko{color:var(--red);font-weight:600}
.fb .ok{color:var(--green);font-weight:600}
.idle{color:var(--muted);font-size:15px;line-height:1.5;margin:auto 0;text-align:center}
footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7f8bab;letter-spacing:.5px;line-height:1.5}
.screen{position:absolute;inset:0;background:var(--navy);z-index:10;display:none;padding:22px 18px;overflow-y:auto}
.screen.on{display:block}
.screen h1{font-family:'Playfair Display',Georgia,serif;font-size:32px;margin:6px 0 4px;line-height:1.1}
.screen h1 span{color:var(--gold)}
.screen h2{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin:6px 0 6px}
.screen p{color:var(--muted);line-height:1.5;margin:6px 0}
.rules{padding-left:18px;margin:10px 0 14px;line-height:1.55;font-size:15px}
.modes{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.mode{font-family:'Source Serif 4',Georgia,serif;text-align:left;background:var(--navy3);color:var(--cream);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:17px;font-weight:600;touch-action:manipulation}
.mode small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.recap{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.recap div{background:var(--navy2);border-left:3px solid var(--red);border-radius:4px;padding:8px 10px;font-size:14px;line-height:1.4}
.recap em{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font-family:'JetBrains Mono',monospace;color:var(--gold);font-size:15px}
.credit{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7f8bab;letter-spacing:.5px;margin-top:6px}
.banner{display:block;width:100%;max-width:340px;margin:8px auto;background:#0a1530;border:1px solid #c9a22755;border-radius:12px;padding:6px}
.bonus .btn{display:flex;flex-direction:column;align-items:stretch;text-align:center;gap:2px;padding:6px 12px}
.bonus .btn em{font-style:normal;font-size:10px;opacity:.85;letter-spacing:.3px}
.bonus .btn .prog{display:block;height:4px;border-radius:3px;background:#ffffff22;overflow:hidden}
.bonus .btn .prog b{display:block;height:100%;background:currentColor;transition:width .4s}

.bonus{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bonus small{color:var(--muted);font-size:11px;flex:1;min-width:150px;line-height:1.35}
.btn.boom{color:#ff8a65;border-color:#ff8a65}
.btn.boom:not(:disabled){animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 10px #ff8a65}}
.slots{display:flex;gap:5px;flex-wrap:wrap;min-height:38px}
.slot{width:26px;height:36px;border-bottom:2px solid var(--gold);text-align:center;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--cream);text-transform:uppercase;line-height:34px}
.slot.ok{color:var(--green);border-color:var(--green)}
.slot.ko{color:var(--red);border-color:var(--red)}
.tiles{display:flex;gap:6px;flex-wrap:wrap}
.tile{width:38px;height:42px;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;text-transform:uppercase;background:var(--navy3);color:var(--cream);border:1px solid rgba(245,238,220,.3);border-radius:7px;cursor:pointer;touch-action:manipulation}
.tile:disabled{opacity:.22;cursor:default}
.row2{display:flex;gap:8px}
.arrow.pick{filter:drop-shadow(0 0 6px #ff8a65)}
.arrow.pick{--c:#ff8a65}
.boomtxt{color:#ff8a65;font-family:'Playfair Display',Georgia,serif;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{font-family:'Source Serif 4',Georgia,serif;font-size:15px;font-weight:600;color:var(--muted);background:transparent;border:1px solid rgba(245,238,220,.3);border-radius:20px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.profile{background:var(--navy2);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:12px;margin:10px 0 6px;display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px;margin:0}
.tabs{display:flex;gap:6px}
.tab{flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);background:transparent;border:1px solid rgba(245,238,220,.25);border-radius:6px;padding:8px;cursor:pointer;touch-action:manipulation}
.tab.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.fld{width:100%;font-family:'Source Serif 4',Georgia,serif;font-size:16px;color:var(--cream);background:var(--navy);border:1px solid rgba(245,238,220,.3);border-radius:8px;padding:10px}
.fld::placeholder{color:#6f7b99}
select.fld{appearance:auto}
.msg{color:var(--red);min-height:18px;margin:0;font-size:14px}
.statsline{font-size:13px;color:var(--muted);line-height:1.5}
.statsline b{color:var(--cream)}
.rulebox{margin:8px 0}
.rulebox summary{cursor:pointer;margin:6px 0}
.saveinfo{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7f8bab;min-height:12px}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">ARROW ESCAPE <span>TOEIC</span></div>
    <div class="stats">
      <div>Lvl <b id="lvl">1</b></div>
      <div>Score <b id="score">0</b></div>
      <div class="lives" id="lives"></div>
    </div>
  </header>
  <div class="toolbar">
    <div class="legend"><span><i style="background:linear-gradient(90deg,#4cc36e,#4a7be8,#e65aa8)"></i>locked</span><span><i style="background:#fff"></i>unlocked (white outline)</span></div>
    <div style="display:flex;gap:6px"><button class="btn" id="hintBtn">Hint (3)</button><button class="btn" id="menuBtn">Menu</button></div>
  </div>
  <div class="bonus"><button class="btn" id="lifeBtn" disabled>+1 life (0)</button><button class="btn boom" id="boomBtn" disabled>BOOM (0)</button><small id="bonusInfo"></small></div>
  <div class="board" id="board"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <section class="panel" id="panel"></section>
  <div id="saveInfo" class="saveinfo"></div>
  <footer>A game by Marc VASSEUR / Polytech Lille<br>marc.vasseur@polytech-lille.fr</footer>
  <div class="screen on" id="screen"></div>
</div>

<script>
(function(){
'use strict';

/* ---------- DONNEES ---------- */
var CONN = [
 {s:"___ the heavy rain, the outdoor event went ahead as planned.", o:["Despite","Although","Because","Therefore"], fr:"Malgré la forte pluie, l'événement en plein air a eu lieu comme prévu."},
 {s:"The shipment was delayed; ___, we had to reschedule the installation.", o:["Therefore","However","Whereas","Unless"], fr:"La livraison a été retardée ; nous avons donc dû reprogrammer l'installation."},
 {s:"___ the new software is expensive, it will save us time in the long run.", o:["Although","Despite","Because of","Moreover"], fr:"Bien que le nouveau logiciel soit cher, il nous fera gagner du temps à long terme."},
 {s:"We will not start the project ___ we receive written approval.", o:["unless","although","whereas","otherwise"], fr:"Nous ne commencerons pas le projet à moins de recevoir une approbation écrite."},
 {s:"Sales increased in Asia, ___ they fell in Europe.", o:["whereas","because","so that","provided"], fr:"Les ventes ont augmenté en Asie, alors qu'elles ont baissé en Europe."},
 {s:"Employees must wear helmets on site; ___, they may be refused access.", o:["otherwise","for instance","meanwhile","afterwards"], fr:"Les employés doivent porter un casque sur le chantier ; sinon, l'accès peut leur être refusé."},
 {s:"___ you submit the form before noon, your request will be processed today.", o:["Provided that","Despite","Owing to","Instead of"], fr:"À condition de remettre le formulaire avant midi, votre demande sera traitée aujourd'hui."},

 {s:"The meeting was long. ___, it was very productive.", o:["Nevertheless","Therefore","Because","Unless"], fr:"La réunion a été longue. Néanmoins, elle a été très productive."},

 {s:"We offer free delivery. ___, customers can return any item within 30 days.", o:["In addition","Otherwise","Unless","Whereas"], fr:"Nous offrons la livraison gratuite. De plus, les clients peuvent retourner tout article sous 30 jours."},
 {s:"The server crashed ___ we were saving the file.", o:["while","during","despite","therefore"], fr:"Le serveur a planté pendant que nous enregistrions le fichier."},

 {s:"___ the budget is limited, we must choose our suppliers carefully.", o:["Given that","Despite","Instead of","In addition to"], fr:"Étant donné que le budget est limité, nous devons choisir nos fournisseurs avec soin."},
 {s:"He is highly qualified; ___, he has ten years of experience.", o:["moreover","otherwise","whereas","unless"], fr:"Il est très qualifié ; de plus, il a dix ans d'expérience."},
 {s:"The software is easy to use, ___ it is not cheap.", o:["yet","so","because","therefore"], fr:"Le logiciel est facile à utiliser, mais il n'est pas bon marché."},

 {s:"Both the sales team ___ the marketing team will attend the training.", o:["and","or","nor","but"], fr:"L'équipe commerciale et l'équipe marketing assisteront toutes deux à la formation."},
 {s:"She did not answer the email, ___ did she call us back.", o:["nor","or","and","yet"], fr:"Elle n'a pas répondu à l'e-mail et ne nous a pas rappelés non plus."},

 {s:"The company is expanding abroad; ___, it is hiring more staff at home.", o:["at the same time","in case","unless","even if"], fr:"L'entreprise se développe à l'étranger ; en même temps, elle recrute davantage de personnel dans le pays."},

];
/* La bonne réponse est toujours o[0] ; l'ordre est mélangé à l'affichage. */

 {s:"Our company ___ a new factory in Lille in 2019. (build)", o:["built","builded","builten","building"], fr:"Notre entreprise a construit une nouvelle usine à Lille en 2019."},
 {s:"The manager has ___ all the safety instructions. (forget)", o:["forgotten","forgot","forgetted","forgoten"], fr:"Le responsable a oublié toutes les consignes de sécurité."},

/* ---------- GENERATION DES NIVEAUX ---------- */
/* Chaque flèche est posée de sorte que son trajet de sortie soit libre de toutes les flèches déjà posées :
   l'ordre inverse de pose est donc toujours une solution (aucun cycle de blocage possible). */
/* Grille entièrement remplie (aucune case vide), serpents longs et sinueux.
   Construction de l'extérieur vers l'intérieur : chaque nouvelle flèche a une tête dont la ligne de sortie ne
   traverse que des cases déjà couvertes par des flèches posées avant elle (donc sorties avant elle).
   L'ordre de pose est donc toujours une solution : aucun cycle de blocage n'est possible. */
var LEVELS=[[14,20,6,16],[15,22,6,18],[16,24,6,20],[17,25,6,22],[17,27,6,24],[18,28,6,26]];
var MAXL=5;
var PALETTE=['#4cc36e','#4a7be8','#9a6df0','#e65aa8','#f2c230','#f0675a','#2fc4d8'];
function params(l){return LEVELS[Math.min(l,LEVELS.length)-1]}

function genFull(W,H,minL,maxL){
  var cov=[],r,c;
  for(r=0;r<H;r++){cov.push([]);for(c=0;c<W;c++)cov[r].push(-1)}
  var free=W*H,arrows=[];
  function isFree(x,y){return x>=0&&y>=0&&x<W&&y<H&&cov[y][x]<0}
  function rayClear(x,y,d){x+=d[0];y+=d[1];while(x>=0&&y>=0&&x<W&&y<H){if(cov[y][x]<0)return false;x+=d[0];y+=d[1]}return true}
  function freeDeg(x,y){var n=0;for(var k=0;k<4;k++)if(isFree(x+DIRS[k][0],y+DIRS[k][1]))n++;return n}
  /* cases libres voisines de (x,y) devenues sans aucune voisine libre : elles ne pourraient plus appartenir qu'à une flèche d'une case */
  function isolated(x,y){
    var out=[];
    for(var k=0;k<4;k++){var nx=x+DIRS[k][0],ny=y+DIRS[k][1];if(isFree(nx,ny)&&freeDeg(nx,ny)===0)out.push([nx,ny])}
    return out;
  }
  function mark(x,y,id){cov[y][x]=id}
  while(free>0){
    var cands=[],singles=[],k;
    for(r=0;r<H;r++)for(c=0;c<W;c++){
      if(cov[r][c]>=0)continue;
      for(k=0;k<4;k++){
        var d=DIRS[k];
        if(!rayClear(c,r,d))continue;
        if(isFree(c-d[0],r-d[1]))cands.push([c,r,d]);else singles.push([c,r,d]);
      }
    }
    var id=arrows.length,pick=null;
    if(cands.length){
      var okc=cands.filter(function(t){
        mark(t[0],t[1],id);mark(t[0]-t[2][0],t[1]-t[2][1],id);
        var bad=isolated(t[0],t[1]).length>0;
        cov[t[1]][t[0]]=-1;cov[t[1]-t[2][1]][t[0]-t[2][0]]=-1;
        return !bad;
      });
      pick=(okc.length?okc:cands)[rnd((okc.length?okc:cands).length)];
    }else pick=singles[rnd(singles.length)];
    var hc=pick[0],hr=pick[1],dd=pick[2];
    var list=[[hc,hr]];mark(hc,hr,id);free--;
    if(cands.length){
      list.push([hc-dd[0],hr-dd[1]]);mark(hc-dd[0],hr-dd[1],id);free--;
      var len=minL+rnd(maxL-minL+1);
      while(true){
        var cur=list[list.length-1],iso=isolated(cur[0],cur[1]);
        if(iso.length===1){list.push(iso[0]);mark(iso[0][0],iso[0][1],id);free--;break}
        if(iso.length>1||list.length>=len)break;
        var opts=[];
        for(k=0;k<4;k++){var nx=cur[0]+DIRS[k][0],ny=cur[1]+DIRS[k][1];
          if(!isFree(nx,ny))continue;
          mark(nx,ny,id);var ni=isolated(nx,ny).length;cov[ny][nx]=-1;
          opts.push([nx,ny,freeDeg(nx,ny),ni]);
        }
        if(!opts.length)break;
        var safe=opts.filter(function(o){return o[3]<=1});
        if(!safe.length){if(list.length>=2)break;safe=opts}
        var good=safe.filter(function(o){return o[2]>0||o[3]>0});
        var pool=(list.length<minL&&good.length)?good:safe;
        var ch;
        if(Math.random()<.65){var mn=Math.min.apply(null,pool.map(function(o){return o[2]}));var best=pool.filter(function(o){return o[2]===mn});ch=best[rnd(best.length)]}
        else ch=pool[rnd(pool.length)];
        list.push([ch[0],ch[1]]);mark(ch[0],ch[1],id);free--;
      }
    }
    arrows.push({id:id,path:list.slice().reverse(),dir:dd});
  }
  return arrows;
}
function countFree(arrows,W,H){
  var occ={};arrows.forEach(function(a){a.path.forEach(function(p){occ[key(p[0],p[1])]=a})});
  var n=0;
  arrows.forEach(function(a){
    var h=a.path[a.path.length-1],x=h[0],y=h[1],free=true;
    while(true){x+=a.dir[0];y+=a.dir[1];if(x<0||y<0||x>=W||y>=H)break;if(occ[key(x,y)]){free=false;break}}
    if(free)n++;
  });
  return n;
}
function generate(level){
  var p=params(level),W=p[0],H=p[1],best=null;
  var want=(p[2]+p[3])/2;
  for(var k=0;k<30;k++){
    var arrows=genFull(W,H,p[2],p[3]);
    var singles=arrows.filter(function(a){return a.path.length===1}).length;
    var free=countFree(arrows,W,H);
    var avg=(W*H)/arrows.length;
    var score=-singles*1000+avg*10-Math.max(0,free-Math.ceil(arrows.length*.5))*3;
    if(!best||score>best.score)best={arrows:arrows,score:score};
    if(singles===0&&avg>=want*.95&&free<=Math.ceil(arrows.length*.5))break;
  }
  return {W:W,H:H,arrows:best.arrows};
}

  if(!S[k].length){var f=src.filter(function(q){return S.cats[q.t]});if(!f.length)f=src;S[k]=shuffle(f)}

function scramble(word){
  var letters=word.split(''),out=letters,tries=0;
  do{out=shuffle(letters);tries++}while(out.join('')===word&&tries<30);
  return out.map(function(ch,i){return {ch:ch,id:i}});
}
function makeQ(item){
  if(item.t==='w')return {item:item,type:'w',tiles:scramble(item.w),built:[],answered:false};
  var opts=shuffle(item.o.map(function(t,i){return {t:t,ok:i===0}}));
  return {item:item,type:'mc',opts:opts,answered:false};
}

function rebuildOcc(){
  S.occ={};
  S.arrows.forEach(function(a){if(!a.removed)a.path.forEach(function(p){S.occ[key(p[0],p[1])]=a})});
}
function blockDist(a){
  var h=a.path[a.n-1],x=h[0],y=h[1],d=0;
  while(true){
    x+=a.dir[0];y+=a.dir[1];
    if(x<0||y<0||x>=S.W||y>=S.H)return Infinity;
    if(S.occ[key(x,y)])return d;
    d++;
  }
}
function pos(P,t){
  var i=Math.floor(t),f=t-i,A=P[i],B=P[Math.min(i+1,P.length-1)];
  return [A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f];
}
function render(a,s){
  var end=s+a.n-1,bend=a.n>1?end-.25:end,pts=[pos(a.P,s)];
  for(var i=Math.floor(s)+1;i<bend;i++)pts.push(a.P[i]);
  pts.push(pos(a.P,bend));
  var ps=pts.map(function(p){return p[0].toFixed(3)+','+p[1].toFixed(3)}).join(' ');
  a.body.setAttribute('points',ps);a.halo.setAttribute('points',ps);
  var f=pos(a.P,end),d=a.dir,pp=[-d[1],d[0]];
  var tip=[f[0]+d[0]*.46,f[1]+d[1]*.46];
  var b1=[f[0]-d[0]*.18+pp[0]*.36,f[1]-d[1]*.18+pp[1]*.36];
  var b2=[f[0]-d[0]*.18-pp[0]*.36,f[1]-d[1]*.18-pp[1]*.36];
  a.head.setAttribute('points',[tip,b1,b2].map(function(p){return p[0].toFixed(3)+','+p[1].toFixed(3)}).join(' '));
}
function assignColors(){
  var at={};
  S.arrows.forEach(function(a){a.path.forEach(function(p){at[key(p[0],p[1])]=a})});
  S.arrows.forEach(function(a,i){
    var used={};
    a.path.forEach(function(p){
      DIRS.forEach(function(d){var o=at[key(p[0]+d[0],p[1]+d[1])];if(o&&o!==a&&o.color!==undefined)used[o.color]=1});
    });
    var c=i%PALETTE.length,t=0;
    while(used[c]&&t<PALETTE.length){c=(c+1)%PALETTE.length;t++}
    a.color=c;
  });
}
function build(){
  var svg=$('#svg');svg.innerHTML='';
  svg.setAttribute('viewBox','0 0 '+S.W+' '+S.H);
  S.arrows.forEach(function(a){a.color=undefined});
  assignColors();
  S.arrows.forEach(function(a){
    a.n=a.path.length;a.removed=false;a.unlocked=false;
    var h=a.path[a.n-1],d=a.dir;
    a.e=d[0]===1?S.W-1-h[0]:d[0]===-1?h[0]:d[1]===1?S.H-1-h[1]:h[1];
    a.P=a.path.map(function(p){return [p[0]+.5,p[1]+.5]});
    for(var k=1;k<=a.e+a.n+3;k++)a.P.push([h[0]+.5+d[0]*k,h[1]+.5+d[1]*k]);
    a.g=el('g',{'class':'arrow'},svg);
    a.g.style.setProperty('--c',PALETTE[a.color]);
    var hp=a.path.map(function(p){return (p[0]+.5)+','+(p[1]+.5)});
    if(a.n===1)hp.push(hp[0]);
    a.halo=el('polyline',{'class':'halo'},a.g);
    a.hit=el('polyline',{'class':'hit',points:hp.join(' ')},a.g);
    a.body=el('polyline',{'class':'body'},a.g);
    a.head=el('polygon',{'class':'head'},a.g);
    render(a,0);
    a.g.addEventListener('click',function(){onTap(a)});
  });
  rebuildOcc();
}
function tween(a,from,to,ms,ease){
  return new Promise(function(res){
    var t0=performance.now();
    function f(now){
      var u=Math.min(1,(now-t0)/ms);
      render(a,from+(to-from)*ease(u));
      if(u<1)requestAnimationFrame(f);else res();
    }
    requestAnimationFrame(f);
  });
}

  if(q.type==='mc'){
    Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(){answerMC(parseInt(b.getAttribute('data-i'),10))});
    });
  }else{
    drawWord();
    $('#undo').addEventListener('click',function(){if(!q.answered){q.built.pop();drawWord()}});
    $('#check').addEventListener('click',checkWord);
  }
  var cb=$('#cancelB');
  if(cb)cb.addEventListener('click',function(){S.q=null;S.ctx=null;idle('Tap an arrow to unlock it.<br>Look for arrows with a clear path.');hud()});
}
function drawWord(){
  var q=S.q,n=q.item.w.length,sl='',tl='';
  for(var i=0;i<n;i++)sl+='<span class="slot">'+(q.built[i]!==undefined?esc(q.tiles[q.built[i]].ch):'')+'</span>';
  $('#slots').innerHTML=sl;
  q.tiles.forEach(function(t,i){
    tl+='<button class="tile" data-i="'+i+'"'+(q.built.indexOf(i)>=0||q.answered?' disabled':'')+'>'+esc(t.ch)+'</button>';
  });
  $('#tiles').innerHTML=tl;
  Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(b){
    b.addEventListener('click',function(){
      if(q.answered||q.built.length>=n)return;
      q.built.push(parseInt(b.getAttribute('data-i'),10));drawWord();
    });
  });
  $('#check').disabled=q.answered||q.built.length!==n;
  $('#undo').disabled=q.answered||!q.built.length;
}
function fullSentence(item){
  if(item.t==='w')return '<b>'+esc(item.w)+'</b> : '+esc(item.fr);
  if(item.s.indexOf('___')<0)return esc(item.s.replace(/\*/g,''))+' <b>'+esc(item.o[0])+'</b>';
  return esc(item.s.replace('___',item.o[0]).replace(/\s*\([a-z]+\)\s*$/,'').replace(/\*/g,''));
}

/* ---------- JEU ---------- */
function onTap(a){
  if(S.busy||S.ended||a.removed)return;
  if(S.pickMode){togglePick(a);return}
  if(S.ctx&&S.ctx.kind!=='arrow'&&S.q&&!S.q.answered){
    var fb=$('#fb');
    if(fb&&fb.getAttribute('data-warn')!=='1'){fb.setAttribute('data-warn','1');fb.innerHTML+='<br><span class="ko">Answer this bonus question first (or tap Cancel), then pick your arrows.</span>'}
    return;
  }
  clearSel();
  S.sel=a;a.g.classList.add('sel');
  if(a.unlocked){S.ctx={kind:'arrow',arrow:a};attempt(a);return}
  S.ctx={kind:'arrow',arrow:a};
  /* Une flèche = une question : elle garde la même question tant qu'on n'y a pas répondu. */
  if(!a.q)a.q=makeQ(drawItem(false));
  S.q=a.q;showQuestion();
}
function clearSel(){
  S.arrows.forEach(function(a){if(a.g)a.g.classList.remove('sel')});
  S.sel=null;
}
function addFb(html){var f=$('#fb');if(f)f.innerHTML+=html}
function answerMC(i){
  var q=S.q;
  if(!q||q.answered||S.busy||S.ended)return;
  q.answered=true;
  var ok=q.opts[i].ok;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b,k){
    b.disabled=true;
    if(q.opts[k].ok)b.classList.add('good');
    else if(k===i)b.classList.add('bad');
  });
  var gap=$('#gap');if(gap){gap.textContent=q.item.o[0];gap.classList.add(ok?'ok':'ko')}
  $('#fb').innerHTML=(ok?'<span class="ok">Correct.</span> ':'<span class="ko">Wrong.</span> ')+
    '<em>'+fullSentence(q.item)+'</em>'+(q.item.t==='t'?'':'<br>'+esc(q.item.fr));
  settle(ok);
}
function checkWord(){
  var q=S.q;
  if(!q||q.answered||S.busy||S.ended||q.built.length!==q.item.w.length)return;
  q.answered=true;
  var got=q.built.map(function(i){return q.tiles[i].ch}).join('');
  var ok=got===q.item.w;
  drawWord();
  Array.prototype.forEach.call(document.querySelectorAll('.slot'),function(s){s.classList.add(ok?'ok':'ko')});
  $('#fb').innerHTML=(ok?'<span class="ok">Correct.</span> ':'<span class="ko">Wrong.</span> The word is ')+fullSentence(q.item);
  settle(ok);
}
function settle(ok){
  var ctx=S.ctx,q=S.q;
  if(!ok&&S.missed.indexOf(q.item)<0)S.missed.push(q.item);
  var ct=q.item.t,cs=S.stats.byCat[ct]||(S.stats.byCat[ct]={n:0,ok:0});cs.n++;if(ok)cs.ok++;S.stats.answered++;if(ok)S.stats.correct++;
  if(ctx.kind==='arrow'){
    var a=ctx.arrow,msgs=[];
    S.qCount++;if(ok)S.okCount++;
    if(S.qCount%20===0){S.lifeBonus++;msgs.push('Bonus earned: a +1 life question!')}
    if(ok&&S.okCount%10===0){S.boom++;msgs.push('Bonus earned: a BOOM!')}
    msgs.forEach(function(m){addFb('<br><span class="ok">'+m+'</span>')});
    if(ok){
      S.score+=10;
      a.unlocked=true;a.g.classList.add('open');hud();attempt(a);
    }else{
      a.q=null;
      S.lives--;clearSel();hud();
      if(S.lives<=0)gameOver();
    }
  }else if(ctx.kind==='life'){
    S.lifeBonus--;
    if(ok){S.lives=Math.min(MAXL,S.lives+1);addFb('<br><span class="ok">+1 life!</span>')}
    else addFb('<br><span class="ko">Bonus lost.</span>');
    hud();
  }else{
    S.boom--;hud();
    if(ok){startPick(true)}
    else addFb('<br><span class="ko">Bonus lost.</span>');
  }
  scheduleSave();
}
async function attempt0(a){
  S.busy=true;hud();
  var d=blockDist(a);
  if(d===Infinity){
    var ms=Math.max(380,(a.e+a.n)*55);
    await tween(a,0,a.e+a.n+1.5,ms,easeIn);
    a.removed=true;a.g.remove();rebuildOcc();
    S.sel=null;S.busy=false;hud();
    if(remaining()===0)levelComplete();
    else addFb('<br><em>Arrow cleared. Pick the next one.</em>');
  }else{
    var go=d+.25;
    await tween(a,0,go,120+d*60,easeOut);
    a.g.classList.add('crash');
    await tween(a,go,0,260,easeIO);
    a.g.classList.remove('crash','sel');
    S.lives--;S.sel=null;S.busy=false;hud();
    addFb('<br><span class="ko">Crash!</span> Another arrow is in the way. Clear it first.');
    if(S.lives<=0)gameOver();
  }
}
async function attempt(a){await attempt0(a);scheduleSave()}
function hint(){
  if(S.hints<=0||S.busy||S.ended||S.pickMode)return;
  var free=S.arrows.filter(function(a){return !a.removed&&blockDist(a)===Infinity});
  if(!free.length)return;
  var a=free[rnd(free.length)];
  S.hints--;hud();scheduleSave();
  a.g.classList.add('hint');
  setTimeout(function(){a.g.classList.remove('hint')},1700);
}

/* ---------- BONUS : +1 VIE ET BOOM ---------- */
function startBonus(kind){
  if(S.busy||S.ended||S.pickMode)return;
  if(kind==='life'&&(S.lifeBonus<=0||S.lives>=MAXL))return;
  if(kind==='boom'&&(S.boom<=0||remaining()===0))return;
  clearSel();
  S.ctx={kind:kind};
  S.q=makeQ(drawItem(kind==='boom'));
  showQuestion();hud();
}
function boomNow(){
  if(S.busy||S.ended||S.pickMode||S.boom<=0||remaining()===0)return;
  clearSel();S.q=null;S.ctx=null;
  var live=S.arrows.filter(function(a){return !a.removed}),score=new Map();
  live.forEach(function(a){score.set(a,Math.random()*.5)});
  live.forEach(function(a){
    var h=a.path[a.n-1],x=h[0],y=h[1];
    while(true){x+=a.dir[0];y+=a.dir[1];
      if(x<0||y<0||x>=S.W||y>=S.H)break;
      var o=S.occ[key(x,y)];
      if(o){if(o!==a)score.set(o,score.get(o)+1);break}
    }
  });
  var list=live.sort(function(a,b){return score.get(b)-score.get(a)}).slice(0,Math.min(3,live.length));
  S.boom--;hud();explode(list);
}
function pickText(first){
  return (first?'<span class="ok">Correct!</span><br>':'')+'<b class="boomtxt">BOOM!</b><br>Tap '+S.need+' arrows to blow up ('+S.pick.length+'/'+S.need+').<br><em>Blocked arrows can be chosen too.</em>';
}
function startPick(first){
  if(S.ended)return;
  S.pickMode=true;S.pick=[];S.need=Math.min(3,remaining());
  clearSel();idle(pickText(first));hud();
}
function togglePick(a){
  var i=S.pick.indexOf(a);
  if(i>=0){S.pick.splice(i,1);a.g.classList.remove('pick')}
  else if(S.pick.length<S.need){S.pick.push(a);a.g.classList.add('pick')}
  idle(pickText());
  if(S.pick.length===S.need)explode(S.pick.slice());
}
function boomFx(a){
  return new Promise(function(res){
    var svg=$('#svg'),cx=0,cy=0;
    a.path.forEach(function(p){cx+=p[0]+.5;cy+=p[1]+.5});cx/=a.path.length;cy/=a.path.length;
    var g=el('g',{},svg),ps=[],cols=[PALETTE[a.color],'#ffffff','#ff8a65',PALETTE[(a.color+2)%PALETTE.length]];
    for(var i=0;i<14;i++){
      var ang=Math.PI*2*i/14+Math.random()*.4;
      ps.push({c:el('circle',{cx:cx,cy:cy,r:.07+Math.random()*.06,fill:cols[i%4]},g),ang:ang,v:.9+Math.random()*.9});
    }
    var t0=performance.now(),ms=620;
    function f(now){
      var u=Math.min(1,(now-t0)/ms),s=1+u*1.1;
      a.g.setAttribute('transform','translate('+cx+' '+cy+') scale('+s+') translate('+(-cx)+' '+(-cy)+')');
      a.g.style.opacity=String(Math.max(0,1-u*1.4));
      ps.forEach(function(p){
        var r=p.v*easeOut(u);
        p.c.setAttribute('cx',cx+Math.cos(p.ang)*r);p.c.setAttribute('cy',cy+Math.sin(p.ang)*r);
        p.c.setAttribute('opacity',String(1-u));
      });
      if(u<1)requestAnimationFrame(f);else{g.remove();res()}
    }
    requestAnimationFrame(f);
  });
}
async function explode(list){await explode0(list);scheduleSave()}
async function explode0(list){
  S.busy=true;S.pickMode=false;hud();
  await Promise.all(list.map(boomFx));
  list.forEach(function(a){a.removed=true;a.g.remove()});
  rebuildOcc();S.score+=10*list.length;S.pick=[];S.busy=false;S.q=null;S.ctx=null;hud();
  if(remaining()===0)levelComplete();
  else idle('<b class="boomtxt">BOOM!</b> '+list.length+' arrows destroyed.<br>Pick the next arrow.');
}

/* ---------- PROFIL ET SAUVEGARDE ---------- */
var P={user:null,token:null,progress:null,timer:null,dirty:false,flight:false,guest:false,mode:'login',msg:'',confirmNew:false};
function emptyStats(){return {byCat:{},answered:0,correct:0,levelsCleared:0,maxLevel:1}}
function normStats(s){
  var o=emptyStats();if(!s||typeof s!=='object')return o;
  o.answered=s.answered|0;o.correct=s.correct|0;o.levelsCleared=s.levelsCleared|0;o.maxLevel=Math.max(1,s.maxLevel|0);
  CATS.forEach(function(c){var x=s.byCat&&s.byCat[c[0]];if(x)o.byCat[c[0]]={n:x.n|0,ok:x.ok|0}});
  return o;
}
S.stats=emptyStats();S.active=false;S.levelDone=true;S.nextLevel=0;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function progKey(){return 'letsplayProg:'+(P.user?P.user.key:'guest')}
function readLocal(){var j=lsGet(progKey());if(!j)return null;try{return JSON.parse(j)}catch(e){return null}}
function newer(a,b){if(!a)return b||null;if(!b)return a;return (a.savedAt||0)>=(b.savedAt||0)?a:b}
function saveSession(){if(P.user&&P.token)lsSet('letsplaySession',JSON.stringify({user:P.user,token:P.token}));else lsDel('letsplaySession')}
function setStatus(t){var e=$('#saveInfo');if(e)e.textContent=t}
function post(action,body){
  var h={'Content-Type':'application/json'};if(P.token)h.Authorization='Bearer '+P.token;
  return fetch('/api/player',{method:'POST',headers:h,keepalive:true,body:JSON.stringify(Object.assign({action:action},body||{}))})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {ok:r.ok,status:r.status,j:j}})})
    .catch(function(){return {ok:false,status:0,j:{error:'No connection to the server.'}}});
}
function snapshot(){
  var board=null;
  if(!S.levelDone&&S.arrows.length&&remaining()>0){
    board={W:S.W,H:S.H,arrows:S.arrows.map(function(a){return {path:a.path,dir:a.dir,removed:!!a.removed,unlocked:!!a.unlocked}})};
  }
  return {level:S.levelDone?(S.nextLevel||S.level):S.level,score:S.score,best:S.best,lives:S.lives,hints:S.hints,
    cats:S.cats,qCount:S.qCount,okCount:S.okCount,lifeBonus:S.lifeBonus,boom:S.boom,stats:S.stats,board:board,savedAt:Date.now()};
}
function scheduleSave(){
  if(!S.active)return;
  var s=snapshot();P.progress=s;lsSet(progKey(),JSON.stringify(s));
  if(!P.user){setStatus('Guest mode: progress is kept on this device only.');return}
  P.dirty=true;setStatus('Progress will be saved online in a moment.');
  clearTimeout(P.timer);P.timer=setTimeout(flush,12000);
}
function flush(){
  clearTimeout(P.timer);
  if(!P.user||!P.token||!P.dirty)return;
  if(P.flight){P.timer=setTimeout(flush,3000);return}
  P.dirty=false;P.flight=true;setStatus('Saving...');
  post('save',{progress:P.progress}).then(function(r){
    P.flight=false;
    if(r.status===401){P.token=null;saveSession();setStatus('Session expired. Log in again to keep saving online.');return}
    if(!r.ok){P.dirty=true;setStatus('Could not save online. Kept on this device, retrying.');P.timer=setTimeout(flush,30000);return}
    setStatus('Progress saved online.');
  });
}
function adopt(pr){
  P.progress=pr||null;
  S.stats=normStats(pr&&pr.stats);
  if(pr&&pr.cats){var any=false;CATS.forEach(function(c){if(pr.cats[c[0]])any=true});
    if(any){S.cats={};CATS.forEach(function(c){S.cats[c[0]]=!!pr.cats[c[0]]})}}
  if(pr&&pr.best>S.best)S.best=pr.best;
}
function onAuth(j){
  P.user=j.user;P.token=j.token;P.guest=false;P.msg='';saveSession();S.active=false;
  if(j.best>S.best)S.best=j.best;
  var local=readLocal(),pr=newer(j.progress,local);
  adopt(pr);
  if(pr&&pr===local&&pr!==j.progress){P.dirty=true;flush()}
}
function logout(){
  flush();P.user=null;P.token=null;saveSession();S.active=false;S.stats=emptyStats();
  P.progress=readLocal();if(P.progress)S.stats=normStats(P.progress.stats);
  P.mode='login';P.msg='';startScreen();
}
function boot(){
  var j=lsGet('letsplaySession');
  if(j){try{var o=JSON.parse(j);if(o&&o.token&&o.user){P.user=o.user;P.token=o.token}}catch(e){}}
  adopt(readLocal());
  if(P.user){
    post('load').then(function(r){
      if(r.status===401){P.user=null;P.token=null;saveSession();P.msg='Your session expired. Please log in again.';adopt(readLocal());if(!S.active)startScreen();return}
      if(r.ok){
        if(r.j.best>S.best)S.best=r.j.best;
        var pr=newer(r.j.progress,readLocal());
        if(!S.active){adopt(pr);startScreen()}
      }
    });
  }
}
function statsHTML(){
  var st=S.stats;if(!st.answered)return '';
  var pct=Math.round(100*st.correct/st.answered);
  var weak=CATS.map(function(c){var x=st.byCat[c[0]]||{n:0,ok:0};return {l:c[1],n:x.n,p:x.n?Math.round(100*x.ok/x.n):100}})
    .filter(function(x){return x.n>=5&&x.p<80}).sort(function(a,b){return a.p-b.p}).slice(0,3);
  var h='<div class="statsline">Answered <b>'+st.answered+'</b> | Correct <b>'+pct+'%</b> | Levels cleared <b>'+st.levelsCleared+'</b></div>';
  if(weak.length)h+='<div class="statsline">Work on: '+weak.map(function(x){return esc(x.l)+' ('+x.p+'%)'}).join(', ')+'</div>';
  return h;
}
function resumable(){var p=P.progress;return !!p&&(!!p.board||p.level>1||p.score>0)}
function applyProgress(p){
  S.level=Math.max(1,p.level|0);S.score=p.score|0;S.qCount=p.qCount|0;S.okCount=p.okCount|0;
  S.lifeBonus=p.lifeBonus|0;S.boom=p.boom|0;S.deck=[];S.hdeck=[];S.missed=[];
}
function restoreFlags(flags){
  S.arrows.forEach(function(a,i){
    var f=flags[i];if(!f)return;
    if(f.removed){a.removed=true;a.g.remove()}
    else if(f.unlocked){a.unlocked=true;a.g.classList.add('open')}
  });

}
function resume(){
  var p=P.progress;if(!p){newGame();return}
  applyProgress(p);startLevel(p);
}
function profileHTML(){
  if(P.user){
    return '<div class="profile"><div class="who"><b>'+esc(P.user.nom)+'</b>'+
      '<button class="btn" id="logout">Log out</button></div>'+statsHTML()+'</div>';
  }
  var su=P.mode==='signup';
  return '<div class="profile"><div class="tabs"><button class="tab'+(su?'':' on')+'" data-t="login">Log in</button><button class="tab'+(su?' on':'')+'" data-t="signup">Create my profile</button></div>'+
    '<input class="fld" id="fNom" placeholder="Your name (e.g. DUPONT Lea)" autocomplete="name" maxlength="40">'+
    '<input class="fld" id="fCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit secret code" autocomplete="off">'+
    '<p class="msg" id="pmsg">'+esc(P.msg)+'</p>'+

    '<p class="muted small">You need a profile to play. Your progress is saved online, so you can continue on any device.</p></div>';
}
function wireProfile(){
  var lo=$('#logout');if(lo)lo.addEventListener('click',logout);
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){P.mode=t.getAttribute('data-t');P.msg='';startScreen()});
  });
  var go=$('#pgo');
  if(go)go.addEventListener('click',function(){
    var su=P.mode==='signup';

/* ---------- ECRANS ---------- */
function screen(html){var s=$('#screen');s.innerHTML=html;s.classList.add('on');s.scrollTop=0}
function hideScreen(){$('#screen').classList.remove('on')}
function recapHTML(){
  if(!S.missed.length)return '<p>No mistakes this round. Well done.</p>';
  var h='<p class="big">To review ('+S.missed.length+')</p><div class="recap">';
  S.missed.forEach(function(it){h+='<div>'+fullSentence(it)+(it.t==='w'||it.t==='t'?'':'<br><em>'+esc(it.fr)+'</em>')+'</div>'});

function bannerHTML(){
  var W=11,H=6,ars=genFull(W,H,4,9),at={},out='';
  ars.forEach(function(a){a.path.forEach(function(p){at[p[0]+','+p[1]]=a})});

    var used={};
    a.path.forEach(function(p){DIRS.forEach(function(d){var o=at[(p[0]+d[0])+','+(p[1]+d[1])];if(o&&o!==a&&o.col!==undefined)used[o.col]=1})});
    var c=i%PALETTE.length,t=0;while(used[c]&&t<PALETTE.length){c=(c+1)%PALETTE.length;t++}
    a.col=c;
  });
  ars.forEach(function(a){
    var n=a.path.length,pts=a.path.map(function(p){return [p[0]+.5,p[1]+.5]}),h=pts[n-1],d=a.dir,pp=[-d[1],d[0]];
    if(n>1){var q=pts[n-2];pts[n-1]=[h[0]-d[0]*.25,h[1]-d[1]*.25]}

    var tp=[h[0]+d[0]*.46,h[1]+d[1]*.46],b1=[h[0]-d[0]*.18+pp[0]*.36,h[1]-d[1]*.18+pp[1]*.36],b2=[h[0]-d[0]*.18-pp[0]*.36,h[1]-d[1]*.18-pp[1]*.36];
    out+='<polygon points="'+[tp,b1,b2].map(function(p){return p[0].toFixed(2)+','+p[1].toFixed(2)}).join(' ')+'" fill="'+col+'" stroke="'+col+'" stroke-width=".08" stroke-linejoin="round"/>';
  });
  return '<svg class="banner" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+out+'</svg>';
}
function startScreen(){
  S.ended=true;S.pickMode=false;S.busy=false;hud();
  if(!Object.keys(S.cats).length)CATS.forEach(function(c){S.cats[c[0]]=true});
  var chips='';
  CATS.forEach(function(c){chips+='<button class="chip'+(S.cats[c[0]]?' on':'')+'" data-c="'+c[0]+'">'+c[1]+'</button>'});
  var rs=resumable(),btns;
  if(P.confirmNew){
    btns='<p class="msg">Start over? This erases your saved level and score.</p><div class="row"><button class="btn solid" id="yes">Yes, start over</button><button class="btn" id="no">Cancel</button></div>';
  }else if(rs){
    btns='<div class="row"><button class="btn solid" id="cont">Continue (level '+Math.max(1,P.progress.level|0)+', score '+(P.progress.score|0)+')</button><button class="btn" id="newg">New game</button></div>';
  }else{
    btns='<div class="row"><button class="btn solid" id="go">Start</button><button class="btn" id="allc">Select all</button></div>';
  }
  if(!P.user){chips='';btns=''}
  screen('<h1>ARROW <span>ESCAPE</span></h1><p class="big">TOEIC EDITION</p>'+bannerHTML()+profileHTML()+
    '<details class="rulebox"'+(P.user||rs?'':' open')+'><summary class="big">Directions</summary>'+
    '<ol class="rules"><li>Create a profile (your name and a 4-digit code) or log in to play.</li><li>Tap an arrow: a TOEIC question locks it.</li>'+
    '<li>Answer correctly and the arrow unlocks, then slides out in the direction of its point.</li>'+
    '<li>If another arrow is in the way, you crash and lose a life. A wrong answer costs a life too.</li>'+
    '<li>Clear every arrow to finish the level. Check which arrows have a clear path first!</li>'+
    '<li>Every 20 answers you earn a bonus question to win back a life. Every 10 correct answers you earn a BOOM: tap the BOOM button and 3 arrows blow up instantly (the ones blocking the most other arrows).</li></ol></details>'+
    (P.user?'<p class="big">Choose your question types</p><div class="chips">'+chips+'</div>'+btns:'')+
    '<p>Best score: <b class="big">'+S.best+'</b></p><p class="credit">A game by Marc VASSEUR / Polytech Lille</p>');
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-c'),on=Object.keys(S.cats).filter(function(x){return S.cats[x]});
      if(S.cats[k]&&on.length===1)return;
      S.cats[k]=!S.cats[k];b.classList.toggle('on',S.cats[k]);
    });
  });
  var allc=$('#allc');if(allc)allc.addEventListener('click',function(){CATS.forEach(function(c){S.cats[c[0]]=true});
    Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){b.classList.add('on')})});
  var go=$('#go');if(go)go.addEventListener('click',newGame);
  var cont=$('#cont');if(cont)cont.addEventListener('click',resume);
  var ng=$('#newg');if(ng)ng.addEventListener('click',function(){P.confirmNew=true;startScreen()});
  var yes=$('#yes');if(yes)yes.addEventListener('click',function(){P.confirmNew=false;newGame()});
  var no=$('#no');if(no)no.addEventListener('click',function(){P.confirmNew=false;startScreen()});
  wireProfile();
}
function newGame(){
  if(!P.user){startScreen();return}
  S.level=1;S.score=0;S.deck=[];S.hdeck=[];S.missed=[];
  S.qCount=0;S.okCount=0;S.lifeBonus=0;S.boom=0;
  startLevel();
}
function startLevel(saved){
  if(!P.user){startScreen();return}
  var sb=saved&&saved.board?saved.board:null;
  var g=sb?{W:sb.W,H:sb.H,arrows:sb.arrows.map(function(a,i){return {id:i,path:a.path,dir:a.dir}})}:generate(S.level);
  S.W=g.W;S.H=g.H;S.arrows=g.arrows;
  S.lives=sb?Math.max(1,saved.lives|0):MAXL;S.hints=sb?(saved.hints|0):3;
  S.sel=null;S.q=null;S.ctx=null;S.busy=false;S.ended=false;S.pickMode=false;S.pick=[];
  S.levelDone=false;S.nextLevel=0;S.active=true;S.stats.maxLevel=Math.max(S.stats.maxLevel,S.level);
  build();
  if(sb)restoreFlags(sb.arrows);
  hud();hideScreen();
  idle('Tap an arrow to unlock it.<br>Look for arrows with a clear path.');
  scheduleSave();
}
function saveBest(){
  if(S.score>S.best){S.best=S.score;try{localStorage.setItem('arrowToeicBest',String(S.best))}catch(e){}}
}
function levelComplete(){
  S.ended=true;S.levelDone=true;S.nextLevel=S.level+1;S.stats.levelsCleared++;
  var bonus=S.lives*20;S.score+=bonus;saveBest();hud();scheduleSave();flush();
  setTimeout(function(){
    screen('<h2>Level '+S.level+' cleared</h2><p>Bonus for remaining lives: <b class="big">+'+bonus+'</b><br>Score: <b class="big">'+S.score+'</b> (best: '+S.best+')</p>'+recapHTML()+
      '<div class="row"><button class="btn solid" id="nx">Next level</button><button class="btn" id="mn">Menu</button></div>');
    $('#nx').addEventListener('click',function(){S.level++;S.missed=[];startLevel()});
    $('#mn').addEventListener('click',startScreen);
  },450);
}
function gameOver(){
  S.ended=true;S.levelDone=true;S.nextLevel=S.level;saveBest();hud();scheduleSave();flush();
  setTimeout(function(){
    screen('<h2>Out of lives</h2><p>Level '+S.level+': score <b class="big">'+S.score+'</b> (best: '+S.best+')</p>'+recapHTML()+
      '<div class="row"><button class="btn solid" id="rt">Replay this level</button><button class="btn" id="mn">Menu</button></div>');
    $('#rt').addEventListener('click',function(){S.missed=[];startLevel()});
    $('#mn').addEventListener('click',startScreen);
  },700);
}

$('#hintBtn').addEventListener('click',hint);
$('#menuBtn').addEventListener('click',function(){scheduleSave();flush();startScreen()});
window.addEventListener('pagehide',function(){scheduleSave();flush()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){scheduleSave();flush()}});
$('#lifeBtn').addEventListener('click',function(){startBonus('life')});
$('#boomBtn').addEventListener('click',boomNow);
window.__g={P:P,snapshot:snapshot,scheduleSave:scheduleSave,flush:flush,S:S,generate:generate,countFree:countFree,blockDist:blockDist,NORMAL:NORMAL,HARD:HARD,CONN:CONN,VERBS:VERBS,WORDS:WORDS,params:params,answerMC:answerMC,makeQ:makeQ,MAXL:MAXL};
boot();
startScreen();
})();
</script>
</body>
</html>
