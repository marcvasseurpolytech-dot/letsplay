/* ------------------------------------------------------------

function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
let AC = null, master = null, muted = lsGet('tdMuted') === '1';

  if (!AC) {
    const A = window.AudioContext || window.webkitAudioContext;

  if (!pulseCache[d]) {
    const n = 40, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * d);
    pulseCache[d] = AC.createPeriodicWave(re, im);

  return pulseCache[d];
}

  o = o || {};
  if (muted || !audio()) return;
  const t = AC.currentTime + (o.delay || 0);
  const osc = AC.createOscillator(), g = AC.createGain();

function noise(dur, o) {
  o = o || {};

const SND = {

/* ============================================================

cv.width = W * SC; cv.height = H * SC;
const DIRS = { l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1] };

function blockedByRock(nx, ny, p) {

}
function updPlayer(dt) {
  const p = G.p; if (!p) return;

  if (G.bot) want = botDir();

  const sp = 118 * dt, curH = p.dir === 'l' || p.dir === 'r', wantH = want === 'l' || want === 'r';

/* ---------- pompe ---------- */
function releaseHose(hardBreak) {

  if (h.tgt) { h.tgt.hooked = false; h.tgt.defT = 0; }
  G.hose = null;
}

  if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) return;
  keys[e.key] = true;
  if (KEYDIR[e.key]) { pressDir(KEYDIR[e.key]); e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) action(); e.preventDefault(); }
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'm' || e.key === 'M') { muted = !muted; lsSet('tdMuted', muted ? '1' : '0'); }
});

let last = 0, acc = 0;

  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; acc += dt;

  requestAnimationFrame(frame);
}

function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function apiPost(action, body) {
  const h = { 'Content-Type': 'application/json' };
  if (PR.token) h.Authorization = 'Bearer ' + PR.token;
  try {
    return fetch(API, { method: 'POST', headers: h, keepalive: true, body: JSON.stringify(Object.assign({ action, game: 'td' }, body || {})) })
      .then((r) => r.json().catch(() => ({})).then((j) => ({ ok: r.ok, status: r.status, j })))
      .catch(() => ({ ok: false, status: 0, j: { error: 'No connection to the server.' } }));
  } catch (e) { return Promise.resolve({ ok: false, status: 0, j: { error: 'No connection to the server.' } }); }
}
function localKey() { return 'tdProg:' + (PR.user ? PR.user.key : 'guest'); }
function adopt(tn) {
  let loc = null; try { loc = JSON.parse(lsGet(localKey()) || 'null'); } catch (e) {}
  const words = {};
  [tn && tn.words, loc && loc.words].forEach((w) => { if (w) Object.keys(w).forEach((k) => { words[k] = Math.max(words[k] || 0, w[k] | 0); }); });
  PR.words = words;
  ['best', 'runs', 'destroyed', 'qOk', 'qN'].forEach((k) => { PR[k] = Math.max((tn && tn[k]) | 0, (loc && loc[k]) | 0); });
  PR.maxRound = Math.max(1, (tn && tn.maxRound) | 0, (loc && loc.maxRound) | 0);
  let cp = null, at = -1;
  [tn, loc].forEach((q) => { const t = Number(q && q.savedAt) || 0; if (q && q.cp && t >= at) { cp = q.cp; at = t; } });
  if (cp) PR.cp = cp;
  collection = new Set(Object.keys(PR.words));
}
function snapshot() {
  PR.best = Math.max(PR.best, G.score); PR.maxRound = Math.max(PR.maxRound, G.round);
  return { words: PR.words, best: PR.best, runs: PR.runs, maxRound: PR.maxRound, destroyed: PR.destroyed, qOk: PR.qOk, qN: PR.qN, cp: PR.cp, savedAt: Date.now() };
}
function scheduleSave() {
  if (!PR.user) return;
  lsSet(localKey(), JSON.stringify(snapshot()));
  PR.dirty = true; PR.status = 'Saving soon...';
  clearTimeout(PR.timer); PR.timer = setTimeout(flush, 6000);
}
function flush() {
  clearTimeout(PR.timer);
  if (!PR.user || !PR.token || !PR.dirty) return;
  if (PR.flight) { PR.timer = setTimeout(flush, 2500); return; }
  PR.dirty = false; PR.flight = true; PR.status = 'Saving...';
  apiPost('save', { progress: snapshot() }).then((r) => {
    PR.flight = false;
    if (r.status === 401) { PR.token = null; saveSession(); PR.status = 'Session expired. Log in again to keep saving online.'; return; }
    if (!r.ok) { PR.dirty = true; PR.status = 'Not saved online (kept on this device). Retrying.'; PR.timer = setTimeout(flush, 20000); return; }
    PR.status = 'Saved to your profile.';
    if (r.j && r.j.td) adopt(r.j.td);
  });
}
function saveSession() { if (PR.user && PR.token) lsSet('letsplaySession', JSON.stringify({ user: PR.user, token: PR.token })); else lsDel('letsplaySession'); }
function onAuth(j) { PR.user = j.user; PR.token = j.token; PR.msg = ''; PR.offline = false; adopt(j.td); saveSession(); PR.ready = true; renderAuth(); }
function logout() {
  flush(); PR.user = null; PR.token = null; PR.words = {}; PR.best = 0; PR.runs = 0; PR.maxRound = 1; PR.destroyed = 0; PR.qOk = 0; PR.qN = 0; PR.cp = null; PR.guest = false;
  try { collection = new Set(JSON.parse(lsGet('tdLearned') || '[]')); } catch (e) { collection = new Set(); }
  saveSession(); renderAuth();
}
function profStart() { if (PR.user) { PR.runs++; scheduleSave(); } }
function profWord(inf) {
  collection.add(inf);
  if (PR.user) { PR.words[inf] = (PR.words[inf] || 0) + 1; PR.destroyed++; scheduleSave(); } else saveCollection();
}
function setCheckpoint() { PR.cp = { round: G.round, score: G.score, }; if (PR.user) scheduleSave(); }
function profEnd() { if (PR.user) { lsSet(localKey(), JSON.stringify(snapshot())); PR.dirty = true; flush(); } }
function restoreSession() {
  let ss = null; try { ss = JSON.parse(lsGet('letsplaySession') || 'null'); } catch (e) {}
  if (!ss || !ss.user || !ss.token) { PR.ready = true; renderAuth(); return; }
  PR.user = ss.user; PR.token = ss.token;
  adopt(null); PR.ready = true; renderAuth();
  apiPost('load').then((r) => {
    if (r.status === 401) { PR.user = null; PR.token = null; saveSession(); renderAuth(); return; }
    if (r.ok) { adopt(r.j.td); renderAuth(); if (PR.dirty) flush(); } else if (r.status === 0) { PR.offline = true; renderAuth(); }
  });
}
function hasCheckpoint() { return !!(PR.cp && (PR.cp.round > 1 || PR.cp.score > 0)); }
function canStart() { return PR.guest || !!PR.user; }
function renderAuth() {
  const box = document.getElementById('authBox');
  if (!box) return;
  const $ = (q) => box.querySelector(q);
  const ov = document.getElementById('auth'); ov.classList.toggle('min', !!PR.min);
  if (PR.min) {
    box.innerHTML = '<button class="btn sm" id="aMax">&#9660; ' + (PR.user ? 'PLAY / CONTINUE' : (PR.guest ? 'PLAY' : 'LOG IN / PLAY')) + '</button>';
    $('#aMax').addEventListener('click', () => { PR.min = false; renderAuth(); });

  }

  if (PR.user) {
    const cp = hasCheckpoint();
    h += '<p class="sub">Pump the verb monsters: 1 = preterit, 2 = past participle, 3 = BOOM and the French.</p>' +
      '<div class="who"><span>Logged in as <b>' + esc(PR.user.nom) + '</b></span><button class="btn sm ghost" id="aOut">Log out</button></div>' +
      '<div class="stats"><div class="stat"><b>' + collection.size + ' / ' + VERBS.length + '</b><span>verbs burst</span></div>' +
      '<div class="stat"><b>' + PR.best + '</b><span>best score</span></div>' +
      '<div class="stat"><b>' + PR.maxRound + '</b><span>best round</span></div></div>' +
      (PR.confirm && cp ? '<p class="msg" style="color:#ff6a6a;text-align:center"><b>WATCH OUT!</b> If you click YES, your saved game (round ' + PR.cp.round + ', score ' + PR.cp.score + ') will be erased for good.</p><div class="row"><button class="btn" id="aYes">YES, ERASE AND START OVER</button><button class="btn ghost" id="aNo">NO, GO BACK</button></div>' : '<div class="row">' + (cp ? '<button class="btn" id="aCont">CONTINUE FROM ROUND ' + PR.cp.round + '<br><small>score ' + PR.cp.score + ' | answer 3 grammar questions</small></button>' : '') +
      '<button class="btn' + (cp ? ' ghost' : '') + '" id="aNew">NEW GAME</button></div>') +
      '<p class="msg" style="color:#a9b3c9">' + esc(PR.status) + '</p>' +
      '<details><summary>Verbs burst (' + collection.size + ' / ' + VERBS.length + ')</summary><div class="words">' +
      VERBS.slice().sort((p, q) => ((collection.has(q[0]) ? 1 : 0) - (collection.has(p[0]) ? 1 : 0))).map((v) => collection.has(v[0])
        ? '<div class="w"><b>' + esc(v[0]) + '</b> ' + esc(v[1]) + ' ' + esc(v[2]) + ' <i style="color:#ffd23a;font-style:normal">' + esc(v[3]) + '</i></div>'
        : '<div class="w no">' + esc(v[0]) + ' = ?</div>').join('') + '</div></details>';
  } else if (PR.guest) {
    h += '<p class="sub">Guest mode: nothing is saved online.</p><div class="row"><button class="btn" id="aNew">PLAY</button></div>';
  } else {
    const su = PR.mode === 'signup';
    h += '<p class="sub">Log in to play. Your verbs and your round are saved.</p>' +
      '<div class="tabs"><button class="tab' + (su ? '' : ' on') + '" data-t="login">Log in</button><button class="tab' + (su ? ' on' : '') + '" data-t="signup">Create my profile</button></div>' +
      '<input id="fNom" placeholder="Your name (e.g. DUPONT Lea)" autocomplete="name" maxlength="40">' +
      '<input id="fCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit secret code" autocomplete="off">' +
      '<p class="msg" id="aMsg">' + esc(PR.msg) + '</p>' +
      '<div class="row"><button class="btn" id="aGo">' + (su ? 'Create profile' : 'Log in') + '</button></div>' +
      (PR.offline ? '<div class="row"><button class="btn ghost" id="aGuest">Server unreachable: play as guest (not saved)</button></div>' : '') +
      '<p class="muted">It is the same profile as in Scramble, Arrow Escape, Word Bridge and Christmas Village.</p>';
  }

  h += '<details><summary>Directions</summary><p class="muted">Arrows or WASD: dig and move. Space or click: fire the pump; when it hooks a monster, press again to pump.<br>Each monster is an irregular verb in English. Pump 1 = preterit, pump 2 = past participle, pump 3 = it bursts and shows the French. If you stop pumping, it deflates.<br>The list on the right gives the verbs in French: burst the monsters in that order for a bonus (chain x2, x3...), and a perfect order gives a big bonus at the end of the round.<br>Dig under a rock to drop it on the monsters. Dinos breathe fire. Ghost monsters (just eyes) can pass through the earth.<br>When you lose your last life, your round is saved. To continue, answer 3 grammar questions (10 seconds each): each wrong answer or timeout costs you one life.</p></details>';
  box.innerHTML = h;
  { const fn = $('#fNom'); if (fn) { fn.value = PR.draft; fn.addEventListener('input', () => { PR.draft = fn.value; }); } }
  box.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { PR.mode = t.getAttribute('data-t'); PR.msg = ''; renderAuth(); }));

  if (go) {

  const yes = $('#aYes'); if (yes) yes.addEventListener('click', () => { audio(); PR.confirm = false; if (canStart() && G.state === 'title') newGame(); });

function syncAuth() {
  const want = G.state === 'title' && !QZ;
  if (want === PR.shown) return;
  PR.shown = want; if (want) { PR.min = false; PR.confirm = false; }
  document.getElementById('auth').classList[want ? 'add' : 'remove']('on');
  if (want) renderAuth();
}

/* ------------------------------------------------------------
   Quiz de reprise : 3 bonnes réponses de grammaire (phrases à trous, banque partagée avec Word Bridge)
   ------------------------------------------------------------ */
const QTYPES = ['c', 'v', 'f', 'p', 'x', 'l'];
let QZ = null;
function qPool() {
  const B = window.WB_BANK;
  if (!B || !B.NORMAL) return [];
  return B.NORMAL.filter((q) => q.s && q.o && q.o.length >= 3 && q.s.indexOf('___') >= 0 && QTYPES.indexOf(q.t) >= 0);
}
function openQuiz(onDone, onCancel) {
  const pool = shuffle(qPool());
  if (!pool.length) { onDone(); return; }
  QZ = { ok: 0, need: 3, done: 0, res: [], wrong: 0, tl: 10, timer: null, pool, idx: 0, q: null, opts: [], answered: false, last: '', onDone, onCancel };
  document.getElementById('auth').classList.remove('on'); PR.shown = false;
  nextQuestion();
  document.getElementById('quiz').classList.add('on');
}
function nextQuestion() {
  let k = QZ.idx;
  while (k < QZ.pool.length - 1 && QZ.pool[k].t === QZ.last) k++;      // varier les types de questions
  const q = QZ.pool.splice(k, 1)[0];
  QZ.q = q; QZ.last = q.t; QZ.opts = shuffle(q.o.slice()); QZ.answered = false;
  renderQuiz(); startQTimer();
}
function stopQTimer() { if (QZ && QZ.timer) { clearInterval(QZ.timer); QZ.timer = null; } }
function startQTimer() {
  stopQTimer(); QZ.tl = 10; QZ.t0 = performance.now();
  const z = QZ;
  z.timer = setInterval(() => {
    if (QZ !== z || z.answered) { clearInterval(z.timer); z.timer = null; return; }
    z.tl = Math.max(0, 10 - (performance.now() - z.t0) / 1000);
    const bar = document.querySelector('#quizBox .tbar'), fill = bar && bar.firstChild;
    if (fill) { fill.style.width = (z.tl * 10) + '%'; bar.classList.toggle('low', z.tl <= 3); }
    if (z.tl <= 0) answerQuestion(-1);
  }, 100);
}
function renderQuiz() {
  const box = document.getElementById('quizBox'), q = QZ.q;
  const sentence = esc(q.s).replace('___', '<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  let dots = ''; for (let i = 0; i < QZ.need; i++) dots += QZ.res[i] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[i] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.innerHTML = '<h2>BACK IN THE GAME</h2><p class="sub">Answer 3 grammar questions to continue (3 questions, no more). You have 10 seconds per question.</p>' +
    '<p class="pen">Each wrong answer or timeout costs you one life when the game restarts' + (QZ.wrong ? ' (so far ' + Math.min(2, QZ.wrong) + ')' : '') + '</p>' +
    '<div class="tbar"><i></i></div><div class="dots">' + dots + '</div>' +
    '<div class="qs">' + sentence + '</div><div class="opts">' + QZ.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<div class="fb" id="qfb"></div><div class="row"><button class="btn" id="qNext" style="display:none"></button>' + (QZ.onCancel !== undefined ? '<button class="btn ghost sm" id="qBack">Back</button>' : '') + '</div>';
  box.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => answerQuestion(parseInt(b.getAttribute('data-i'), 10))));
  const bk = box.querySelector('#qBack'); if (bk) bk.addEventListener('click', closeQuiz);
}
function answerQuestion(i) {
  if (!QZ || QZ.answered) return;
  QZ.answered = true; stopQTimer();
  const q = QZ.q, good = i >= 0 && QZ.opts[i] === q.o[0], box = document.getElementById('quizBox');
  PR.qN++; QZ.done++; QZ.res.push(good ? 1 : 0); if (good) { PR.qOk++; QZ.ok++; } else QZ.wrong++;
  if (PR.user) scheduleSave();
  box.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (QZ.opts[k] === q.o[0]) b.classList.add('ok'); else if (k === i) b.classList.add('no'); });
  const dn = QZ.done >= QZ.need;
  box.querySelector('#qfb').innerHTML = (good ? '<b class="g">Correct!</b>' : '<b class="r">' + (i < 0 ? 'Time is up!' : 'Not quite.') + '</b> The answer is <b class="g">' + esc(q.o[0]) + '</b>.') + (q.fr ? '<br><i>' + esc(q.fr) + '</i>' : '') + (QZ.wrong ? '<br><b class="r">You will restart with ' + Math.max(1, 3 - QZ.wrong) + ' ' + (3 - QZ.wrong > 1 ? 'lives' : 'life') + '.</b>' : '');
  const nx = box.querySelector('#qNext'); nx.style.display = ''; nx.innerHTML = dn ? 'CONTINUE' : 'NEXT QUESTION (' + (QZ.done + 1) + ' / ' + QZ.need + ')';
  let dots = ''; for (let k = 0; k < QZ.need; k++) dots += QZ.res[k] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[k] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.querySelector('.dots').innerHTML = dots;
  nx.addEventListener('click', () => { if (dn) { const f = QZ.onDone, w = QZ.wrong; QZ = null; document.getElementById('quiz').classList.remove('on'); f(w); } else nextQuestion(); });
}
function closeQuiz() {
  stopQTimer();
  const cb = QZ && QZ.onCancel; QZ = null; document.getElementById('quiz').classList.remove('on');
  if (cb) cb();
}
restoreSession();
try { window.addEventListener('pagehide', () => flush()); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); }); } catch (e) {}

function boot() { requestAnimationFrame((t) => { last = t; frame(t); }); }
let booted = false; const go = () => { if (!booted) { booted = true; boot(); } };
if (document.fonts && document.fonts.load) { Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('62px "Press Start 2P"')]).then(go, go); setTimeout(go, 1500); } else go();

window.__td = { PR, openQuiz, qState: () => QZ, answerQuestion, renderAuth, G, VERBS, update, draw, newGame, action, pump, popMonster, genLevel, startRound, openSeg, isOpen, killPlayer, computeDist, dirStack, pressDir, releaseDir, collection, SND };
