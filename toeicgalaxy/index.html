function apiPost(action, body) {

}

function flush() {
  clearTimeout(PR.timer);
  if (!PR.user || !PR.token || !PR.dirty) return;
  if (PR.flight) { PR.timer = setTimeout(flush, 2500); return; }
  PR.dirty = false; PR.flight = true; PR.status = 'Saving...';

    if (!r.ok) { PR.dirty = true; PR.status = 'Not saved online (kept on this device). Retrying.'; PR.timer = setTimeout(flush, 20000); return; }
    PR.status = 'Saved to your profile.';

}
function saveSession() { if (PR.user && PR.token) lsSet('letsplaySession', JSON.stringify({ user: PR.user, token: PR.token })); else lsDel('letsplaySession'); }

  h += '<details><summary>Directions</summary><p class="muted">Left / right arrows (or A / D) or the mouse: move the ship. <b>Up arrow</b> (or space, or click): fire (hold to keep firing).<br>Each stage has 3 questions in a row (a sentence with a gap, or an irregular verb): after a right answer the correct sentence and its French stay on screen for a moment, then four new chiefs drop in with a new question while the remaining insects stay where they are (the missing ones come back). After the third question you move on to the next stage. Four green chiefs carry the answers. Each chief is protected by a shield bubble worth 10 hits (the ring around it shows what is left). If you stop firing for a moment the shield slowly rebuilds, and a broken shield comes back after a few seconds, so keep shooting. Then shoot the right chief twice (the first hit turns it blue) to answer the question. The French translation appears afterwards.<br>A wrong chief costs 50 points, breaks your streak and sends other insects diving. Streaks raise your multiplier up to x4. Some chiefs are armoured (3 shots), chiefs swap places, and a wrong chief may dive at you as a kamikaze (shoot it, no penalty).<br>When a chief with a wrong irregular verb explodes, the three forms and the French appear and everything else disappears for 2 seconds so you can read them.<br>Insects dive and shoot. A chief may fire a tractor beam from the top of the screen and slide towards you: nothing can hurt you while it is active, so dodge it or shoot the chief. There is no beam when you have only one ship left. If you are captured, free the ship by shooting its captor: you get the lost ship back (+1 ship) and a dual fighter.<br>Now and then a mystery UFO (?) crosses the screen above your ship: shoot it for a random surprise (jackpot, time stop, triple shot, shields down, x-ray on the right answer, extra ship... or a meteor shower).<br>Catch the falling capsules. Green: T triple shot, Z shield for 5 seconds, S enemies slowed, L extra ship. Red: B ship jammed for a moment, F very slow fire.<br><b>Upgrades:</b> catch the capsules. R red laser (pierces), Y yellow fan, C blue ricochet (take the same colour again to level it up to 3), P the power beam (hold fire for 3 seconds, a gauge fills under your ship, then release: the beam strips 50% of the shield of the chiefs in its column and destroys the insects it crosses; while the beam is owned, holding fire no longer shoots, it only charges the beam, and a quick tap fires a normal shot; capsule upgrades last 5 seconds), O a bit that fires with you, M homing missiles. Hold <b>X</b> to charge the wave cannon and release: it pierces a whole column and hurts shields. Dying costs you the capsules you picked up, but not the upgrades you chose. After each stage pick 1 of 3 permanent upgrades (2 picks if you made no mistake).<br>The enemies adapt: a streak of right answers raises the THREAT bar (more divers, faster shots), a lost ship lowers it. Insects evolve over time, golden ones split in two, chiefs start shooting from the second question and open a weak point on the right chief at the third.<br>Every 5th stage is a bonus stage with no question: hit them all for a perfect bonus.<br>When you lose your last ship, your stage is saved. To continue, answer 3 grammar questions (10 seconds each): each wrong answer or timeout costs you one ship.</p></details>';

function syncAuth() {

/* ------------------------------------------------------------
   Quiz de reprise : 3 bonnes réponses de grammaire (phrases à trous, banque partagée avec Word Bridge)
   ------------------------------------------------------------ */
const QTYPES = ['c', 'v', 'f', 'p', 'x', 'l'];
let QZ = null;
function qPool() {
  const B = window.WB_BANK;
  if (!B || !B.NORMAL) return [];
  return B.NORMAL.filter((q) => q.s && q.o && q.o.length >= 3 && q.s.indexOf('___') >= 0 && QTYPES.indexOf(q.t) >= 0);
}
function openQuiz(onDone, onCancel) {
  const pool = shuffle(qPool());
  if (!pool.length) { onDone(); return; }
  QZ = { ok: 0, need: 3, done: 0, res: [], wrong: 0, tl: 10, timer: null, pool, idx: 0, q: null, opts: [], answered: false, last: '', onDone, onCancel };
  document.getElementById('auth').classList.remove('on'); PR.shown = false;
  nextQuestion();
  document.getElementById('quiz').classList.add('on');
}
function nextQuestion() {
  let k = QZ.idx;
  while (k < QZ.pool.length - 1 && QZ.pool[k].t === QZ.last) k++;      // varier les types de questions
  const q = QZ.pool.splice(k, 1)[0];
  QZ.q = q; QZ.last = q.t; QZ.opts = shuffle(q.o.slice()); QZ.answered = false;
  renderQuiz(); startQTimer();
}
function stopQTimer() { if (QZ && QZ.timer) { clearInterval(QZ.timer); QZ.timer = null; } }
function startQTimer() {
  stopQTimer(); QZ.tl = 10; QZ.t0 = performance.now();
  const z = QZ;
  z.timer = setInterval(() => {
    if (QZ !== z || z.answered) { clearInterval(z.timer); z.timer = null; return; }
    z.tl = Math.max(0, 10 - (performance.now() - z.t0) / 1000);
    const bar = document.querySelector('#quizBox .tbar'), fill = bar && bar.firstChild;
    if (fill) { fill.style.width = (z.tl * 10) + '%'; bar.classList.toggle('low', z.tl <= 3); }
    if (z.tl <= 0) answerQuestion(-1);
  }, 100);
}
function renderQuiz() {
  const box = document.getElementById('quizBox'), q = QZ.q;
  const sentence = esc(q.s).replace('___', '<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  let dots = ''; for (let i = 0; i < QZ.need; i++) dots += QZ.res[i] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[i] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.innerHTML = '<h2>BACK IN THE GAME</h2><p class="sub">Answer 3 grammar questions to continue (3 questions, no more). You have 10 seconds per question.</p>' +
    '<p class="pen">Each wrong answer or timeout costs you one life when the game restarts' + (QZ.wrong ? ' (so far ' + Math.min(2, QZ.wrong) + ')' : '') + '</p>' +
    '<div class="tbar"><i></i></div><div class="dots">' + dots + '</div>' +
    '<div class="qs">' + sentence + '</div><div class="opts">' + QZ.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<div class="fb" id="qfb"></div><div class="row"><button class="btn" id="qNext" style="display:none"></button>' + (QZ.onCancel !== undefined ? '<button class="btn ghost sm" id="qBack">Back</button>' : '') + '</div>';
  box.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => answerQuestion(parseInt(b.getAttribute('data-i'), 10))));
  const bk = box.querySelector('#qBack'); if (bk) bk.addEventListener('click', closeQuiz);
}
function answerQuestion(i) {
  if (!QZ || QZ.answered) return;
  QZ.answered = true; stopQTimer();
  const q = QZ.q, good = i >= 0 && QZ.opts[i] === q.o[0], box = document.getElementById('quizBox');
  PR.qN++; QZ.done++; QZ.res.push(good ? 1 : 0); if (good) { PR.qOk++; QZ.ok++; } else QZ.wrong++;
  if (PR.user) scheduleSave();
  box.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (QZ.opts[k] === q.o[0]) b.classList.add('ok'); else if (k === i) b.classList.add('no'); });
  const dn = QZ.done >= QZ.need;
  box.querySelector('#qfb').innerHTML = (good ? '<b class="g">Correct!</b>' : '<b class="r">' + (i < 0 ? 'Time is up!' : 'Not quite.') + '</b> The answer is <b class="g">' + esc(q.o[0]) + '</b>.') + (q.fr ? '<br><i>' + esc(q.fr) + '</i>' : '') + (QZ.wrong ? '<br><b class="r">You will restart with ' + Math.max(1, 3 - QZ.wrong) + ' ' + (3 - QZ.wrong > 1 ? 'lives' : 'life') + '.</b>' : '');
  const nx = box.querySelector('#qNext'); nx.style.display = ''; nx.innerHTML = dn ? 'CONTINUE' : 'NEXT QUESTION (' + (QZ.done + 1) + ' / ' + QZ.need + ')';
  let dots = ''; for (let k = 0; k < QZ.need; k++) dots += QZ.res[k] === 1 ? '<span class="g">&#9679;</span>' : QZ.res[k] === 0 ? '<span class="r">&#9679;</span>' : '&#9675;';
  box.querySelector('.dots').innerHTML = dots;
  nx.addEventListener('click', () => { if (dn) { const f = QZ.onDone, w = QZ.wrong; QZ = null; document.getElementById('quiz').classList.remove('on'); f(w); } else nextQuestion(); });
}
function closeQuiz() {
  stopQTimer();
  const cb = QZ && QZ.onCancel; QZ = null; document.getElementById('quiz').classList.remove('on');
  if (cb) cb();
}
